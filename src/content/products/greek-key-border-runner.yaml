en:
  name: Hallway Runner with Greek Key Border
  directAnswer: This is a hallway carpet runner with a plain centre and a double ivory Greek key border on both sides. It comes in taupe, teal and red, and is cut to the length you need for hallways, villa entrances and majlis rooms. Sold by the m² and cut to your hallway length, from 5 to 15 KWD per m² (0.465 to 1.394 KWD per sq ft) depending on thickness and density.
  usage: The border runs in a straight line along the hallway, so it suits long corridors, villa entrances, majlis rooms and hotel corridors. Red is suited to entrances and occasions, while taupe and teal suit everyday hallways and stair landings.
  care: Vacuum regularly, and blot spills straight away with a damp cloth without rubbing, especially on the ivory border.
  seoTitle: Hallway Runner with Greek Key Border in Kuwait | Sajjadko Kuwait
  seoDescription: Carpet runner with a Greek key border in taupe, teal and red, cut to any length for hallways and entrances in Kuwait. 5 to 15 KWD per m².
  faq:
  - q: How much does the Hallway Runner with Greek Key Border cost in Kuwait?
    a: 'Runners are priced per m², from 5 to 15 KWD (0.465 to 1.394 KWD per sq ft) depending on thickness and density. Multiply length by width for the area: a 0.8 × 5 m (2.6 × 16.4 ft) runner is 4 m², so 20 to 60 KWD before installation.'
  - q: Can you cut a long hallway runner, like 15 ft or 20 ft?
    a: Yes. We cut the runner to the exact length you need, so you are not limited to stock sizes. 15 ft is about 4.6 m and 20 ft about 6.1 m. Send your hallway length and width on WhatsApp, in metres or feet, and we confirm before cutting.
  - q: Is this runner suitable for a bedroom or an entrance?
    a: Yes. The red version is commonly chosen for entrances and occasions, and taupe or teal suit a bedroom corridor. Because it is cut to length, it can run the full depth of a villa entrance or fit a short space beside the bed.
  - q: How do I measure my hallway for a runner?
    a: Measure the full length, and the width at the narrowest point. Leave an even strip of floor on each side, usually 10 to 20 cm (4 to 8 in). Check that doors opening over the runner have enough clearance, then send the numbers on WhatsApp.
  - q: Do you install carpet runners?
    a: Yes, we install the runners we supply. Installation is priced separately and agreed by area and location, and we follow up for two days after installation to fix any installation error. We do not install carpet bought elsewhere.
  - q: Is the home visit and measuring free?
    a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
