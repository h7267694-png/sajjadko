ar:
  name: سجاد ممر بإطار المفتاح اليوناني
  directAnswer: 'سجاد ممرات بلون سادة في الوسط وإطار مزدوج بنقشة المفتاح اليوناني العاجية على الجانبين، بثلاثة ألوان: رمادي بني وأزرق مخضر وأحمر. يُقص بالطول الذي تحتاجه للممرات والمداخل والمجالس. يُباع بالمتر المربع ويُقص على طول ممرك، والسعر من 5 إلى 15 د.ك للمتر المربع حسب السماكة والكثافة.'
  usage: يمتد الإطار بخط مستقيم على طول الممر، فيناسب الممرات الطويلة ومداخل الفلل والمجالس وممرات الفنادق. الأحمر يناسب المداخل والمناسبات، والرمادي البني والأزرق المخضر للممرات اليومية.
  care: نظّفه بالمكنسة الكهربائية بانتظام، وعالج البقع فور وقوعها بقطعة قماش مبللة دون فرك، خصوصًا على الإطار العاجي.
  seoTitle: سجاد ممر بإطار المفتاح اليوناني في الكويت — سجادكو الكويت
  seoDescription: سجاد ممرات بإطار المفتاح اليوناني بثلاثة ألوان للممرات والمداخل والمجالس، يُقص بالطول من 5 إلى 15 د.ك للمتر المربع.
  faq:
  - q: كم سعر سجاد الممر بإطار المفتاح اليوناني بالمتر؟
    a: 'يُسعّر بالمتر المربع من 5 إلى 15 د.ك حسب السماكة والكثافة. اضرب الطول في العرض لتعرف المساحة: مدة 0.8 × 5 م مساحتها 4 م²، فكلفتها بين 20 و60 د.ك قبل التركيب.'
  - q: هل تقصّونها بطول ممر طويل؟
    a: نعم، نقص المدة على الطول الذي تحتاجه بالضبط، فلا يقيدك مقاس جاهز. أرسل طول الممر وعرضه عبر واتساب، ونراجع المقاس معك قبل القص لأن القص لا يُعاد.
  - q: كيف أقيس الممر؟
    a: قس الطول كاملًا والعرض في أضيق نقطة، واترك من الأرضية على كل جانب ما بين 10 و20 سم. تأكد أن الأبواب التي تُفتح فوق المدة تتسع لسماكتها، ثم أرسل الأرقام عبر واتساب.
  - q: هل تركّبون المدات؟
    a: نعم، نركّب المدات التي نوفرها، وأجرة التركيب منفصلة وتُتفق حسب المساحة والموقع، ونتابع معك يومين بعد التركيب لمعالجة أي خطأ. ولا نركّب سجادًا اشتريته من غيرنا.
  - q: هل الزيارة والقياس مجانًا؟
    a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
