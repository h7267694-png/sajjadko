ar:
  name: سجاد حفر يدوي كريمي بإطار كحلي وصرة بنية
  directAnswer: سجاد حفر يدوي بأرضية كريمية، بإطار خارجي من زخارف كحلية ملتفة بلمسات ذهبية، ثم إطارين بني وذهبي، وفي الوسط صرة مربعة بزخارف كحلية وبنية. محفور يدويًا ويُفصّل بالمقاس والألوان، والسعر حسب المواصفات عبر واتساب.
  usage: يناسب الصالات والمجالس المربعة، وتتناسق ألوانه الكحلية والبنية مع الأثاث الكريمي والخشبي.
  care: نظّفه بالمكنسة الكهربائية بانتظام في اتجاه الوبر، وامسح البقع فور وقوعها دون فرك حتى تبقى حواف الحفر واضحة.
  seoTitle: سجاد حفر يدوي كريمي بإطار كحلي وصرة بنية — حفر يدوي بالكويت
  seoDescription: سجاد حفر يدوي كريمي بإطار زخارف كحلية وإطارين بني وذهبي وصرة مربعة، تفصيل سجاد للصالات والمجالس في الكويت. السعر حسب المواصفات.
  reviewed: true
  faq:
  - q: كم سعره؟
    a: السعر حسب المقاس وحجم النقشة وعدد ألوانها والمواصفات التي تختارها. أرسل المقاس عبر واتساب ونرسل لك السعر قبل البدء.
  - q: هل أستطيع تغيير النقشة أو الألوان؟
    a: نعم، ننفذ النقشة نفسها بألوانك أو بمقاس مختلف، أو نحفر نقشة ترسلها أنت، ونؤكد معك الرسم والألوان قبل البدء.
  - q: هل الزيارة والقياس مجانًا؟
    a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Cream Hand-Carved Rug with a Navy Border and Brown Medallion
  directAnswer: A hand-carved rug with a cream ground, an outer border of navy scrolls with gold touches, brown and gold inner frames and a square centre medallion in navy and brown. Made to your size and colours; priced by specification on WhatsApp.
  usage: It suits square living rooms and majlis rooms, and the navy and brown tones match cream and wooden furniture.
  care: Vacuum regularly along the pile and blot spills straight away without rubbing so the carved edges stay crisp.
  seoTitle: Cream Hand-Carved Rug, Navy Border, Brown Medallion | Sajjadko
  seoDescription: Cream hand-carved rug with a navy scroll border, brown and gold frames and a square medallion, made to size for living rooms in Kuwait.
  reviewed: true
  faq:
  - q: How much is it?
    a: Priced by size, design size, number of colours and the specification you choose. Send the size on WhatsApp for a price before we start.
  - q: Can I change the design or colours?
    a: Yes. We make this design in your colours or size, or carve a design you send, and confirm the drawing and colours before starting.
  - q: Is the home visit and measuring free?
    a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
