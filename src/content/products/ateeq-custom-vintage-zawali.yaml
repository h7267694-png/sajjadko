ar:
  name: زولية تفصيل بنقش كلاسيكي
  directAnswer: زولية تفصيل بنقش كلاسيكي باهت بدرجات الرمادي الفاتح والبيج والعاجي. تُفصّل بالمقاس الذي يغطي منطقة الجلسة، وبوبر قصير سهل التنظيف. سعر التفصيل حسب المقاس والتشطيب، ونؤكده عبر واتساب.
  usage: نفذناها لصالة بكنب بيج بقاعدة ذهبية ومخدات عنابية وطاولة وسط خشبية داكنة. تناسب الصالات والمجالس التي يُطلب فيها نقش كلاسيكي بألوان فاتحة، وتخفي ألوانها المتداخلة آثار الاستعمال اليومي.
  care: نظّفها بالمكنسة الكهربائية بانتظام، وامسح البقع فور وقوعها بقطعة قماش مبللة دون فرك. الوبر القصير لا يحبس الغبار كالوبر الطويل.
  seoTitle: زولية تفصيل بنقش كلاسيكي في الكويت — سجادكو الكويت
  seoDescription: زولية تفصيل بنقش كلاسيكي باهت بالرمادي والبيج للصالات والمجالس. تفصيل زوالي على المقاس في الكويت، والسعر عبر واتساب.
  reviewed: true
  faq:
    - q: كم سعر تفصيل زولية بنقش كلاسيكي؟
      a: السعر حسب مقاس الزولية والتشطيب. أرسل طول منطقة الجلسة وعرضها عبر واتساب، ونؤكد لك السعر قبل البدء.
    - q: هل تناسب الأثاث الحديث؟
      a: نعم، النقش كلاسيكي وألوانه الباهتة من الرمادي والبيج تتناسق مع الكنب الفاتح والطاولات الخشبية والذهبي.
    - q: هل تخفي البقع وآثار الاستعمال؟
      a: نعم، تداخل الألوان والنقش الباهت يخفي آثار الاستعمال اليومي أكثر من الزوالي ذات اللون الواحد الفاتح.
    - q: هل هذه زولية جاهزة؟
      a: لا، هذه زولية تفصيل بالمقاس الذي تطلبه. ونوفر أيضًا زوالي جاهزة بالمقاسات الشائعة، وزوالي تُقص بالمتر.
en:
  name: Custom Rug with a Classic Pattern
  directAnswer: This is a custom-made rug with a faded classic pattern in light grey, beige and ivory. It is made to the size that covers your seating area, with a short pile that is easy to clean. Custom pricing depends on size and finishing; we confirm it on WhatsApp.
  usage: We made it for a living room with beige sofas on a gold base, burgundy cushions and a dark wood coffee table. It suits living rooms and majlis rooms that require a classic pattern in light colours, and the blended tones hide everyday wear.
  care: Vacuum regularly and blot spills straight away with a damp cloth. The short pile holds less dust than a long pile.
  seoTitle: Custom Rug with a Classic Pattern in Kuwait | Sajjadko Kuwait
  seoDescription: Custom rug with a faded classic pattern in grey and beige for living rooms and majlis rooms. Made to size in Kuwait, priced on WhatsApp.
  reviewed: true
  faq:
    - q: How much does a custom rug with a classic pattern cost?
      a: The price depends on the rug size and finishing. Send your seating area length and width on WhatsApp and we confirm the price before we start.
    - q: Does it suit modern furniture?
      a: Yes. The pattern is classic, and its faded grey and beige tones match light sofas, wood tables and gold accents.
