ar:
  name: زولية عتيق المفصلة بنقش كلاسيكي باهت
  directAnswer: عتيق زولية مفصلة بنقش كلاسيكي باهت بدرجات الرمادي الفاتح والبيج والعاجي، تجمع روح السجاد القديم مع ألوان هادئة تناسب الصالات الحديثة. تُفصّل بالمقاس الذي يغطي منطقة الجلسة، وبوبر قصير سهل التنظيف. سعر التفصيل حسب المقاس والتشطيب، ونؤكده عبر واتساب.
  usage: نفذناها لصالة بكنب بيج بقاعدة ذهبية ومخدات عنابية وطاولة وسط خشبية داكنة، فأعطى النقش الباهت الأرضية عمقًا دون أن ينافس الأثاث. تناسب الصالات والمجالس التي تريد فيها نقشًا كلاسيكيًا بألوان حديثة، وتخفي ألوانها المتداخلة آثار الاستعمال اليومي.
  care: نظّفها بالمكنسة الكهربائية بانتظام، وامسح البقع فور وقوعها بقطعة قماش مبللة دون فرك. الوبر القصير لا يحبس الغبار كالوبر الطويل.
  seoTitle: تفصيل زولية بنقش كلاسيكي رمادي بيج في الكويت — سجادكو
  seoDescription: زولية عتيق المفصلة بنقش كلاسيكي باهت بالرمادي والبيج للصالات والمجالس. تفصيل زوالي على المقاس في الكويت، والسعر عبر واتساب.
  reviewed: true
  faq:
    - q: كم سعر تفصيل زولية مثل عتيق؟
      a: السعر حسب مقاس الزولية والتشطيب. أرسل طول منطقة الجلسة وعرضها عبر واتساب، ونؤكد لك السعر قبل البدء.
    - q: هل تناسب الأثاث الحديث؟
      a: نعم، النقش كلاسيكي لكن ألوانه الباهتة من الرمادي والبيج حديثة وهادئة، فتتناسق مع الكنب الفاتح والطاولات الخشبية والذهبي.
    - q: هل تخفي البقع وآثار الاستعمال؟
      a: نعم، تداخل الألوان والنقش الباهت يخفي آثار الاستعمال اليومي أكثر من الزوالي ذات اللون الواحد الفاتح.
    - q: هل هذه زولية جاهزة؟
      a: لا، عتيق زولية مفصلة بالمقاس الذي تطلبه. ونوفر أيضًا زوالي جاهزة بالمقاسات الشائعة، وزوالي تُقص بالمتر.
en:
  name: Ateeq Custom Rug with a Faded Classic Pattern
  directAnswer: Ateeq is a custom-made rug with a faded classic pattern in light grey, beige and ivory, bringing the feel of an old rug in calm colours that suit modern living rooms. It is made to the size that covers your seating area, with a short pile that is easy to clean. Custom pricing depends on size and finishing; we confirm it on WhatsApp.
  usage: We made it for a living room with beige sofas on a gold base, burgundy cushions and a dark wood coffee table, where the faded pattern adds depth without competing with the furniture. It suits living rooms and majlis rooms that want a classic pattern in modern colours, and the blended tones hide everyday wear.
  care: Vacuum regularly and blot spills straight away with a damp cloth. The short pile holds less dust than a long pile.
  seoTitle: Custom Faded Classic Rug in Grey and Beige, Kuwait | Sajjadko
  seoDescription: Ateeq custom rug with a faded classic pattern in grey and beige for living rooms and majlis rooms. Made to size in Kuwait, priced on WhatsApp.
  reviewed: true
  faq:
    - q: How much does a custom rug like Ateeq cost?
      a: The price depends on the rug size and finishing. Send your seating area length and width on WhatsApp and we confirm the price before we start.
    - q: Does it suit modern furniture?
      a: Yes. The pattern is classic, but its faded grey and beige tones are calm and modern, matching light sofas, wood tables and gold accents.
