ar:
  name: سجاد مشجر بالمتر بنقش مربعات باهتة
  directAnswer: سجاد مشجر بالمتر بنقش مربعات صغيرة بارزة بخطوط محفورة، وألوان باهتة متداخلة من البيج والرمادي الفاتح. يعطي الأرضية ملمسًا هادئًا يناسب الصالات وغرف النوم والمجالس الحديثة. يُقص من الرول على مقاس الغرفة أو كزولية، من 5 إلى 15 د.ك للمتر المربع.
  usage: النقش الباهت المتداخل يخفي الغبار وآثار الاستعمال، ويتناسق مع الأثاث الفاتح والجدران البيضاء والرمادية دون أن يزدحم المكان.
  care: نظّفه بالمكنسة الكهربائية بانتظام، وامسح البقع فور وقوعها بقطعة قماش مبللة دون فرك.
  seoTitle: سجاد مشجر بالمتر بنقش مربعات باهتة في الكويت — سجادكو
  seoDescription: سجاد مشجر بالمتر بنقش مربعات بارزة باهتة بالبيج والرمادي للصالات وغرف النوم والمجالس، من 5 إلى 15 د.ك للمتر المربع في الكويت.
  reviewed: true
  faq:
    - q: كم سعر هذا السجاد بالمتر؟
      a: من 5 إلى 15 د.ك للمتر المربع حسب السماكة والضغط والكثافة. صالة 4×5 م (20 م²) تكلف بين 100 و300 د.ك قبل التركيب.
    - q: هل يُقص على مقاس غرفتي أو كزولية؟
      a: نعم، يُقص بالمتر من الرول على مقاس الغرفة من الجدار إلى الجدار، أو قطعة بمقاس منطقة الجلسة تُستخدم زولية. نراجع المقاس معك قبل القص.
en:
  name: Patterned Carpet by the Metre with Faded Squares
  directAnswer: This is a patterned carpet by the metre with small raised squares outlined by carved lines, in faded, blended beige and light grey. It gives the floor a calm texture suited to living rooms, bedrooms and modern majlis rooms. Cut from the roll to your room or as a rug, at 5 to 15 KWD per m².
  usage: The faded, blended pattern hides dust and wear and suits light furniture and white or grey walls without making the room look busy.
  care: Vacuum regularly and blot spills straight away with a damp cloth.
  seoTitle: Faded Square Patterned Carpet by the Metre, Kuwait | Sajjadko
  seoDescription: Patterned carpet by the metre with raised faded squares in beige and grey for living rooms, bedrooms and majlis, 5 to 15 KWD per m² in Kuwait.
  reviewed: true
  faq:
    - q: How much is this carpet per m²?
      a: 5 to 15 KWD per m². A 20 m² living room costs about 100 to 300 KWD before installation.
    - q: Can it be cut to my room or as a rug?
      a: Yes. It is cut from the roll by the metre to fit the room wall to wall, or to the size of your seating area as a rug. We confirm measurements before cutting.
