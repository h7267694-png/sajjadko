ar:
  name: موكيت غرف رمادي مخملي فوق بطانة عازلة
  directAnswer: موكيت غرف رمادي مخملي ركّبناه من الجدار للجدار في غرفة بيت جديد بمنطقة صباح الأحمد. فرشنا تحته بطانة عازلة فوق الرخام، وركّبنا نهاية ذهبية معدنية عند المدخل. البطانة تجعل الموكيت أنعم تحت القدم وتعزل برودة الأرضية. السعر من 5 إلى 15 د.ك للمتر المربع حسب السماكة والكثافة، والقياس مجاني.
  usage: يناسب غرف النوم وغرف الجلوس في البيوت الجديدة، والرمادي يتناسق مع الجدران البيضاء والإضاءة الذهبية ويخفي آثار الاستعمال.
  care: نظّفه بالمكنسة الكهربائية مرة أو مرتين أسبوعيًا، وامسح البقع فور وقوعها بقطعة قماش مبللة دون فرك.
  seoTitle: موكيت غرف رمادي في صباح الأحمد — سجادكو
  seoDescription: تركيب موكيت غرف رمادي مخملي من الجدار للجدار فوق بطانة عازلة في صباح الأحمد. من 5 إلى 15 د.ك للمتر وقياس مجاني.
  reviewed: true
  faq:
    - q: لماذا توضع بطانة تحت الموكيت؟
      a: البطانة تجعل الموكيت أنعم وأدفأ، وتعزل برودة الرخام، وتخفف الصوت، وتحمي ظهر الموكيت من الاحتكاك فيدوم أطول.
    - q: كم سعر موكيت الغرف؟
      a: من 5 إلى 15 د.ك للمتر المربع حسب السماكة والكثافة. نقيس مجانًا ونرسل السعر قبل البدء.
    - q: هل الزيارة والقياس مجانًا؟
      a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Grey Plush Room Carpet over Insulating Underlay
  directAnswer: Grey plush carpet we fitted wall to wall in a room of a new house in Sabah Al-Ahmad, over insulating underlay on marble, with a gold metal trim at the entrance. The underlay makes it softer and blocks the floor chill. 5 to 15 KWD per m² depending on thickness and density, with free measuring.
  usage: Suits bedrooms and sitting rooms in new homes; grey pairs with white walls and gold lighting and hides wear.
  care: Vacuum once or twice a week and blot spills straight away with a damp cloth without rubbing.
  seoTitle: Grey Room Carpet in Sabah Al-Ahmad, Kuwait | Sajjadko
  seoDescription: Grey plush room carpet fitted wall to wall over insulating underlay in Sabah Al-Ahmad, Kuwait. 5 to 15 KWD per m².
  reviewed: true
  faq:
    - q: How much is it?
      a: 5 to 15 KWD per m² depending on thickness and density. Measuring is free.
    - q: Why lay underlay under carpet?
      a: Underlay makes carpet softer and warmer, insulates against cold marble, reduces noise and helps the carpet last longer.
    - q: Is the home visit and measuring free?
      a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
