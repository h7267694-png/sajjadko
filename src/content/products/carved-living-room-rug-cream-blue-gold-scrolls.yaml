ar:
  name: زولية صالة كريمية بنقش أغصان أزرق وذهبي محفور
  directAnswer: زولية تفصيل كريمية كبيرة للصالة، يتوسطها نقش محفور من أغصان متناظرة بالأزرق والذهبي والرمادي، وفي أطرافها أغصان مماثلة داخل إطار مزدوج بخطوط زرقاء وذهبية وسوداء بزوايا مقوّسة. حفر يدوي في ورشتنا بالمقاس الذي تحتاجه. السعر حسب المقاس وحجم النقشة، ونؤكده عبر واتساب.
  usage: الأزرق والذهبي على الأرضية الكريمية يتناسقان مع الجلسات الأرضية والكنب الرمادي والمساند الزرقاء والذهبية في الصالات والمجالس.
  care: نظّفه بالمكنسة الكهربائية بانتظام في اتجاه الوبر، وامسح البقع فور وقوعها دون فرك حتى تبقى حواف الحفر واضحة.
  seoTitle: زولية صالة كريمية بنقش أزرق وذهبي محفور في الكويت — سجادكو
  seoDescription: زولية صالة كريمية بنقش أغصان أزرق وذهبي محفور، سجاد حفر يدوي بالمقاس والألوان التي تختارها للصالات والمجالس في الكويت. السعر حسب المقاس.
  reviewed: true
  faq:
    - q: كم سعره؟
      a: السعر حسب المقاس وحجم النقشة وعدد ألوانها. أرسل صورة النقشة والمقاس عبر واتساب ونرسل لك السعر قبل البدء.
    - q: هل أستطيع تغيير النقشة أو الألوان؟
      a: نعم، ننفذ النقشة نفسها بألوانك، أو نحفر نقشة ترسلها أنت، ونؤكد معك الرسم والألوان قبل البدء.
    - q: هل الزيارة والقياس مجانًا؟
      a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Cream Living Room Rug with Carved Blue and Gold Scrolls
  directAnswer: Large custom cream living room rug with a centre of mirrored carved scrolls in blue, gold and grey, matching scrolls at the ends, and a double border of blue, gold and black lines with curved corners. Hand-carved in our workshop to your size. Priced by size and design; we confirm on WhatsApp.
  usage: Blue and gold on cream suit floor seating, grey sofas and blue or gold cushions in living rooms and majlis.
  care: Vacuum regularly along the pile and blot spills straight away without rubbing so the carved edges stay crisp.
  seoTitle: Cream Carved Living Room Rug, Blue and Gold, Kuwait
  seoDescription: Custom cream living room rug with hand-carved blue and gold scrolls, made in our workshop to your size and colours in Kuwait.
  reviewed: true
  faq:
    - q: How much is it?
      a: Priced by size, design size and number of colours. Send the design and size on WhatsApp for a price before we start.
    - q: Can I change the design or colours?
      a: Yes. We make this design in your colours or carve a design you send, and confirm the drawing and colours before starting.
    - q: Is the home visit and measuring free?
      a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
