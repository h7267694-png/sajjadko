ar:
  name: موكيت سادة مخملي بالمتر بالأزرق والرمادي
  directAnswer: 'موكيت سادة مخملي بوبر مقصوص كثيف ولمعة واضحة، بخمسة ألوان: الأزرق الملكي، والأزرق الرمادي الفاتح، وثلاث درجات من الرمادي. يُباع بالمتر المربع ويُقص على مقاس المكان، من 5 إلى 15 د.ك للمتر المربع حسب السماكة والضغط والكثافة.'
  usage: الأزرق الملكي يناسب المجالس والقاعات التي يُراد فيها لون واضح، والأزرق الرمادي الفاتح يناسب غرف الأطفال والغرف الحديثة، والرماديات تناسب غرف النوم والصالات وتخفي الغبار أكثر من الألوان الفاتحة جدًا.
  care: نظّفه بالمكنسة الكهربائية بانتظام باتجاه الوبر، وامسح البقع فور وقوعها بقطعة قماش مبللة دون فرك.
  seoTitle: موكيت سادة مخملي أزرق ورمادي بالمتر في الكويت — سجادكو
  seoDescription: موكيت سادة مخملي بالمتر بالأزرق الملكي والأزرق الرمادي والرمادي للمجالس وغرف النوم والصالات، من 5 إلى 15 د.ك للمتر المربع في الكويت.
  reviewed: true
  faq:
  - q: كم سعر الموكيت الأزرق والرمادي بالمتر؟
    a: من 5 إلى 15 د.ك للمتر المربع حسب السماكة والضغط والكثافة. مجلس 5×6 م (30 م²) يكلف بين 150 و450 د.ك قبل التركيب.
  - q: أين يناسب الموكيت الأزرق الملكي؟
    a: في المجالس والقاعات وغرف الاستقبال التي يُراد فيها لون واضح، ويتناسق مع الكنب الأبيض والرمادي والذهبي.
  - q: هل يُقص على مقاس الغرفة؟
    a: نعم، يُقص بالمتر على مقاس المكان من الجدار إلى الجدار، أو قطعة بمقاس منطقة الجلسة كزولية. نراجع المقاس معك قبل القص.
  - q: هل الزيارة والقياس مجانًا؟
    a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Plain Plush Carpet by the Metre in Blue and Grey
  directAnswer: 'This is a plain plush carpet with a dense cut pile and a clear sheen, in five colours: royal blue, light steel blue and three shades of grey. Sold by the m² and cut to your space at 5 to 15 KWD per m², depending on thickness, pile pressure and density.'
  usage: Royal blue suits majlis rooms and halls that want a clear colour, light steel blue suits kids rooms and modern rooms, and the greys suit bedrooms and living rooms and hide dust better than very light colours.
  care: Vacuum regularly in the direction of the pile and blot spills straight away with a damp cloth.
  seoTitle: Plain Blue and Grey Plush Carpet by the Metre, Kuwait | Sajjadko
  seoDescription: Plain plush carpet by the metre in royal blue, steel blue and grey for majlis, bedrooms and living rooms, 5 to 15 KWD per m² in Kuwait.
  reviewed: true
  faq:
  - q: How much is blue or grey plush carpet?
    a: 5 to 15 KWD per m². A 30 m² majlis costs about 150 to 450 KWD before installation.
  - q: Can it be cut to my room?
    a: Yes. It is cut by the metre to fit wall to wall, or to the size of your seating area as a rug.
  - q: Is the home visit and measuring free?
    a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
