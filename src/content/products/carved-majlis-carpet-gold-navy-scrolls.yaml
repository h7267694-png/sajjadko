ar:
  name: موكيت مجلس محفور بأغصان ذهبية وكحلية
  directAnswer: موكيت كريمي مخملي مركّب في مجلس، تلتف عليه أغصان ذهبية وكحلية بأوراق زرقاء ورمادية حول منطقة الجلوس، محفورة يدويًا بعدة ارتفاعات للوبر. نركّبه من الجدار للجدار ونقصه على مقاس المكان. السعر حسب المقاس وحجم النقشة، ونؤكده عبر واتساب.
  usage: النقش يحيط بمنطقة الطاولة ويترك الوسط سادة، فيناسب المجالس بكراسي منفردة حول الأطراف.
  care: نظّفه بالمكنسة الكهربائية بانتظام في اتجاه الوبر، وامسح البقع فور وقوعها دون فرك حتى تبقى حواف الحفر واضحة.
  seoTitle: موكيت مجلس محفور بأغصان ذهبية وكحلية في الكويت — سجادكو
  seoDescription: موكيت مجلس محفور بأغصان ذهبية وكحلية، حفر يدوي في ورشتنا بالنقشة والألوان التي تختارها، للصالات والمجالس والديوانيات في الكويت. السعر حسب المقاس.
  reviewed: true
  faq:
    - q: كم سعره؟
      a: السعر حسب مساحة المكان وحجم النقشة وعدد ألوانها. أرسل صورة النقشة والمقاس عبر واتساب ونرسل لك السعر قبل البدء.
    - q: هل أستطيع تغيير النقشة أو الألوان؟
      a: نعم، ننفذ النقشة نفسها بألوانك، أو نحفر نقشة ترسلها أنت، ونؤكد معك الرسم والألوان قبل البدء.
    - q: هل الزيارة والقياس مجانًا؟
      a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Carved Majlis Carpet with Gold and Navy Scrolls
  directAnswer: Cream plush carpet fitted in a majlis, with gold and navy scrolls and blue and grey leaves curling around the seating area, hand-carved at several pile heights. We fit it wall to wall, cut to your room. Priced by size and design; we confirm on WhatsApp.
  usage: The pattern frames the table area and leaves the centre plain, suiting majlis with chairs around the edges.
  care: Vacuum regularly along the pile and blot spills straight away without rubbing so the carved edges stay crisp.
  seoTitle: Carved Majlis Carpet with Gold and Navy Scrolls in Kuwait | Sajjadko
  seoDescription: Carved Majlis Carpet with Gold and Navy Scrolls, hand-carved in our workshop in your design and colours for living rooms, majlis and diwaniya in Kuwait.
  reviewed: true
  faq:
    - q: How much is it?
      a: Priced by area, design size and number of colours. Send the design and size on WhatsApp for a price before we start.
    - q: Can I change the design or colours?
      a: Yes. We make this design in your colours or carve a design you send, and confirm the drawing and colours before starting.
    - q: Is the home visit and measuring free?
      a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
