ar:
  name: زولية كلاسيكية بصرة دائرية وزخارف ملتفة على أرضية كريمية
  directAnswer: زولية جاهزة بأرضية كريمية، في وسطها صرة دائرية بأوراق ذهبية، تحيط بها زخارف أوراق ملتفة وورود بالذهبي والوردي والرمادي، وإطار بخط أسود رفيع، وأطرافها بأهداب بيضاء. تناسب المجالس والصالات ذات الأثاث الكلاسيكي. السعر حسب المقاس، ونؤكده عبر واتساب.
  usage: تتناسق مع الكنب والكراسي المذهبة والأثاث الكلاسيكي، ومع الرخام الداكن والفاتح. الأرضية الكريمية تعطي المكان إضاءة.
  care: نظّفها بالمكنسة الكهربائية بانتظام، وامسح البقع فور وقوعها بقطعة قماش مبللة دون فرك، وأدرها كل بضعة أشهر ليتوزع أثر المشي.
  seoTitle: زولية كلاسيكية كريمية بصرة دائرية في الكويت — سجادكو
  seoDescription: زولية جاهزة كريمية بصرة دائرية وزخارف أوراق ملتفة وورود ذهبية للمجالس والصالات الكلاسيكية. السعر حسب المقاس عبر واتساب.
  reviewed: true
  faq:
    - q: كم سعر هذه الزولية؟
      a: السعر حسب المقاس المتوفر أو المطلوب. أرسل المقاس الذي تحتاجه عبر واتساب، ونؤكد لك المتوفر والسعر.
    - q: ما المقاسات المتوفرة؟
      a: 'نؤكد المقاسات المتوفرة من هذا التصميم عبر واتساب. والمقاسات الشائعة للزوالي الجاهزة: 160×230 و200×300 و240×340 و300×400 سم.'
    - q: هل تناسب الأثاث الكلاسيكي المذهب؟
      a: نعم، الزخارف الملتفة والذهبي في الزولية تتناسق مع الكراسي والكنب المذهب والمرايا الكلاسيكية.
en:
  name: Classic Rug with a Round Medallion and Scrollwork on Cream
  directAnswer: This is a ready-made rug on a cream ground with a round central medallion of gold leaves, surrounded by scrolling leaves and roses in gold, rose and grey, a thin black frame line and white fringes. It suits majlis rooms and living rooms with classic furniture. Priced by size, confirmed on WhatsApp.
  usage: It matches gilded sofas and chairs and classic furniture, on dark or light marble. The cream ground brightens the room.
  care: Vacuum regularly, blot spills straight away with a damp cloth and rotate the rug every few months.
  seoTitle: Classic Cream Medallion Rug in Kuwait | Sajjadko Kuwait
  seoDescription: Ready-made cream rug with a round medallion and gold scrolling leaves and roses for classic majlis and living rooms. Priced by size.
  reviewed: true
  faq:
    - q: How much is this rug?
      a: The price depends on the size available or requested. Send the size you need on WhatsApp and we confirm stock and price.
