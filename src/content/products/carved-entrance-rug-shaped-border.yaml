ar:
  name: زولية مدخل تفصيل بإطار محفور وشكل مقوس
  directAnswer: زولية مدخل تفصيل بشكل مقوس عند الأطراف، وسطها بيج سادة يحيط به إطار رمادي وخط ذهبي وحافة زيتية داكنة، محفورة يدويًا ومقصوصة على شكل الإطار. تُفصّل بالمقاس والشكل الذي تريده. السعر حسب المقاس وحجم النقشة، ونؤكده عبر واتساب.
  usage: تحدد مدخل البيت على البلاط اللامع، وتُقص على مساحة المدخل بين الباب والممر.
  care: نظّفه بالمكنسة الكهربائية بانتظام في اتجاه الوبر، وامسح البقع فور وقوعها دون فرك حتى تبقى حواف الحفر واضحة.
  seoTitle: زولية مدخل تفصيل بإطار محفور وشكل مقوس في الكويت — سجادكو
  seoDescription: زولية مدخل تفصيل بإطار محفور وشكل مقوس، حفر يدوي في ورشتنا بالنقشة والألوان التي تختارها، للصالات والمجالس والديوانيات في الكويت. السعر حسب المقاس.
  reviewed: true
  faq:
    - q: كم سعره؟
      a: السعر حسب المقاس وحجم النقشة وعدد ألوانها. أرسل صورة النقشة والمقاس عبر واتساب ونرسل لك السعر قبل البدء.
    - q: هل أستطيع تغيير النقشة أو الألوان؟
      a: نعم، ننفذ النقشة نفسها بألوانك، أو نحفر نقشة ترسلها أنت، ونؤكد معك الرسم والألوان قبل البدء.
    - q: هل الزيارة والقياس مجانًا؟
      a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Custom Shaped Entrance Rug with a Carved Border
  directAnswer: A custom entrance rug with shaped ends, a plain beige centre framed by grey, a gold line and a dark olive edge, hand-carved and cut to the frame outline. Made to the size and shape you want. Priced by size and design; we confirm on WhatsApp.
  usage: Defines the entrance on glossy tiles and is cut to the space between the door and hallway.
  care: Vacuum regularly along the pile and blot spills straight away without rubbing so the carved edges stay crisp.
  seoTitle: Custom Shaped Entrance Rug with a Carved Border in Kuwait | Sajjadko
  seoDescription: Custom Shaped Entrance Rug with a Carved Border, hand-carved in our workshop in your design and colours for living rooms, majlis and diwaniya in Kuwait.
  reviewed: true
  faq:
    - q: How much is it?
      a: Priced by size, design size and number of colours. Send the design and size on WhatsApp for a price before we start.
    - q: Can I change the design or colours?
      a: Yes. We make this design in your colours or carve a design you send, and confirm the drawing and colours before starting.
    - q: Is the home visit and measuring free?
      a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
