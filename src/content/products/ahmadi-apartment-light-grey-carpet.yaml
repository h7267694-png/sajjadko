ar:
  name: موكيت شقة رمادي فاتح للممرات والغرف
  directAnswer: 'موكيت سادة مخملي رمادي فاتح ركّبناه من الجدار للجدار في شقة كاملة بمنطقة الأحمدي: الممرات والصالة وغرف النوم، مع نهاية ذهبية معدنية عند حدود البلاط. اللون الفاتح يوسّع الممرات الضيقة ويتناسق مع الأبواب الداكنة والستائر الرمادية. السعر من 5 إلى 15 د.ك للمتر المربع حسب السماكة والكثافة.'
  usage: نقص الموكيت على مسار الممر وندخله في الغرف بقطعة متصلة قدر الإمكان حتى لا تظهر فواصل عند الأبواب، ونركّب نهاية معدنية حيث يلتقي الموكيت بالبلاط. الرمادي الفاتح يناسب الشقق ذات الجدران البيضاء والأبواب الداكنة.
  care: نظّفه بالمكنسة الكهربائية مرة أو مرتين أسبوعيًا، خصوصًا في الممرات لأنها الأكثر مرورًا، وامسح البقع فور وقوعها دون فرك.
  seoTitle: موكيت شقة للممرات والغرف في الأحمدي — سجادكو
  seoDescription: 'تركيب موكيت رمادي فاتح لشقة كاملة في الأحمدي: ممرات وصالة وغرف، مع نهاية ذهبية معدنية. من 5 إلى 15 د.ك للمتر.'
  reviewed: true
  faq:
  - q: هل تفرشون الشقة كاملة في يوم واحد؟
    a: يعتمد على المساحة وعدد الغرف. نحدد المدة بعد الزيارة المجانية للقياس.
  - q: ما فائدة النهاية الذهبية؟
    a: تحمي طرف الموكيت عند التقائه بالبلاط من التقشر وتعطي حدًا مستقيمًا مرتبًا.
  - q: كم سعر المتر؟
    a: من 5 إلى 15 د.ك للمتر المربع حسب السماكة والكثافة.
en:
  name: Light Grey Apartment Carpet for Hallways and Rooms
  directAnswer: 'Plain light grey plush carpet we fitted wall to wall across a full apartment in Ahmadi: hallways, hall and bedrooms, with a gold metal trim at the tile edges. The light shade opens up narrow hallways and suits dark doors and grey curtains. 5 to 15 KWD per m² depending on thickness and density.'
  usage: We cut the carpet along the hallway and carry it into the rooms in continuous pieces where possible, so no seams show at doorways, and fit metal trims where carpet meets tile.
  care: Vacuum once or twice a week, especially hallways, and blot spills straight away without rubbing.
  seoTitle: Apartment Carpet for Hallways and Rooms in Ahmadi | Sajjadko
  seoDescription: Light grey wall-to-wall carpet fitted across a full apartment in Ahmadi with gold metal trims. 5 to 15 KWD per m².
  reviewed: true
  faq:
  - q: How much is it per metre?
    a: 5 to 15 KWD per m² depending on thickness and density.
  - q: Is the home visit and measuring free?
    a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
