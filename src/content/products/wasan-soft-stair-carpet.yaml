ar:
  name: موكيت وسن الناعم للدرج وغرف النوم
  directAnswer: وسن موكيت تركي بوبر مقصوص ناعم بألوان هادئة مزيجة، من الكريمي والبيج والبني العسلي إلى الرمادي والأزرق الرمادي. يناسب الدرج وغرف النوم والصالات، ويُقص على مقاس الدرجات أو الغرفة. يُباع بالمتر المربع ويُقص على المقاس، والسعر من 5 إلى 15 د.ك للمتر المربع حسب السماكة والضغط والكثافة.
  usage: ألوانه المزيجة تخفي الغبار وآثار الأقدام على الدرج أكثر من الألوان السادة. البيج والكريمي للبيوت الفاتحة، والبني والرمادي الفحمي للدرج كثير الاستعمال.
  care: نظّفه بالمكنسة الكهربائية بانتظام، وعالج البقع فور وقوعها بقطعة قماش مبللة دون فرك.
  seoTitle: موكيت وسن الناعم للدرج بالمتر في الكويت — سجادكو الكويت
  seoDescription: موكيت تركي ناعم بألوان هادئة للدرج وغرف النوم، يُقص على مقاس الدرجات ويُركّب في الكويت من 5 إلى 15 د.ك للمتر المربع.
  faq:
    - q: كم سعر موكيت وسن بالمتر؟
      a: يُباع بالمتر المربع من 5 إلى 15 د.ك حسب السماكة والضغط والكثافة. لحساب الدرج اضرب عرض الدرجة في مجموع عمق الدرجة وارتفاعها، ثم في عدد الدرجات، لتعرف المساحة التقريبية. أجرة التركيب منفصلة.
    - q: كيف أقيس الدرج للموكيت؟
      a: قس عرض الدرجة، وعمقها من الحافة إلى الخلف، وارتفاعها، وعدّ الدرجات. أرسل الأرقام والمنطقة عبر واتساب، ونراجع الحساب معك، ونقيس في الموقع عند الحاجة قبل القص.
    - q: هل يناسب غرف النوم أيضًا؟
      a: نعم، الوبر الناعم الكثيف يناسب غرف النوم والصالات كما يناسب الدرج. يُقص على مقاس الغرفة بالمتر، فيمكن أن يكون الدرج والممر وغرف النوم بالخامة واللون نفسيهما.
    - q: هل تركّبون موكيت الدرج؟
      a: نعم، نركّب ما نوفره، وأجرة التركيب منفصلة عن سعر المتر وتُتفق حسب المساحة والموقع، ونتابع معك يومين بعد التركيب لمعالجة أي خطأ في التركيب. ولا نركّب سجادًا اشتريته من غيرنا.
  reviewed: false
en:
  name: Wasan Soft Stair Carpet for Stairs and Bedrooms
  directAnswer: Wasan is a Turkish wall-to-wall carpet with a soft cut pile in calm, heathered shades from cream, beige and honey brown to grey and grey blue. It suits stairs, bedrooms and living rooms, and is cut to fit your steps or room. Sold by the m² and cut to size, from 5 to 15 KWD per m² (0.465 to 1.394 KWD per sq ft) depending on thickness, pile pressure and density.
  usage: Heathered colours hide dust and footprints on stairs better than solid shades. Cream and beige suit bright homes, while brown and charcoal grey suit busy family staircases.
  care: Vacuum regularly, and blot spills straight away with a damp cloth without rubbing.
  seoTitle: Wasan Soft Stair Carpet by the m² in Kuwait | Sajjadko Kuwait
  seoDescription: Soft Turkish stair carpet in calm heathered shades for stairs and bedrooms, cut to fit and installed in Kuwait. 5 to 15 KWD per m².
  faq:
    - q: How much does Wasan stair carpet cost per m²?
      a: It is sold by the m², from 5 to 15 KWD (0.465 to 1.394 KWD per sq ft) depending on thickness, pile pressure and density. For stairs, multiply step width by (tread depth + riser height), then by the number of steps, for the approximate area. Installation is separate.
    - q: How do I measure stairs for carpet?
      a: Measure the step width, the tread depth from the nose to the back, and the riser height, then count the steps. Send the numbers and your area on WhatsApp, and we check the calculation with you and measure on site if needed before cutting.
    - q: What is the cost to carpet stairs in Kuwait?
      a: As an illustration, 14 steps 1 m (3.3 ft) wide, each with a 0.28 m tread and 0.17 m riser, use about 6.3 m² of carpet, so roughly 32 to 95 KWD before installation, depending on the quality you choose. We confirm the exact figure on WhatsApp.
    - q: Can I use the same carpet in bedrooms?
      a: Yes. The soft, dense pile suits bedrooms and living rooms as well as stairs. It is cut to size by the metre, so stairs, landing and bedrooms can share the same material and colour.
    - q: Do you install stair carpet?
      a: Yes, we install the carpet we supply. Installation is priced separately from the per-m² price and agreed by area and location, and we follow up for two days to fix any installation error. We do not install carpet bought elsewhere.
  reviewed: true
