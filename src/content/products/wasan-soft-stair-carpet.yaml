ar:
  name: موكيت خفيف للدرج وغرف النوم
  directAnswer: موكيت خفيف بوبر مقصوص ناعم بألوان مزيجة، من الكريمي والبيج والبني العسلي إلى الرمادي والأزرق الرمادي. يناسب الدرج وغرف النوم والصالات، ويُقص على مقاس الدرجات أو الغرفة. يُباع بالمتر المربع ويُقص على المقاس، والسعر من 1.250 إلى 3 د.ك للمتر المربع حسب السماكة والضغط والكثافة.
  usage: ألوانه المزيجة تخفي الغبار وآثار الأقدام على الدرج أكثر من الألوان السادة. البيج والكريمي للبيوت الفاتحة، والبني والرمادي الفحمي للدرج كثير الاستعمال.
  care: نظّفه بالمكنسة الكهربائية بانتظام، وعالج البقع فور وقوعها بقطعة قماش مبللة دون فرك.
  seoTitle: موكيت خفيف للدرج وغرف النوم في الكويت — سجادكو الكويت
  seoDescription: موكيت خفيف ناعم بألوان مزيجة للدرج وغرف النوم، يُقص على مقاس الدرجات ويُركّب في الكويت من 1.250 إلى 3 د.ك للمتر المربع.
  faq:
    - q: كم سعر موكيت الدرج وغرف النوم الخفيف بالمتر؟
      a: يُباع بالمتر المربع من 1.250 إلى 3 د.ك حسب السماكة والضغط والكثافة. لحساب الدرج اضرب عرض الدرجة في مجموع عمق الدرجة وارتفاعها، ثم في عدد الدرجات، لتعرف المساحة التقريبية. أجرة التركيب منفصلة.
    - q: كيف أقيس الدرج للموكيت؟
      a: قس عرض الدرجة، وعمقها من الحافة إلى الخلف، وارتفاعها، وعدّ الدرجات. أرسل الأرقام والمنطقة عبر واتساب، ونراجع الحساب معك، ونقيس في الموقع عند الحاجة قبل القص.
    - q: هل يناسب غرف النوم أيضًا؟
      a: نعم، الوبر الناعم يناسب غرف النوم والصالات كما يناسب الدرج. يُقص على مقاس الغرفة بالمتر، فيمكن أن يكون الدرج والممر وغرف النوم بالخامة واللون نفسيهما.
    - q: هل تركّبون موكيت الدرج؟
      a: نعم، نركّب ما نوفره، وأجرة التركيب منفصلة عن سعر المتر وتُتفق حسب المساحة والموقع، ونتابع معك يومين بعد التركيب لمعالجة أي خطأ في التركيب. ولا نركّب سجادًا اشتريته من غيرنا.
  reviewed: false
en:
  name: Lightweight Carpet for Stairs and Bedrooms
  directAnswer: This is a lightweight wall-to-wall carpet with a soft cut pile in heathered shades from cream, beige and honey brown to grey and grey blue. It suits stairs, bedrooms and living rooms, and is cut to fit your steps or room. Sold by the m² and cut to size, from 1.250 to 3 KWD per m² (0.116 to 0.279 KWD per sq ft) depending on thickness, pile pressure and density.
  usage: Heathered colours hide dust and footprints on stairs better than solid shades. Cream and beige suit bright homes, while brown and charcoal grey suit busy family staircases.
  care: Vacuum regularly, and blot spills straight away with a damp cloth without rubbing.
  seoTitle: Lightweight Carpet for Stairs and Bedrooms in Kuwait | Sajjadko
  seoDescription: Soft, lightweight carpet in heathered shades for stairs and bedrooms, cut to fit and installed in Kuwait. 1.250 to 3 KWD per m².
  faq:
    - q: How much does this lightweight carpet cost per m²?
      a: It is sold by the m², from 1.250 to 3 KWD (0.116 to 0.279 KWD per sq ft) depending on thickness, pile pressure and density. For stairs, multiply step width by (tread depth + riser height), then by the number of steps, for the approximate area. Installation is separate.
    - q: How do I measure stairs for carpet?
      a: Measure the step width, the tread depth from the nose to the back, and the riser height, then count the steps. Send the numbers and your area on WhatsApp, and we check the calculation with you and measure on site if needed before cutting.
    - q: What is the cost to carpet stairs in Kuwait?
      a: As an illustration, 14 steps 1 m (3.3 ft) wide, each with a 0.28 m tread and 0.17 m riser, use about 6.3 m² of carpet, so roughly 7.9 to 18.9 KWD before installation, depending on the quality you choose. We confirm the exact figure on WhatsApp.
    - q: Can I use the same carpet in bedrooms?
      a: Yes. The soft pile suits bedrooms and living rooms as well as stairs. It is cut to size by the metre, so stairs, landing and bedrooms can share the same material and colour.
    - q: Do you install stair carpet?
      a: Yes, we install the carpet we supply. Installation is priced separately from the per-m² price and agreed by area and location, and we follow up for two days to fix any installation error. We do not install carpet bought elsewhere.
  reviewed: true
