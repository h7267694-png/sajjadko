ar:
  name: موكيت غرفة نوم رمادي فاتح مخملي
  directAnswer: موكيت غرف نوم مخملي بلون رمادي فاتح مائل للعاجي ركّبناه من الجدار للجدار فوق أرضية رخام في غرفة نوم بمنطقة حطين. يحوّل الغرفة من بلاط بارد إلى أرضية دافئة وهادئة. السعر من 5 إلى 15 د.ك للمتر المربع حسب السماكة والكثافة، والقياس مجاني.
  usage: تركيب الموكيت فوق الرخام لا يحتاج إزالة البلاط، ويخفف برودة الأرضية وصدى الصوت في الغرف الكبيرة. الرمادي الفاتح يتناسق مع الأثاث الأبيض والستائر البنية والرمادية.
  care: نظّفه بالمكنسة الكهربائية مرة أو مرتين أسبوعيًا، وامسح البقع فور وقوعها بقطعة قماش مبللة دون فرك.
  seoTitle: موكيت غرف نوم رمادي فاتح في حطين — سجادكو
  seoDescription: تركيب موكيت غرفة نوم رمادي فاتح مخملي من الجدار للجدار فوق الرخام في حطين. من 5 إلى 15 د.ك للمتر وقياس مجاني.
  reviewed: true
  faq:
  - q: هل يُركّب الموكيت فوق الرخام مباشرة؟
    a: نعم، نركّبه فوق الرخام أو البلاط دون إزالته، مع بطانة تحت الموكيت ونهاية معدنية عند الباب.
  - q: كم سعر موكيت غرفة النوم؟
    a: من 5 إلى 15 د.ك للمتر المربع حسب السماكة والكثافة. غرفة 4×5 م (20 م²) مثلًا بين 100 و300 د.ك قبل التركيب.
  - q: هل الزيارة والقياس مجانًا؟
    a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Pale Grey Plush Bedroom Carpet
  directAnswer: Pale grey plush carpet we fitted wall to wall over a marble floor in a bedroom in Hitteen, turning cold tiles into a warm, quiet floor. 5 to 15 KWD per m² depending on thickness and density, with free measuring.
  usage: Carpet goes over marble without removing the tiles, cutting floor chill and echo in large rooms. Pale grey suits white furniture and brown or grey curtains.
  care: Vacuum once or twice a week and blot spills straight away with a damp cloth without rubbing.
  seoTitle: Bedroom Carpet over Marble in Hitteen, Kuwait | Sajjadko
  seoDescription: Pale grey plush bedroom carpet fitted wall to wall over marble in Hitteen, Kuwait. 5 to 15 KWD per m², free measuring.
  reviewed: true
  faq:
  - q: How much is bedroom carpet?
    a: 5 to 15 KWD per m². A 4×5 m bedroom (20 m²) is about 100 to 300 KWD before fitting.
  - q: Can carpet be fitted over marble?
    a: Yes, over marble or tiles without removing them, with underlay and a metal trim at the door.
  - q: Is the home visit and measuring free?
    a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
