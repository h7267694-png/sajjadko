ar:
  name: موكيت مجلس رمادي بنقش طولي أزرق وكريمي محفور
  directAnswer: موكيت رمادي مخملي من الجدار للجدار في مجلس أرضي، يتوسطه نقش طولي بأغصان زرقاء رمادية على أرضية كريمية داخل إطار أزرق، محفور يدويًا ومدمج في الموكيت. نركّبه ونقصه على مقاس المكان. السعر حسب المقاس وحجم النقشة، ونؤكده عبر واتساب.
  usage: النقش الطولي يملأ وسط المجلس المستطيل ويتناسق مع المساند البيضاء والخشب الداكن.
  care: نظّفه بالمكنسة الكهربائية بانتظام في اتجاه الوبر، وامسح البقع فور وقوعها دون فرك حتى تبقى حواف الحفر واضحة.
  seoTitle: موكيت مجلس رمادي بنقش طولي محفور | حفر يدوي بالكويت — سجادكو
  seoDescription: موكيت مجلس رمادي بنقش طولي أزرق وكريمي محفور، سجاد حفر يدوي مدمج في الموكيت بالمقاس والنقش الذي تختاره للمجالس والديوانيات في الكويت. السعر حسب المساحة.
  reviewed: true
  faq:
    - q: كم سعره؟
      a: السعر حسب مساحة المكان وحجم النقشة وعدد ألوانها. أرسل صورة النقشة والمقاس عبر واتساب ونرسل لك السعر قبل البدء.
    - q: هل أستطيع تغيير النقشة أو الألوان؟
      a: نعم، ننفذ النقشة نفسها بألوانك، أو نحفر نقشة ترسلها أنت، ونؤكد معك الرسم والألوان قبل البدء.
    - q: هل الزيارة والقياس مجانًا؟
      a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Grey Majlis Carpet with a Long Carved Blue and Cream Design
  directAnswer: Grey plush wall-to-wall carpet in a floor-seating majlis, with a long centre design of blue-grey scrolls on a cream ground inside a blue outline, hand-carved and inlaid into the carpet. We cut and fit it to your room. Priced by size and design; we confirm on WhatsApp.
  usage: The long design fills the centre of a rectangular majlis and works with white cushions and dark wood.
  care: Vacuum regularly along the pile and blot spills straight away without rubbing so the carved edges stay crisp.
  seoTitle: Grey Majlis Carpet with a Carved Blue Design in Kuwait | Sajjadko
  seoDescription: Grey wall-to-wall majlis carpet with a long hand-carved blue and cream design, made in our workshop to your room and colours in Kuwait.
  reviewed: true
  faq:
    - q: How much is it?
      a: Priced by room area, design size and number of colours. Send the design and size on WhatsApp for a price before we start.
    - q: Can I change the design or colours?
      a: Yes. We make this design in your colours or carve a design you send, and confirm the drawing and colours before starting.
    - q: Is the home visit and measuring free?
      a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
