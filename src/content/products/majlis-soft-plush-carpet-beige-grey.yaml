ar:
  name: موكيت مجالس ناعم كثيف الوبر بدرجات البيج والرمادي
  directAnswer: 'موكيت بوبر كثيف ناعم وسطح محبب، بستة ألوان: بيج رمادي وبيج فاتح وبيج وجملي ورمادي بني ورمادي فضي. يُقص على مقاس المجلس أو الصالة ويُركّب من الجدار للجدار. السعر من 5 إلى 15 د.ك للمتر المربع حسب السماكة والكثافة.'
  usage: درجات البيج والجملي تتناسق مع الجلسات العربية الفاتحة والخشب، والرمادي الفضي مع الديكور الحديث. الوبر الكثيف مريح للجلوس على الأرض.
  care: نظّفه بالمكنسة الكهربائية مرة أو مرتين أسبوعيًا، وامسح البقع والسوائل فور وقوعها بقطعة قماش مبللة دون فرك.
  seoTitle: موكيت مجالس ناعم بالبيج والرمادي في الكويت — سجادكو
  seoDescription: موكيت مجالس ناعم كثيف الوبر بستة ألوان من البيج والجملي والرمادي، يُقص ويُركّب. من 5 إلى 15 د.ك للمتر.
  reviewed: true
  faq:
  - q: كم سعر المتر؟
    a: من 5 إلى 15 د.ك للمتر المربع حسب السماكة والكثافة. أرسل مقاس المجلس ورقم اللون عبر واتساب ونرسل السعر.
  - q: هل يمكن حفر نقشة في وسطه؟
    a: نعم، نحفر النقشة يدويًا وندمجها في الموكيت بالألوان التي تختارها، والسعر حسب حجم النقشة.
en:
  name: Soft Plush Majlis Carpet in Beige and Grey
  directAnswer: 'A dense soft plush with a textured surface in six colours: greige, light beige, beige, camel, taupe and silver grey. Cut to the majlis or living room and fitted wall to wall. 5 to 15 KWD per m² depending on thickness and density.'
  usage: Beige and camel suit light Arabic seating and wood; silver grey suits modern interiors. The dense pile is comfortable for floor seating.
  care: Vacuum once or twice a week and blot spills straight away with a damp cloth without rubbing.
  seoTitle: Soft Plush Majlis Carpet in Kuwait | Sajjadko
  seoDescription: Soft dense plush majlis carpet in six beige, camel and grey shades. 5 to 15 KWD per m².
  reviewed: true
  faq:
  - q: How much is it per metre?
    a: 5 to 15 KWD per m² depending on thickness and density.
