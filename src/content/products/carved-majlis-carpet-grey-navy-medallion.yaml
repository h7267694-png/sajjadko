ar:
  name: موكيت مجلس رمادي بزخرفة كحلية محفورة
  directAnswer: موكيت رمادي مخملي من الجدار للجدار في مجلس عربي، تتوسطه زخرفة كحلية بخطوط بيضاء ولمسات رمادية، محفورة يدويًا ومدمجة في الموكيت. نركّبه من الجدار للجدار ونقصه على مقاس المكان. السعر حسب المقاس وحجم النقشة، ونؤكده عبر واتساب.
  usage: الكحلي على الرمادي واضح دون أن يثقل المجلس، ويتناسق مع المساند البيضاء.
  care: نظّفه بالمكنسة الكهربائية بانتظام في اتجاه الوبر، وامسح البقع فور وقوعها دون فرك حتى تبقى حواف الحفر واضحة.
  seoTitle: موكيت مجلس رمادي بزخرفة كحلية محفورة في الكويت — سجادكو
  seoDescription: موكيت مجلس رمادي بزخرفة كحلية محفورة، حفر يدوي في ورشتنا بالنقشة والألوان التي تختارها، للصالات والمجالس والديوانيات في الكويت. السعر حسب المقاس.
  reviewed: true
  faq:
    - q: كم سعره؟
      a: السعر حسب مساحة المكان وحجم النقشة وعدد ألوانها. أرسل صورة النقشة والمقاس عبر واتساب ونرسل لك السعر قبل البدء.
    - q: هل أستطيع تغيير النقشة أو الألوان؟
      a: نعم، ننفذ النقشة نفسها بألوانك، أو نحفر نقشة ترسلها أنت، ونؤكد معك الرسم والألوان قبل البدء.
    - q: هل الزيارة والقياس مجانًا؟
      a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Grey Majlis Carpet with a Carved Navy Medallion
  directAnswer: Grey plush wall-to-wall carpet in a floor-seating majlis with a navy medallion outlined in white with grey touches, hand-carved into the carpet. We fit it wall to wall, cut to your room. Priced by size and design; we confirm on WhatsApp.
  usage: Navy on grey stands out without weighing down the majlis and pairs with white cushions.
  care: Vacuum regularly along the pile and blot spills straight away without rubbing so the carved edges stay crisp.
  seoTitle: Grey Majlis Carpet with a Carved Navy Medallion in Kuwait | Sajjadko
  seoDescription: Grey Majlis Carpet with a Carved Navy Medallion, hand-carved in our workshop in your design and colours for living rooms, majlis and diwaniya in Kuwait.
  reviewed: true
  faq:
    - q: How much is it?
      a: Priced by area, design size and number of colours. Send the design and size on WhatsApp for a price before we start.
    - q: Can I change the design or colours?
      a: Yes. We make this design in your colours or carve a design you send, and confirm the drawing and colours before starting.
    - q: Is the home visit and measuring free?
      a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
