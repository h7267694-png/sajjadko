ar:
  name: موكيت تركي مخملي قصير الوبر بثمانية ألوان
  directAnswer: 'موكيت تركي الصنع بوبر قصير كثيف وملمس مخملي يعكس الضوء، بثمانية ألوان: كريمي وبيج رملي وبني زيتوني فاتح ورمادي بني وجملي ذهبي ورمادي فاتح ورمادي وفحمي. يُقص على مقاس المجلس ويُركّب من الجدار للجدار. السعر من 5 إلى 15 د.ك للمتر المربع حسب السماكة والكثافة.'
  usage: السطح المخملي يعطي المجالس والديوانيات مظهرًا متجانسًا، ويصلح قاعدة للحفر اليدوي لأن الوبر القصير يُظهر حواف النقشة بوضوح. الألوان الفاتحة للمجالس المضيئة، والرمادي والفحمي للديوانيات كثيرة الاستعمال.
  care: نظّفه بالمكنسة الكهربائية مرة أو مرتين أسبوعيًا، وامسح البقع والسوائل فور وقوعها بقطعة قماش مبللة دون فرك.
  seoTitle: موكيت تركي مخملي للمجالس بالمتر في الكويت — سجادكو
  seoDescription: موكيت تركي مخملي قصير الوبر بثمانية ألوان للمجالس والديوانيات، يُقص ويُركّب. من 5 إلى 15 د.ك للمتر.
  reviewed: true
  faq:
    - q: كم سعر المتر؟
      a: من 5 إلى 15 د.ك للمتر المربع حسب السماكة والكثافة. أرسل مقاس المجلس ورقم اللون عبر واتساب ونرسل السعر.
    - q: هل يمكن حفر نقشة في وسطه؟
      a: نعم، نحفر النقشة يدويًا وندمجها في الموكيت بالألوان التي تختارها، والسعر حسب حجم النقشة.
    - q: هل الزيارة والقياس مجانًا؟
      a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Turkish Short-Pile Velvet Carpet in Eight Colours
  directAnswer: A Turkish-made carpet with a dense short pile and a velvet sheen, in eight colours from cream and sand beige to grey and charcoal. Cut to the majlis and fitted wall to wall. 5 to 15 KWD per m² depending on thickness and density.
  usage: The velvet surface gives majlis and diwaniya an even look and makes a good base for hand carving, since the short pile shows crisp edges.
  care: Vacuum once or twice a week and blot spills straight away with a damp cloth without rubbing.
  seoTitle: Turkish Velvet Majlis Carpet by the Metre in Kuwait | Sajjadko
  seoDescription: Turkish short-pile velvet carpet in eight colours for majlis and diwaniya. 5 to 15 KWD per m².
  reviewed: true
  faq:
    - q: How much is it per metre?
      a: 5 to 15 KWD per m² depending on thickness and density.
    - q: Is the home visit and measuring free?
      a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
