ar:
  name: موكيت نسيم بألوان فاتحة وجريئة
  directAnswer: نسيم موكيت تركي بملمس ناعم وألوان تبدأ من العاجي والبيج والرمادي وتصل إلى الكحلي، مع ألوان جريئة مثل الأزرق والبرتقالي والزيتي. يناسب غرف النوم والصالات وغرف الأطفال والمكاتب. يُباع بالمتر المربع ويُقص على مقاس المكان، والسعر من 5 إلى 15 د.ك للمتر المربع حسب السماكة والضغط والكثافة.
  usage: تنوع ألوانه يجعله مناسبًا لغرف الأطفال حين تريد لونًا حيًا، وللمكاتب والصالات حين تريد لونًا محايدًا. أرسل رمز اللون عبر واتساب لنؤكد توفره.
  care: نظّفه بالمكنسة الكهربائية بانتظام، وعالج البقع فور وقوعها بقطعة قماش مبللة دون فرك.
  seoTitle: موكيت نسيم بالمتر في الكويت بألوان متعددة — سجادكو الكويت
  seoDescription: موكيت تركي بألوان محايدة وجريئة لغرف النوم والأطفال والمكاتب، يُقص على المقاس من 5 إلى 15 د.ك للمتر المربع.
  reviewed: false
  faq:
    - q: كم سعر موكيت نسيم بالمتر؟
      a: يُباع بالمتر المربع، والسعر من 5 إلى 15 د.ك للمتر المربع حسب السماكة والضغط والكثافة. اضرب مساحة المكان في سعر المتر لتعرف الكلفة التقريبية، وأجرة التركيب منفصلة وتُتفق حسب المساحة والموقع. نؤكد لك السعر النهائي عبر واتساب.
    - q: هل يُقص على مقاس غرفتي؟
      a: نعم، يُقص على مقاس المكان بالمتر، فلا تحتاج مقاسًا جاهزًا. أرسل الطول والعرض عبر واتساب، ونراجع معك المقاس قبل القص لأن القص لا يُعاد، ونقيس في الموقع عند الحاجة.
    - q: كم لونًا متوفرًا وكيف أختار؟
      a: تتوفر 9 ألوان بأرقام واضحة في جدول الألوان بالصفحة. أرسل رقم اللون الذي يعجبك عبر واتساب لنؤكد توفره، واختر الفاتح للغرف الصغيرة والداكن للأماكن كثيرة الحركة.
    - q: هل تركّبونه؟
      a: نعم، نركّب ما نوفره من سجاد وموكيت، وأجرة التركيب منفصلة عن سعر المتر وتُتفق حسب المساحة والموقع. بعد التركيب نتابع معك يومين لمعالجة أي خطأ في التركيب.
en:
  name: Naseem Carpet in Light and Bold Colours
  directAnswer: Naseem is a Turkish wall-to-wall carpet with a soft feel, in shades from ivory, beige and grey to navy, plus bold colours such as blue, orange and olive. It suits bedrooms, living rooms, kids rooms and offices. Sold per m² and cut to your room size, from 5 to 15 KWD per m² (0.465 to 1.394 KWD per sq ft) depending on thickness, pile pressure and density.
  usage: Its range of colours makes it a good fit for kids rooms when you want a lively colour, and for offices and living rooms when you want a neutral one. Send the colour code on WhatsApp and we confirm availability.
  care: Vacuum regularly, and blot spills straight away with a damp cloth without rubbing.
  seoTitle: Naseem Carpet by the m² in Kuwait, Many Colours | Sajjadko Kuwait
  seoDescription: Turkish wall-to-wall carpet in neutral and bold colours for bedrooms, kids rooms and offices, cut to size from 5 to 15 KWD per m².
  reviewed: true
  faq:
    - q: How much is Naseem Carpet in per m²?
      a: It is sold by the m², from 5 to 15 KWD per m² (0.465 to 1.394 KWD per sq ft), depending on thickness, pile pressure and density. Multiply your floor area by the price per m² for an estimate. Installation is separate and agreed by area and location.
    - q: Can it be cut to my room size?
      a: Yes. It is cut to your room in metres, so you are not limited to stock sizes. Send the length and width on WhatsApp, in metres or feet, and we check the measurements with you before cutting, since a cut cannot be undone.
    - q: How many colours are there, and how do I choose?
      a: There are 9 colours, each with a code in the colour table on this page. Send the code you like on WhatsApp and we confirm it is in stock. Light shades suit small rooms, and darker shades suit busy areas.
    - q: Do you install it?
      a: Yes, we install the carpet we supply. Installation is priced separately from the per-m² price and agreed by area and location. After installation we follow up for two days to fix any installation error.
