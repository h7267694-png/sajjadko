ar:
  name: موكيت نسيم بألوان فاتحة وجريئة
  directAnswer: نسيم موكيت تركي بملمس ناعم وألوان تبدأ من العاجي والبيج والرمادي وتصل إلى الكحلي، مع ألوان جريئة مثل الأزرق والبرتقالي والزيتي. يناسب غرف النوم والصالات وغرف الأطفال والمكاتب. يُباع بالمتر المربع ويُقص على مقاس المكان، والسعر من 5 إلى 15 د.ك للمتر المربع حسب السماكة والضغط والكثافة.
  usage: تنوع ألوانه يجعله مناسبًا لغرف الأطفال حين تريد لونًا حيًا، وللمكاتب والصالات حين تريد لونًا محايدًا. أرسل رمز اللون عبر واتساب لنؤكد توفره.
  care: نظّفه بالمكنسة الكهربائية بانتظام، وعالج البقع فور وقوعها بقطعة قماش مبللة دون فرك.
  seoTitle: موكيت نسيم بالمتر في الكويت بألوان متعددة — سجادكو الكويت
  seoDescription: موكيت تركي بألوان محايدة وجريئة لغرف النوم والأطفال والمكاتب، يُقص على المقاس من 5 إلى 15 د.ك للمتر المربع.
  reviewed: false
en:
  name: Naseem Carpet in Light and Bold Colours
  directAnswer: Naseem is a Turkish wall-to-wall carpet with a soft feel, in shades from ivory, beige and grey to navy, plus bold colours such as blue, orange and olive. It suits bedrooms, living rooms, kids rooms and offices. Sold per m² and cut to your room size, from 5 to 15 KWD per m² (0.465 to 1.394 KWD per sq ft) depending on thickness, pile pressure and density.
  usage: Its range of colours makes it a good fit for kids rooms when you want a lively colour, and for offices and living rooms when you want a neutral one. Send the colour code on WhatsApp and we confirm availability.
  care: Vacuum regularly, and blot spills straight away with a damp cloth without rubbing.
  seoTitle: Naseem Carpet by the m² in Kuwait, Many Colours | Sajjadko Kuwait
  seoDescription: Turkish wall-to-wall carpet in neutral and bold colours for bedrooms, kids rooms and offices, cut to size from 5 to 15 KWD per m².
