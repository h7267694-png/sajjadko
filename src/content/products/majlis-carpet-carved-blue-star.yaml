ar:
  name: موكيت مجلس بيج بنجمة إسلامية محفورة بالأزرق
  directAnswer: موكيت بيج ناعم مركّب في مجلس عربي، تتوسطه نجمة إسلامية هندسية باللون الأزرق محفورة يدويًا ومدمجة في الموكيت، وتتكرر النقشة نفسها على المساند. من أعمالنا في الحفر اليدوي، ونفّذ النقشة بالمقاس والألوان التي تختارها. السعر حسب مساحة المجلس وحجم النقشة.
  usage: توحيد نقشة الموكيت مع نقشة المساند أو الستائر يربط المجلس كله بتصميم واحد، والأزرق على البيج يبقى واضحًا دون أن يثقل المكان.
  care: نظّفه بالمكنسة الكهربائية بانتظام في اتجاه الوبر، وامسح البقع فور وقوعها دون فرك حتى تبقى حواف الحفر واضحة.
  seoTitle: موكيت مجلس بنجمة إسلامية محفورة يدويًا في الكويت — سجادكو
  seoDescription: موكيت مجالس بيج بنجمة إسلامية زرقاء محفورة يدويًا تتناسق مع المساند، من أعمالنا في الكويت.
  reviewed: true
  faq:
  - q: هل أستطيع اختيار نقشة أخرى أو لونًا آخر؟
    a: نعم. ترسل صورة النقشة أو فكرتها مع مقاس المجلس عبر واتساب، ونؤكد معك الألوان والمقاس والسعر قبل البدء.
  - q: كم سعره؟
    a: السعر حسب مساحة المجلس وحجم النقشة وعدد ألوانها. نزورك مجانًا للقياس وعرض العينات، ثم نرسل السعر.
en:
  name: Beige Majlis Carpet with a Carved Blue Islamic Star
  directAnswer: Soft beige carpet in a floor-seating majlis with a geometric Islamic star in blue, hand-carved into the carpet and matching the motif on the cushions. One of our hand-carving jobs, made in your size and colours. Priced by majlis area and design size.
  usage: Matching the carpet motif to the cushions or curtains ties the whole majlis to one design.
  care: Vacuum regularly along the pile and blot spills straight away without rubbing so the carved edges stay crisp.
  seoTitle: Carved Islamic Star Majlis Carpet in Kuwait | Sajjadko
  seoDescription: Beige majlis carpet with a hand-carved blue Islamic star matching the cushions.
  reviewed: true
  faq:
  - q: Can I choose another design or colour?
    a: Yes. Send the design and your majlis size on WhatsApp and we confirm colours, size and price before starting.
