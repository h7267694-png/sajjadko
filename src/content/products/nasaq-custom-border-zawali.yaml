ar:
  name: زولية نسق المفصلة بإطار خطوط أسود وبني
  directAnswer: نسق زولية مفصلة على مقاس المجلس، بأرضية كريمية ناعمة وإطار من خطوط متوازية بالأسود والبني الرمادي تتقاطع عند الزوايا. تُفصّل بالطول والعرض اللذين تحددهما لتغطي منطقة الجلسة كلها، ويُحفر الإطار يدويًا بالألوان التي تختارها. سعر التفصيل حسب المقاس والتشطيب، ونؤكده عبر واتساب.
  usage: صممناها لمجلس حديث بكنب أبيض وطاولات جانبية سوداء، فجاءت خطوط الإطار بالأسود والبني الرمادي لتربط الأثاث بالأرضية. يمكن تفصيلها بعدد خطوط أقل أو أكثر، أو بألوان تناسب مجلسك، وبمقاس يترك هامشًا من الرخام حول الزولية أو يملأ المجلس كله.
  care: نظّفها بالمكنسة الكهربائية بانتظام باتجاه الوبر، وامسح البقع فور وقوعها بقطعة قماش مبللة دون فرك. أدر الزولية كل بضعة أشهر ليتوزع أثر المشي بالتساوي.
  seoTitle: تفصيل زولية مجلس بإطار خطوط في الكويت — سجادكو
  seoDescription: زولية نسق المفصلة على مقاس المجلس، كريمية بإطار خطوط أسود وبني محفور يدويًا. تفصيل زوالي في الكويت، والسعر حسب المقاس عبر واتساب.
  reviewed: true
  faq:
    - q: كم سعر تفصيل زولية مثل نسق؟
      a: السعر حسب مقاس الزولية وعدد خطوط الإطار والتشطيب. أرسل طول منطقة الجلسة وعرضها عبر واتساب، ونؤكد لك السعر قبل البدء.
    - q: هل يمكن تغيير ألوان الخطوط؟
      a: نعم، يُحفر الإطار بالألوان التي تختارها، مثل الذهبي أو الرمادي أو ألوان تطابق كنب مجلسك. اختر الألوان من العينات في المحل أو في الزيارة المجانية.
    - q: ما المقاس المناسب لزولية المجلس؟
      a: الشائع أن تمتد الزولية تحت الأرجل الأمامية للكنب أو تقف قبله بقليل، وتغطي منطقة الجلسة كلها. يقيس المندوب المجلس مجانًا ويقترح المقاس.
    - q: هل هذه زولية جاهزة؟
      a: لا، نسق زولية مفصلة تُصنع بالمقاس والألوان التي تطلبها. ونوفر أيضًا زوالي جاهزة بالمقاسات الشائعة، وزوالي تُقص بالمتر.
en:
  name: Nasaq Custom Rug with a Striped Border
  directAnswer: Nasaq is a custom-made rug sized to your majlis, with a soft cream field and a border of parallel black and taupe stripes that cross at the corners. It is made to the length and width you set to cover the whole seating area, and the border is hand-carved in the colours you choose. Custom pricing depends on size and finishing; we confirm it on WhatsApp.
  usage: We designed it for a modern majlis with white sofas and black side tables, so the black and taupe border ties the furniture to the floor. It can be made with fewer or more stripes, in colours to suit your room, and sized to leave a marble margin or fill the room.
  care: Vacuum regularly in the direction of the pile, and blot spills straight away with a damp cloth. Rotate the rug every few months so wear spreads evenly.
  seoTitle: Custom Majlis Rug with Striped Border in Kuwait | Sajjadko
  seoDescription: Nasaq custom rug sized to your majlis, cream with a hand-carved black and taupe striped border. Custom rugs in Kuwait, priced by size on WhatsApp.
  reviewed: true
  faq:
    - q: How much does a custom rug like Nasaq cost?
      a: The price depends on the rug size, the number of border stripes and the finishing. Send the seating area length and width on WhatsApp and we confirm the price before we start.
    - q: Can the stripe colours be changed?
      a: Yes. The border is carved in the colours you choose, such as gold, grey or shades matching your sofas. Pick them from samples at the shop or at the free visit.
