ar:
  name: زولية أطفال بنقش أرنب بارز
  directAnswer: زولية أطفال جاهزة بوبر ناعم ونقش أرنب كبير بارز بالرمادي والوردي على أرضية بيضاء، تحيط به نقاط ملونة. النقش محفور بارتفاعين للوبر فيُلمس باليد. تناسب غرف الأطفال وغرف البنات. السعر حسب المقاس، ونؤكده عبر واتساب.
