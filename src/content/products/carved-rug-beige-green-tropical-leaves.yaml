ar:
  name: سجاد حفر يدوي بيج بأوراق خضراء استوائية
  directAnswer: سجاد حفر يدوي بأرضية بيج، عليه أوراق استوائية خضراء وأغصان ملتفة وزهور بالبيج والذهبي، داخل إطار أخضر رفيع. محفور يدويًا بعدة ألوان، ويُفصّل بالمقاس والألوان، والسعر حسب المواصفات عبر واتساب.
  usage: الأوراق الخضراء تضيف لونًا طبيعيًا إلى الصالات والمجالس ذات الجدران والأثاث الفاتح.
  care: نظّفه بالمكنسة الكهربائية بانتظام في اتجاه الوبر، وامسح البقع فور وقوعها دون فرك حتى تبقى حواف الحفر واضحة.
  seoTitle: سجاد حفر يدوي بيج بأوراق خضراء استوائية — حفر يدوي بالكويت
  seoDescription: سجاد حفر يدوي بيج بأوراق استوائية خضراء وزهور بيج وذهبية داخل إطار أخضر، تفصيل سجاد للصالات والمجالس في الكويت.
  reviewed: true
  faq:
  - q: كم سعره؟
    a: السعر حسب المقاس وحجم النقشة وعدد ألوانها والمواصفات التي تختارها. أرسل المقاس عبر واتساب ونرسل لك السعر قبل البدء.
  - q: هل أستطيع تغيير النقشة أو الألوان؟
    a: نعم، ننفذ النقشة نفسها بألوانك أو بمقاس مختلف، أو نحفر نقشة ترسلها أنت، ونؤكد معك الرسم والألوان قبل البدء.
  - q: هل الزيارة والقياس مجانًا؟
    a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Beige Hand-Carved Rug with Green Tropical Leaves
  directAnswer: A hand-carved rug with a beige ground, green tropical leaves, scrolling branches and beige and gold flowers inside a thin green border. Carved by hand in several colours and made to your size; priced by specification on WhatsApp.
  usage: The green leaves bring a natural colour to living rooms and majlis rooms with light walls and furniture.
  care: Vacuum regularly along the pile and blot spills straight away without rubbing so the carved edges stay crisp.
  seoTitle: Beige Hand-Carved Rug, Green Tropical Leaves | Sajjadko
  seoDescription: Beige hand-carved rug with green tropical leaves and beige and gold flowers in a green border, made to size in Kuwait.
  reviewed: true
  faq:
  - q: How much is it?
    a: Priced by size, design size, number of colours and the specification you choose. Send the size on WhatsApp for a price before we start.
  - q: Can I change the design or colours?
    a: Yes. We make this design in your colours or size, or carve a design you send, and confirm the drawing and colours before starting.
  - q: Is the home visit and measuring free?
    a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
