ar:
  name: سجاد مشجر بنقش منسوج متشابك بسبعة ألوان
  directAnswer: سجاد مشجر بنقش منسوج متشابك صغير يتكرر على السطح كله، بسبعة ألوان من الفحمي والرمادي إلى الذهبي والبيج والعاجي، بأرضية ناعمة ونقش بارز محفور. يناسب الصالات والمجالس وغرف النوم. يُباع بالمتر المربع ويُقص على مقاس المكان أو زولية بالمقاس الذي تريده، والسعر من 5 إلى 15 د.ك للمتر المربع حسب السماكة والضغط والكثافة.
  usage: النقش المنسوج الصغير منتظم وهادئ، فيناسب المساحات الكبيرة دون أن يزدحم المكان، ويتناسق مع الأثاث الكلاسيكي والحديث.
  care: نظّفه بالمكنسة الكهربائية بانتظام باتجاه الوبر، وامسح البقع فور وقوعها بقطعة قماش مبللة دون فرك.
  seoTitle: سجاد مشجر بنقش منسوج متشابك بالمتر في الكويت — سجادكو
  seoDescription: سجاد مشجر بنقش منسوج متشابك بسبعة ألوان للصالات والمجالس وغرف النوم، بالمتر أو زولية بالمقاس، من 5 إلى 15 د.ك للمتر المربع.
  reviewed: true
  faq:
    - q: كم سعر هذا السجاد المشجر بالمتر؟
      a: من 5 إلى 15 د.ك للمتر المربع حسب السماكة والضغط والكثافة. غرفة 4×5 م (20 م²) تكلف بين 100 و300 د.ك قبل التركيب. ونؤكد السعر النهائي عبر واتساب.
    - q: هل يُقص على مقاس غرفتي أو كزولية؟
      a: نعم، يُقص بالمتر على مقاس الغرفة من الجدار إلى الجدار، أو قطعة بمقاس منطقة الجلسة تُستخدم زولية. نراجع المقاس معك قبل القص.
    - q: هل يناسب المجالس الكبيرة؟
      a: نعم، النقش الصغير المتكرر يناسب المساحات الكبيرة لأنه لا يزدحم، ويُقص على مقاس المجلس كاملًا.
    - q: هل الزيارة والقياس مجانًا؟
      a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Patterned Carpet with a Basket-Weave Design in Seven Colours
  directAnswer: This is a patterned carpet with a small repeating basket-weave design across the surface, in seven colours from charcoal and grey to gold, beige and ivory, with a soft ground and a raised carved design. It suits living rooms, majlis rooms and bedrooms. Sold by the m² and cut to your room, or made as a rug to the size you want, at 5 to 15 KWD per m² (0.465 to 1.394 KWD per sq ft) depending on thickness, pile pressure and density.
  usage: The small basket weave is regular and calm, so it suits large areas without crowding the room and works with both classic and modern furniture.
  care: Vacuum regularly in the direction of the pile, and blot spills straight away with a damp cloth without rubbing.
  seoTitle: Basket-Weave Patterned Carpet in Kuwait | Sajjadko Kuwait
  seoDescription: Patterned carpet with a basket-weave design in seven colours for living rooms, majlis and bedrooms, by the m² or as a rug, 5 to 15 KWD per m².
  reviewed: true
  faq:
    - q: How much is this patterned carpet per m²?
      a: 5 to 15 KWD per m² depending on thickness, pile pressure and density. A 4 × 5 m (20 m²) room costs about 100 to 300 KWD before installation.
    - q: Can it be cut to my room or made as a rug?
      a: Yes. It is cut by the metre to fit the room wall to wall, or cut to the size of your seating area as a rug. We confirm measurements with you before cutting.
    - q: Does it suit large majlis rooms?
      a: Yes. The small repeating design suits large areas because it does not look busy, and it is cut to fit the whole room.
    - q: Is the home visit and measuring free?
      a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
