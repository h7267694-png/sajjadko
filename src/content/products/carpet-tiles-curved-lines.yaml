ar:
  name: بلاط سجاد 40×40 بنقش خطوط منحنية بثمانية ألوان
  directAnswer: بلاط سجاد بمقاس 40×40 سم بنقش خطوط منحنية بارزة تتقاطع على سطح البلاطة، بثمانية ألوان من الفحمي والرمادي إلى البيج والكريمي والأبيض. للمكاتب والفنادق وغرف الاجتماعات. يُباع بالمتر المربع من 5 إلى 6 د.ك، والمتر فيه 6.25 بلاطة، والبلاطة التالفة تُبدل وحدها دون تغيير الأرضية.
  usage: النقش المنحني يعطي الأرضية حركة دون أن يكون لافتًا، ويخفي آثار المشي اليومية أكثر من البلاط السادة. الرمادي والفحمي للممرات ومناطق الحركة الكثيرة، والبيج والكريمي لغرف الاجتماعات والاستقبال.
  care: نظّفه بالمكنسة الكهربائية بانتظام، وامسح البقع فور وقوعها بقطعة قماش مبللة. البلاطة التي يتعذر تنظيفها تُرفع وتُبدل بأخرى من الطلبية نفسها.
  seoTitle: بلاط سجاد 40×40 بنقش خطوط منحنية للمكاتب — سجادكو
  seoDescription: بلاط سجاد مكاتب 40×40 سم بنقش خطوط منحنية بثمانية ألوان، من 5 إلى 6 د.ك للمتر المربع في الكويت، مع القياس والتركيب.
  reviewed: true
  faq:
    - q: كم سعر بلاط السجاد بنقش الخطوط المنحنية؟
      a: من 5 إلى 6 د.ك للمتر المربع، ونؤكد السعر الدقيق عند اختيار الخامة. مكتب 50 م² يحتاج نحو 313 بلاطة، بكلفة بين 250 و300 د.ك قبل التركيب.
    - q: كم لونًا متوفرًا؟
      a: 'ثمانية ألوان: الفحمي والرمادي والرمادي الفاتح والبني الرمادي والذهبي الزيتي والبيج والكريمي والأبيض. أرسل اللون الذي تريده عبر واتساب لنؤكد المتوفر.'
    - q: هل يمكن تبديل بلاطة واحدة؟
      a: نعم، البلاطة التالفة تُرفع وتوضع مكانها بلاطة جديدة دون المساس بالباقي. ننصح بالاحتفاظ ببضع بلاطات احتياطية من الطلبية نفسها.
en:
  name: 40×40 Carpet Tiles with a Curved Line Pattern in Eight Colours
  directAnswer: These are 40×40 cm carpet tiles with a raised curved line pattern that crosses the tile surface, in eight colours from charcoal and grey to beige, cream and white. For offices, hotels and meeting rooms. Sold by the m² at 5 to 6 KWD (0.465 to 0.557 KWD per sq ft); one m² takes 6.25 tiles, and a damaged tile can be replaced on its own.
  usage: The curved pattern adds movement to the floor without standing out, and hides everyday wear better than plain tiles. Grey and charcoal suit corridors and busy areas; beige and cream suit meeting rooms and reception.
  care: Vacuum regularly and blot spills straight away with a damp cloth. A tile that cannot be cleaned is lifted and replaced with one from the same order.
  seoTitle: 40×40 Curved Line Carpet Tiles for Offices | Sajjadko Kuwait
  seoDescription: 40×40 cm office carpet tiles with a curved line pattern in eight colours, 5 to 6 KWD per m² in Kuwait, measured and installed.
  reviewed: true
  faq:
    - q: How much are these carpet tiles?
      a: 5 to 6 KWD per m², confirmed once you choose the material. A 50 m² office needs about 313 tiles, roughly 250 to 300 KWD before installation.
    - q: Can one tile be replaced?
      a: Yes. A damaged tile is lifted and a new one goes in its place without touching the rest. Keep a few spare tiles from the same order.
