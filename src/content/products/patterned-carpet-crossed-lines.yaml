ar:
  name: سجاد مشجر بنقش خطوط هندسية متقاطعة
  directAnswer: سجاد مشجر بنقش خطوط هندسية فاتحة متقاطعة على أرضية سادة، بسبعة ألوان منها الزيتي والبني الرمادي والبيج والفحمي والفضي والعاجي والأبيض، بأرضية ناعمة ونقش بارز محفور. يناسب الصالات والمجالس وغرف النوم. يُباع بالمتر المربع ويُقص على مقاس المكان أو زولية بالمقاس الذي تريده، والسعر من 5 إلى 15 د.ك للمتر المربع حسب السماكة والضغط والكثافة.
  usage: الخطوط المتقاطعة تعطي الأرضية مظهرًا هندسيًا حديثًا. الزيتي والفحمي يبرزان النقش، والعاجي والفضي يعطيان المكان اتساعًا.
  care: نظّفه بالمكنسة الكهربائية بانتظام باتجاه الوبر، وامسح البقع فور وقوعها بقطعة قماش مبللة دون فرك.
  seoTitle: سجاد مشجر بنقش خطوط متقاطعة بالمتر في الكويت — سجادكو
  seoDescription: سجاد مشجر بنقش خطوط هندسية متقاطعة بسبعة ألوان للصالات والمجالس وغرف النوم، بالمتر أو زولية بالمقاس، من 5 إلى 15 د.ك للمتر المربع.
  reviewed: true
  faq:
  - q: كم سعر هذا السجاد المشجر بالمتر؟
    a: من 5 إلى 15 د.ك للمتر المربع حسب السماكة والضغط والكثافة. غرفة 4×5 م (20 م²) تكلف بين 100 و300 د.ك قبل التركيب. ونؤكد السعر النهائي عبر واتساب.
  - q: هل يُقص على مقاس غرفتي أو كزولية؟
    a: نعم، يُقص بالمتر على مقاس الغرفة من الجدار إلى الجدار، أو قطعة بمقاس منطقة الجلسة تُستخدم زولية. نراجع المقاس معك قبل القص.
  - q: كم لونًا متوفرًا؟
    a: 'سبعة ألوان: الزيتي والبني الرمادي والعاجي والبيج والفحمي والأبيض والفضي. أرسل اللون عبر واتساب لنؤكد المتوفر.'
  - q: هل الزيارة والقياس مجانًا؟
    a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Patterned Carpet with Crossed Geometric Lines
  directAnswer: This is a patterned carpet with light crossed geometric lines on a plain ground, in seven colours including olive, taupe, beige, charcoal, silver, ivory and white, with a soft ground and a raised carved design. It suits living rooms, majlis rooms and bedrooms. Sold by the m² and cut to your room, or made as a rug to the size you want, at 5 to 15 KWD per m² (0.465 to 1.394 KWD per sq ft) depending on thickness, pile pressure and density.
  usage: The crossed lines give the floor a modern geometric look. Olive and charcoal bring out the pattern; ivory and silver make the room feel larger.
  care: Vacuum regularly in the direction of the pile, and blot spills straight away with a damp cloth without rubbing.
  seoTitle: Patterned Carpet with Crossed Lines in Kuwait | Sajjadko
  seoDescription: Patterned carpet with crossed geometric lines in seven colours for living rooms, majlis and bedrooms, by the m² or as a rug, 5 to 15 KWD per m².
  reviewed: true
  faq:
  - q: How much is this patterned carpet per m²?
    a: 5 to 15 KWD per m² depending on thickness, pile pressure and density. A 4 × 5 m (20 m²) room costs about 100 to 300 KWD before installation.
  - q: Can it be cut to my room or made as a rug?
    a: Yes. It is cut by the metre to fit the room wall to wall, or cut to the size of your seating area as a rug. We confirm measurements with you before cutting.
  - q: How many colours are there?
    a: 'Seven: olive, taupe, ivory, beige, charcoal, white and silver.'
  - q: Is the home visit and measuring free?
    a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
