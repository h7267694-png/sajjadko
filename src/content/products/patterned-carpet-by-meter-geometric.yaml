ar:
  name: سجاد مشجر بالمتر بنقوش هندسية ومفتاح يوناني
  directAnswer: 'سجاد مشجر بالمتر بنقش بارز محفور يجمع وبرًا لامعًا وأرضية منسوجة، بخمسة تصاميم: معيّنات متدرجة بالبني أو الرمادي، ونقش المفتاح اليوناني بالبني أو الكحلي، ونقش تراثي بالبني. يُقص من الرول على مقاس الغرفة أو كزولية، من 5 إلى 15 د.ك للمتر المربع حسب السماكة والضغط والكثافة.'
  usage: النقوش الهندسية تناسب المجالس والصالات الحديثة والممرات. المعيّنات الرمادية تتناسق مع الكنب الرمادي والأبيض، والبني مع الخشب والبيج، والمفتاح اليوناني الكحلي مع الأزرق والذهبي.
  care: نظّفه بالمكنسة الكهربائية بانتظام، وامسح البقع فور وقوعها بقطعة قماش مبللة دون فرك. النقش المحفور يخفي آثار الاستعمال أكثر من السجاد السادة.
  seoTitle: سجاد مشجر بالمتر بنقوش هندسية في الكويت — سجادكو
  seoDescription: سجاد مشجر محفور بالمتر بنقوش هندسية ومفتاح يوناني بالبني والرمادي والكحلي للمجالس والصالات، من 5 إلى 15 د.ك للمتر المربع في الكويت.
  reviewed: true
  faq:
  - q: كم سعر السجاد المشجر بالمتر؟
    a: من 5 إلى 15 د.ك للمتر المربع حسب السماكة والضغط والكثافة. مجلس 4×6 م (24 م²) يكلف بين 120 و360 د.ك قبل التركيب.
  - q: هل يُقص على مقاس غرفتي أو كزولية؟
    a: نعم، يُقص بالمتر من الرول على مقاس الغرفة من الجدار إلى الجدار، أو قطعة بمقاس منطقة الجلسة تُستخدم زولية. نراجع المقاس معك قبل القص.
  - q: كم تصميمًا متوفرًا؟
    a: 'خمسة تصاميم في المحل: معيّنات متدرجة بالبني وبالرمادي، والمفتاح اليوناني بالبني وبالكحلي، ونقش تراثي بالبني. أرسل صورة التصميم عبر واتساب لنؤكد الكمية.'
  - q: هل الزيارة والقياس مجانًا؟
    a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Patterned Carpet by the Metre with Geometric and Greek Key Designs
  directAnswer: 'This is a patterned carpet by the metre with a raised carved design combining a sheen pile and a woven ground, in five designs: stepped diamonds in brown or grey, a Greek key in brown or navy, and a heritage motif in brown. Cut from the roll to your room or as a rug, at 5 to 15 KWD per m² depending on thickness, pile pressure and density.'
  usage: Geometric designs suit modern majlis rooms, living rooms and hallways. Grey diamonds go with grey and white sofas, brown with wood and beige, and the navy Greek key with blue and gold.
  care: Vacuum regularly and blot spills straight away with a damp cloth. The carved pattern hides wear better than plain carpet.
  seoTitle: Geometric Patterned Carpet by the Metre, Kuwait | Sajjadko
  seoDescription: Carved patterned carpet by the metre with geometric and Greek key designs in brown, grey and navy, 5 to 15 KWD per m² in Kuwait.
  reviewed: true
  faq:
  - q: How much is patterned carpet per m²?
    a: 5 to 15 KWD per m². A 24 m² majlis costs about 120 to 360 KWD before installation.
  - q: Can it be cut to my room or as a rug?
    a: Yes. It is cut from the roll by the metre to fit the room wall to wall, or to the size of your seating area as a rug. We confirm measurements before cutting.
  - q: Is the home visit and measuring free?
    a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
