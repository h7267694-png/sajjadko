ar:
  name: موكيت صالة محفور بزخارف نباتية متعددة الألوان
  directAnswer: موكيت كريمي يغطي أرضية صالة واسعة من الجدار للجدار، محفور بزخارف نباتية متناظرة بالأحمر العنابي والأزرق والزيتي والرمادي ولمسات ذهبية. النقش يتكرر بتناظر على طول القاعة. نركّبه من الجدار للجدار ونقصه على مقاس المكان. السعر حسب المقاس وحجم النقشة، ونؤكده عبر واتساب.
  usage: يناسب الصالات الكبيرة وقاعات الاستقبال التي تُترك أرضيتها ظاهرة، فالنقش يملأ المساحة دون حاجة لزوالي متفرقة.
  care: نظّفه بالمكنسة الكهربائية بانتظام في اتجاه الوبر، وامسح البقع فور وقوعها دون فرك حتى تبقى حواف الحفر واضحة.
  seoTitle: موكيت صالة محفور بزخارف نباتية متعددة الألوان في الكويت — سجادكو
  seoDescription: موكيت صالة محفور بزخارف نباتية متعددة الألوان، حفر يدوي في ورشتنا بالنقشة والألوان التي تختارها، للصالات والمجالس والديوانيات في الكويت. السعر حسب المقاس.
  reviewed: true
  faq:
    - q: كم سعره؟
      a: السعر حسب مساحة المكان وحجم النقشة وعدد ألوانها. أرسل صورة النقشة والمقاس عبر واتساب ونرسل لك السعر قبل البدء.
    - q: هل أستطيع تغيير النقشة أو الألوان؟
      a: نعم، ننفذ النقشة نفسها بألوانك، أو نحفر نقشة ترسلها أنت، ونؤكد معك الرسم والألوان قبل البدء.
    - q: هل الزيارة والقياس مجانًا؟
      a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Carved Hall Carpet with Multicolour Floral Scrolls
  directAnswer: Cream carpet covering a wide hall wall to wall, carved with symmetrical floral scrolls in burgundy, blue, olive and grey with gold touches, repeating along the hall. We fit it wall to wall, cut to your room. Priced by size and design; we confirm on WhatsApp.
  usage: Suits large halls and reception rooms where the floor stays visible; the pattern fills the space without loose rugs.
  care: Vacuum regularly along the pile and blot spills straight away without rubbing so the carved edges stay crisp.
  seoTitle: Carved Hall Carpet with Multicolour Floral Scrolls | Sajjadko Kuwait
  seoDescription: Carved Hall Carpet with Multicolour Floral Scrolls, hand-carved in our workshop in your design and colours for living rooms, majlis and diwaniya in Kuwait.
  reviewed: true
  faq:
    - q: How much is it?
      a: Priced by area, design size and number of colours. Send the design and size on WhatsApp for a price before we start.
    - q: Can I change the design or colours?
      a: Yes. We make this design in your colours or carve a design you send, and confirm the drawing and colours before starting.
    - q: Is the home visit and measuring free?
      a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
