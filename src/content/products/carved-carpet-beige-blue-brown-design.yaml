ar:
  name: موكيت صالة بيج بنقش أزرق وبني محفور
  directAnswer: موكيت بيج مخملي من الجدار للجدار، يتوسطه نقش بأغصان زرقاء ولمسات بنية على أرضية كريمية داخل إطار بني متعرج، محفور يدويًا ومدمج في الموكيت. نركّبه ونقصه على مقاس المكان. السعر حسب المقاس وحجم النقشة، ونؤكده عبر واتساب.
  usage: الأزرق الهادئ مع البني يتناسق مع الكنب الأزرق والخشب في الصالات.
  care: نظّفه بالمكنسة الكهربائية بانتظام في اتجاه الوبر، وامسح البقع فور وقوعها دون فرك حتى تبقى حواف الحفر واضحة.
  seoTitle: موكيت صالة بيج بنقش أزرق وبني محفور في مبارك الكبير — سجادكو
  seoDescription: موكيت صالة بيج بنقش أزرق وبني محفور، سجاد حفر يدوي مدمج في الموكيت بالمقاس والنقش الذي تختاره للصالات في الكويت. السعر حسب المساحة.
  reviewed: true
  faq:
    - q: كم سعره؟
      a: السعر حسب مساحة المكان وحجم النقشة وعدد ألوانها. أرسل صورة النقشة والمقاس عبر واتساب ونرسل لك السعر قبل البدء.
    - q: هل أستطيع تغيير النقشة أو الألوان؟
      a: نعم، ننفذ النقشة نفسها بألوانك، أو نحفر نقشة ترسلها أنت، ونؤكد معك الرسم والألوان قبل البدء.
    - q: هل الزيارة والقياس مجانًا؟
      a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Beige Living Room Carpet with a Carved Blue and Brown Design
  directAnswer: Beige plush wall-to-wall carpet with a centre design of blue scrolls and brown accents on a cream ground inside a curved brown outline, hand-carved and inlaid into the carpet. We cut and fit it to your room. Priced by size and design; we confirm on WhatsApp.
  usage: The soft blue with brown suits blue sofas and wooden furniture in living rooms.
  care: Vacuum regularly along the pile and blot spills straight away without rubbing so the carved edges stay crisp.
  seoTitle: Beige Carved Carpet, Blue and Brown, Mubarak Al-Kabeer
  seoDescription: Beige wall-to-wall living room carpet with a hand-carved blue and brown design, made in our workshop to your room and colours in Kuwait.
  reviewed: true
  faq:
    - q: How much is it?
      a: Priced by room area, design size and number of colours. Send the design and size on WhatsApp for a price before we start.
    - q: Can I change the design or colours?
      a: Yes. We make this design in your colours or carve a design you send, and confirm the drawing and colours before starting.
    - q: Is the home visit and measuring free?
      a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
