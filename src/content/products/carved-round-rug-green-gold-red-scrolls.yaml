ar:
  name: زولية دائرية حفر يدوي بزخارف خضراء وذهبية
  directAnswer: زولية دائرية حفر يدوي بأرضية كريمية، عليها زخارف أوراق خضراء ورمادية ملتفة بلمسات حمراء وخطوط ذهبية، داخل حلقتين حمراء وذهبية. محفورة يدويًا بعدة ألوان، وتُفصّل بالقطر والألوان، والسعر حسب المواصفات عبر واتساب.
  usage: الزولية الدائرية الملونة تناسب وسط الصالات والمداخل الواسعة.
  care: نظّفه بالمكنسة الكهربائية بانتظام في اتجاه الوبر، وامسح البقع فور وقوعها دون فرك حتى تبقى حواف الحفر واضحة.
  seoTitle: زولية دائرية حفر يدوي خضراء وذهبية — حفر يدوي بالكويت
  seoDescription: زولية دائرية حفر يدوي كريمية بزخارف خضراء ورمادية ولمسات حمراء وحلقتين حمراء وذهبية، تفصيل سجاد للصالات والمداخل.
  reviewed: true
  faq:
  - q: كم سعره؟
    a: السعر حسب المقاس وحجم النقشة وعدد ألوانها والمواصفات التي تختارها. أرسل المقاس عبر واتساب ونرسل لك السعر قبل البدء.
  - q: هل أستطيع تغيير النقشة أو الألوان؟
    a: نعم، ننفذ النقشة نفسها بألوانك أو بمقاس مختلف، أو نحفر نقشة ترسلها أنت، ونؤكد معك الرسم والألوان قبل البدء.
  - q: هل الزيارة والقياس مجانًا؟
    a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Round Hand-Carved Rug with Green and Gold Scrolls
  directAnswer: A round hand-carved rug with a cream ground, green and grey scrolling leaves with red touches and gold lines, inside red and gold rings. Carved by hand in several colours and made to your diameter; priced by specification on WhatsApp.
  usage: A colourful round rug suits the centre of living rooms and wide entrances.
  care: Vacuum regularly along the pile and blot spills straight away without rubbing so the carved edges stay crisp.
  seoTitle: Round Hand-Carved Rug, Green and Gold Scrolls | Sajjadko
  seoDescription: Round cream hand-carved rug with green and grey scrolls, red touches and red and gold rings, made to size in Kuwait.
  reviewed: true
  faq:
  - q: How much is it?
    a: Priced by size, design size, number of colours and the specification you choose. Send the size on WhatsApp for a price before we start.
  - q: Can I change the design or colours?
    a: Yes. We make this design in your colours or size, or carve a design you send, and confirm the drawing and colours before starting.
  - q: Is the home visit and measuring free?
    a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
