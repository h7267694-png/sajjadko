ar:
  name: موكيت مجلس بإطار مثلثات بنية محفورة
  directAnswer: موكيت مخملي فاتح من الجدار للجدار، يتوسطه إطار عريض من مثلثات بنية متناثرة بين خطين بنيين، محفور يدويًا ومدمج في الموكيت. نركّبه ونقصه على مقاس المكان، ونرسم الإطار بالمقاس الذي يناسب الجلسة. السعر حسب المقاس وحجم النقشة، ونؤكده عبر واتساب.
  usage: الإطار الهندسي يحدد مساحة الجلسة في المجلس الأرضي، ويناسب الديكور الحديث بالألوان الهادئة.
  care: نظّفه بالمكنسة الكهربائية بانتظام في اتجاه الوبر، وامسح البقع فور وقوعها دون فرك حتى تبقى حواف الحفر واضحة.
  seoTitle: موكيت مجلس بإطار مثلثات بنية محفورة في مبارك الكبير — سجادكو
  seoDescription: موكيت مجلس فاتح بإطار مثلثات بنية محفورة، سجاد حفر يدوي مدمج في الموكيت بالمقاس والنقش الذي تختاره، للمجالس والديوانيات في الكويت. السعر حسب المساحة.
  reviewed: true
  faq:
    - q: كم سعره؟
      a: السعر حسب مساحة المكان وحجم النقشة وعدد ألوانها. أرسل صورة النقشة والمقاس عبر واتساب ونرسل لك السعر قبل البدء.
    - q: هل أستطيع تغيير النقشة أو الألوان؟
      a: نعم، ننفذ النقشة نفسها بألوانك، أو نحفر نقشة ترسلها أنت، ونؤكد معك الرسم والألوان قبل البدء.
    - q: هل الزيارة والقياس مجانًا؟
      a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Majlis Carpet with a Carved Brown Triangle Border
  directAnswer: Light plush wall-to-wall carpet with a wide border of scattered brown triangles between two brown lines, hand-carved and inlaid into the carpet. We cut and fit it to your room and size the border to the seating. Priced by size and design; we confirm on WhatsApp.
  usage: The geometric border marks out the seating area of a floor majlis and suits modern interiors in calm colours.
  care: Vacuum regularly along the pile and blot spills straight away without rubbing so the carved edges stay crisp.
  seoTitle: Majlis Carpet with a Carved Brown Triangle Border, Mubarak Al-Kabeer
  seoDescription: Wall-to-wall majlis carpet with a hand-carved brown triangle border, made in our workshop to your room and colours for majlis and diwaniya in Kuwait.
  reviewed: true
  faq:
    - q: How much is it?
      a: Priced by room area, design size and number of colours. Send the design and size on WhatsApp for a price before we start.
    - q: Can I change the design or colours?
      a: Yes. We make this design in your colours or carve a design you send, and confirm the drawing and colours before starting.
    - q: Is the home visit and measuring free?
      a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
