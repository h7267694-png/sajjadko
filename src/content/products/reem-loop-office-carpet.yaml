en:
  name: Reem Loop-Pile Office Carpet in 19+ Colours
  directAnswer: Reem is a Turkish loop-pile office carpet with a firm surface, in more than 19 colours including navy, red, green, black, grey and beige. It stands up to heavy foot traffic and office chairs, and suits offices, corridors, meeting rooms and hotels. Sold by the m² and cut to size, from 5 to 15 KWD per m² (0.465 to 1.394 KWD per sq ft) depending on thickness, pile pressure and density.
  usage: Choose it for open-plan offices, meeting rooms and long corridors. Dark and flecked shades hide daily wear, while bold colours such as red, royal blue and green can match your brand colour in reception areas and halls.
  care: Vacuum regularly, and blot spills straight away with a damp cloth without rubbing.
  seoTitle: Reem Loop-Pile Office Carpet, Kuwait | Sajjadko Kuwait
  seoDescription: Turkish loop-pile commercial carpet in 19+ colours for offices, corridors and meeting rooms, cut and installed in Kuwait. 5 to 15 KWD per m².
  faq:
    - q: How much does Reem office carpet cost per m²?
      a: It is sold by the m², from 5 to 15 KWD (0.465 to 1.394 KWD per sq ft) depending on thickness, pile pressure and density. Multiply your office floor area by the price per m² for an estimate. Installation is separate and agreed by area and location.
    - q: Why is loop pile carpet used in offices?
      a: A loop pile is firm and keeps its shape under heavy foot traffic and office chairs, and it hides daily wear better than a soft cut pile. That is why it is the usual choice for offices, corridors and meeting rooms.
    - q: Can you carpet an office in our brand colour?
      a: There is a wide range of colours, including blues, reds, greens, greys and black. Send your brand colour or a colour code on WhatsApp and we confirm the closest match in stock.
    - q: How much carpet does a 100 m² office need?
      a: A 100 m² (1,076 sq ft) open office needs about 100 m² of carpet plus a small allowance for cutting around columns and doorways, which we confirm after measuring. At 5 to 15 KWD per m², the carpet is roughly 500 to 1,500 KWD before installation.
    - q: Do you install office carpet?
      a: Yes, we install the carpet we supply. Installation is priced separately from the per-m² price and agreed by area and location, and we follow up for two days to fix any installation error. We do not install carpet bought elsewhere.
  reviewed: true
