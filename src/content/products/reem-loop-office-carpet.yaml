en:
  name: Lightweight Loop-Pile Office Carpet
  directAnswer: This is a lightweight loop-pile office carpet sold by the roll, not a carpet tile, in more than 19 colours including navy, red, green, black, grey and beige. It starts from 1.250 KWD per m² (0.116 KWD per sq ft). It withstands foot traffic and office chairs, is cut to your floor plan and installed, and suits offices, corridors, meeting rooms and hotels.
  usage: Suitable for open-plan offices, meeting rooms and long corridors. Dark and flecked shades hide daily wear, while strong colours such as red, royal blue and green can match your brand colour in reception areas and halls.
  care: Vacuum regularly, and blot spills straight away with a damp cloth without rubbing.
  seoTitle: Lightweight Loop-Pile Office Carpet in Kuwait | Sajjadko Kuwait
  seoDescription: Lightweight loop-pile office carpet in 19+ colours from 1.250 KWD per m², cut and installed in Kuwait for offices, corridors and meeting rooms.
  faq:
    - q: How much does this loop-pile office carpet cost per m²?
      a: It is sold by the m², from 1.250 to 3 KWD (0.116 to 0.279 KWD per sq ft) depending on thickness, pile pressure and density. Multiply your office floor area by the price per m² for an estimate. Installation is separate and agreed by area and location.
    - q: Why is loop pile carpet used in offices?
      a: A loop pile is firm and keeps its shape under heavy foot traffic and office chairs, and it hides daily wear better than a soft cut pile. That is why it is the usual choice for offices, corridors and meeting rooms.
    - q: Can you carpet an office in our brand colour?
      a: There is a wide range of colours, including blues, reds, greens, greys and black. Send your brand colour or a colour code on WhatsApp and we confirm the closest match in stock.
    - q: How much carpet does a 100 m² office need?
      a: A 100 m² (1,076 sq ft) open office needs about 100 m² of carpet plus a small allowance for cutting around columns and doorways, which we confirm after measuring. At 1.250 to 3 KWD per m², the carpet is roughly 125 to 300 KWD before installation.
    - q: Do you install office carpet?
      a: Yes, we install the carpet we supply. Installation is priced separately from the per-m² price and agreed by area and location, and we follow up for two days to fix any installation error. We do not install carpet bought elsewhere.
  reviewed: true
