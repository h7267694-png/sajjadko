ar:
  name: موكيت مجلس رمادي بزخرفة بنية وخضراء محفورة
  directAnswer: موكيت رمادي فاتح من الجدار للجدار في مجلس عربي، تمتد في وسطه زخرفة طولية بالبني الداكن مع خطوط خضراء، محفورة يدويًا ومدمجة في الموكيت بحواف بارزة. نركّبه من الجدار للجدار ونقصه على مقاس المكان. السعر حسب المقاس وحجم النقشة، ونؤكده عبر واتساب.
  usage: الزخرفة الطولية تتبع شكل المجلس المستطيل، والبني والأخضر هادئان مع الجلسات البيج.
  care: نظّفه بالمكنسة الكهربائية بانتظام في اتجاه الوبر، وامسح البقع فور وقوعها دون فرك حتى تبقى حواف الحفر واضحة.
  seoTitle: موكيت مجلس رمادي بزخرفة بنية وخضراء محفورة في الكويت — سجادكو
  seoDescription: موكيت مجلس رمادي بزخرفة بنية وخضراء محفورة، حفر يدوي في ورشتنا بالنقشة والألوان التي تختارها، للصالات والمجالس والديوانيات في الكويت. السعر حسب المقاس.
  reviewed: true
  faq:
    - q: كم سعره؟
      a: السعر حسب مساحة المكان وحجم النقشة وعدد ألوانها. أرسل صورة النقشة والمقاس عبر واتساب ونرسل لك السعر قبل البدء.
    - q: هل أستطيع تغيير النقشة أو الألوان؟
      a: نعم، ننفذ النقشة نفسها بألوانك، أو نحفر نقشة ترسلها أنت، ونؤكد معك الرسم والألوان قبل البدء.
    - q: هل الزيارة والقياس مجانًا؟
      a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Grey Majlis Carpet with a Carved Brown and Green Medallion
  directAnswer: Light grey wall-to-wall carpet in a floor-seating majlis with a long dark brown medallion and green inlay down the centre, hand-carved into the carpet with raised edges. We fit it wall to wall, cut to your room. Priced by size and design; we confirm on WhatsApp.
  usage: The long medallion follows the rectangular majlis; brown and green stay calm with beige seating.
  care: Vacuum regularly along the pile and blot spills straight away without rubbing so the carved edges stay crisp.
  seoTitle: Grey Majlis Carpet with a Carved Brown and Green Medallion | Sajjadko
  seoDescription: Grey Majlis Carpet with a Carved Brown and Green Medallion, hand-carved in our workshop in your design and colours for living rooms, majlis and diwaniya in Kuwa
  reviewed: true
  faq:
    - q: How much is it?
      a: Priced by area, design size and number of colours. Send the design and size on WhatsApp for a price before we start.
    - q: Can I change the design or colours?
      a: Yes. We make this design in your colours or carve a design you send, and confirm the drawing and colours before starting.
    - q: Is the home visit and measuring free?
      a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
