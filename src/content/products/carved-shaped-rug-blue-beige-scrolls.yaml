ar:
  name: زولية حفر يدوي بشكل مقصوص بزخارف زرقاء وبيج
  directAnswer: زولية حفر يدوي بشكل مقصوص بأطراف منحنية وزوايا مشطوفة، عليها زخارف ملتفة بدرجات الأزرق والبيج على أرضية كريمية، وإطار مزدوج كحلي وأزرق. محفورة يدويًا، وتُفصّل بالشكل والمقاس الذي تحتاجه، والسعر حسب المواصفات عبر واتساب.
  usage: الشكل المقصوص يتبع حدود المكان، فيناسب المداخل والصالات ذات الزوايا أو الأعمدة.
  care: نظّفه بالمكنسة الكهربائية بانتظام في اتجاه الوبر، وامسح البقع فور وقوعها دون فرك حتى تبقى حواف الحفر واضحة.
  seoTitle: زولية حفر يدوي بشكل مقصوص أزرق وبيج — حفر يدوي بالكويت
  seoDescription: زولية حفر يدوي بشكل مقصوص بأطراف منحنية وزخارف زرقاء وبيج وإطار كحلي، تفصيل سجاد بالشكل والمقاس للمداخل والصالات في الكويت.
  reviewed: true
  faq:
  - q: كم سعره؟
    a: السعر حسب المقاس وحجم النقشة وعدد ألوانها والمواصفات التي تختارها. أرسل المقاس عبر واتساب ونرسل لك السعر قبل البدء.
  - q: هل أستطيع تغيير النقشة أو الألوان؟
    a: نعم، ننفذ النقشة نفسها بألوانك أو بمقاس مختلف، أو نحفر نقشة ترسلها أنت، ونؤكد معك الرسم والألوان قبل البدء.
  - q: هل الزيارة والقياس مجانًا؟
    a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Shaped Hand-Carved Rug with Blue and Beige Scrolls
  directAnswer: A hand-carved rug cut to a shaped outline with curved ends and chamfered corners, with blue and beige scrolls on a cream ground and a double navy and blue border. Made to your shape and size; priced by specification on WhatsApp.
  usage: The shaped outline follows the room, so it suits entrances and living rooms with corners or columns.
  care: Vacuum regularly along the pile and blot spills straight away without rubbing so the carved edges stay crisp.
  seoTitle: Shaped Hand-Carved Rug, Blue and Beige Scrolls | Sajjadko
  seoDescription: Hand-carved rug cut to a shaped outline with blue and beige scrolls and a navy border, made to your shape and size in Kuwait.
  reviewed: true
  faq:
  - q: How much is it?
    a: Priced by size, design size, number of colours and the specification you choose. Send the size on WhatsApp for a price before we start.
  - q: Can I change the design or colours?
    a: Yes. We make this design in your colours or size, or carve a design you send, and confirm the drawing and colours before starting.
  - q: Is the home visit and measuring free?
    a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
