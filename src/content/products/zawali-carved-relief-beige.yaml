ar:
  name: زولية محفورة بنقش بارز بألوان البيج والبني الرمادي
  directAnswer: 'زولية جاهزة بنقش بارز محفور بلون واحد، يظهر فيها التصميم بفرق ارتفاع الوبر لا بتعدد الألوان، بخمسة تصاميم: خطوط، ومعيّنات، ونقش ملتف بإطار المفتاح اليوناني، ونقش متعرج، وصرتان هندسيتان، بألوان البيج والبني الرمادي والكريمي. تناسب الصالات الحديثة والمجالس. السعر حسب المقاس، ونؤكده عبر واتساب.'
  usage: النقش البارز بلون واحد يعطي الأرضية ملمسًا واضحًا دون ازدحام في الألوان، فيتناسق مع الكنب البيج والرخام الفاتح والطاولات الذهبية.
  care: نظّفها بالمكنسة الكهربائية بانتظام، وامسح البقع فور وقوعها بقطعة قماش مبللة دون فرك، وأدرها كل بضعة أشهر ليتوزع أثر المشي.
  seoTitle: زولية محفورة بنقش بارز بيج وبني رمادي في الكويت — سجادكو
  seoDescription: زولية جاهزة محفورة بنقش بارز بلون واحد بخمسة تصاميم بالبيج والبني الرمادي للصالات والمجالس الحديثة. السعر حسب المقاس.
  reviewed: true
  faq:
    - q: كم سعر هذه الزولية؟
      a: السعر حسب المقاس المتوفر أو المطلوب. أرسل المقاس الذي تحتاجه عبر واتساب، ونؤكد لك المتوفر والسعر.
    - q: ما المقاسات المتوفرة؟
      a: 'نؤكد المقاسات المتوفرة من هذا التصميم عبر واتساب. والمقاسات الشائعة للزوالي الجاهزة: 160×230 و200×300 و240×340 و300×400 سم.'
    - q: ما معنى النقش البارز المحفور؟
      a: الوبر في الزولية بارتفاعين، فيظهر التصميم بفرق الارتفاع والظل لا بتعدد الألوان، فيبقى المظهر هادئًا ويُلمس النقش باليد.
    - q: هل الزيارة والقياس مجانًا؟
      a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Carved Relief Rug in Beige and Taupe
  directAnswer: 'This is a ready-made rug with a single-colour carved relief, where the design shows through pile height rather than colour, in five designs: stripes, diamonds, swirls with a Greek key border, chevrons and two geometric medallions, in beige, taupe and cream. It suits modern living rooms and majlis rooms. Priced by size, confirmed on WhatsApp.'
  usage: The one-colour relief gives the floor clear texture without busy colour, matching beige sofas, light marble and gold tables.
  care: Vacuum regularly, blot spills straight away with a damp cloth and rotate the rug every few months.
  seoTitle: Carved Relief Rug in Beige and Taupe, Kuwait | Sajjadko
  seoDescription: Ready-made carved relief rug in one colour with five designs in beige and taupe for modern living rooms and majlis. Priced by size.
  reviewed: true
  faq:
    - q: How much is this rug?
      a: The price depends on the size available or requested. Send the size you need on WhatsApp and we confirm stock and price.
    - q: Is the home visit and measuring free?
      a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
