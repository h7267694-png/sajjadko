ar:
  name: سجاد حفر يدوي كريمي بنجمة هندسية إسلامية داكنة
  directAnswer: سجاد حفر يدوي بأرضية كريمية لامعة، تتوسطه نجمة هندسية إسلامية اثنا عشرية محفورة بلون داكن بارز عن الأرضية. يُنفذ بالمقاس والألوان التي تختارها، ويمكن حفر النقشة نفسها بألوان أخرى، والسعر حسب المواصفات عبر واتساب.
  usage: النجمة الهندسية تناسب المجالس والديوانيات وصالات الاستقبال، وتبرز على الأرضية الفاتحة.
  care: نظّفه بالمكنسة الكهربائية بانتظام في اتجاه الوبر، وامسح البقع فور وقوعها دون فرك حتى تبقى حواف الحفر واضحة.
  seoTitle: سجاد حفر يدوي بنجمة هندسية إسلامية — حفر يدوي بالكويت
  seoDescription: سجاد حفر يدوي كريمي لامع تتوسطه نجمة هندسية إسلامية داكنة، للمجالس والديوانيات. تفصيل سجاد حسب المقاس والألوان في الكويت.
  reviewed: true
  faq:
  - q: كم سعره؟
    a: السعر حسب المقاس وحجم النقشة وعدد ألوانها والمواصفات التي تختارها. أرسل المقاس عبر واتساب ونرسل لك السعر قبل البدء.
  - q: هل أستطيع تغيير النقشة أو الألوان؟
    a: نعم، ننفذ النقشة نفسها بألوانك أو بمقاس مختلف، أو نحفر نقشة ترسلها أنت، ونؤكد معك الرسم والألوان قبل البدء.
  - q: هل الزيارة والقياس مجانًا؟
    a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Cream Hand-Carved Rug with an Islamic Geometric Star
  directAnswer: A hand-carved rug with a glossy cream ground and a twelve-point Islamic geometric star carved in a dark colour that stands out from the ground. Made to your size and colours, and the same design can be carved in other colours; priced by specification on WhatsApp.
  usage: The geometric star suits majlis rooms, diwaniyas and reception rooms, and stands out on the light ground.
  care: Vacuum regularly along the pile and blot spills straight away without rubbing so the carved edges stay crisp.
  seoTitle: Hand-Carved Rug with an Islamic Geometric Star | Sajjadko
  seoDescription: Glossy cream hand-carved rug with a dark Islamic geometric star, for majlis rooms and diwaniyas, made to your size and colours in Kuwait.
  reviewed: true
  faq:
  - q: How much is it?
    a: Priced by size, design size, number of colours and the specification you choose. Send the size on WhatsApp for a price before we start.
  - q: Can I change the design or colours?
    a: Yes. We make this design in your colours or size, or carve a design you send, and confirm the drawing and colours before starting.
  - q: Is the home visit and measuring free?
    a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
