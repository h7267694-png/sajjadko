ar:
  name: بلاط سجاد 40×40 بني وبيج بنقشة رقعة الشطرنج
  directAnswer: 'بلاط سجاد 40×40 سم بلونين: بني فاتح سادة وبيج مخطط، يُركّب بالتبادل بنقشة رقعة الشطرنج، مع إطار من البيج المخطط حول الأطراف. ركّبناه لمكاتب شركة في منطقة شرق. يُباع بالمتر المربع من 5 إلى 6 د.ك.'
  usage: نقشة رقعة الشطرنج تحدد منطقة الاجتماعات أو الاستقبال داخل المكتب دون فواصل، والإطار يفصلها عن الممرات ومكاتب العمل. الألوان الدافئة تناسب الأثاث الخشبي.
  care: نظّفه بالمكنسة الكهربائية بانتظام، وامسح البقع فور وقوعها بقطعة قماش مبللة. البلاطة التي يتعذر تنظيفها تُرفع وتُبدل بأخرى من الطلبية نفسها.
  seoTitle: بلاط سجاد مكاتب شركات 40×40 في شرق — سجادكو
  seoDescription: بلاط سجاد 40×40 بني وبيج بنقشة رقعة الشطرنج ركّبناه لمكاتب شركة في شرق. من 5 إلى 6 د.ك للمتر مع القياس والتركيب.
  reviewed: true
  faq:
    - q: هل يمكن عمل نقشة أو إطار بالبلاط؟
      a: نعم، نرتب البلاط بلونين أو أكثر لعمل رقعة شطرنج أو إطار أو ممرات، ونتفق معك على المخطط قبل التركيب.
    - q: كم سعر بلاط السجاد بالمتر؟
      a: من 5 إلى 6 د.ك للمتر المربع، والمتر فيه 6.25 بلاطة. مكتب 50 م² يحتاج نحو 313 بلاطة بكلفة بين 250 و300 د.ك قبل التركيب.
    - q: هل يمكن تبديل بلاطة واحدة؟
      a: نعم، البلاطة التالفة تُرفع وتوضع مكانها بلاطة جديدة دون المساس بالباقي، لذلك ننصح بالاحتفاظ ببضع بلاطات احتياطية.
    - q: هل الزيارة والقياس مجانًا؟
      a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Brown and Beige 40×40 Carpet Tiles in a Checkerboard
  directAnswer: 40×40 cm carpet tiles in plain light brown and striped beige, laid alternately in a checkerboard with a striped beige border. We fitted them in a company office in Sharq. 5 to 6 KWD per m².
  usage: The checkerboard marks the meeting or reception area without partitions, and the border separates it from aisles and workstations.
  care: Vacuum regularly and blot spills straight away with a damp cloth. A tile that will not come clean is lifted and replaced with one from the same batch.
  seoTitle: Office Carpet Tiles in Sharq, Kuwait | Sajjadko
  seoDescription: Brown and beige 40×40 carpet tiles in a checkerboard fitted in a company office in Sharq, Kuwait. 5 to 6 KWD per m².
  reviewed: true
  faq:
    - q: How much are carpet tiles per m²?
      a: 5 to 6 KWD per m², with 6.25 tiles per m². A 50 m² office needs about 313 tiles, 250 to 300 KWD before fitting.
    - q: Is the home visit and measuring free?
      a: Yes. We visit free of charge to measure and show samples, then send the price on WhatsApp.
