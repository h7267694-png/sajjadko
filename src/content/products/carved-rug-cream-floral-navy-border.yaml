ar:
  name: زولية صالة محفورة بزهور عنابية وإطار كحلي
  directAnswer: زولية تفصيل كبيرة بأرضية كريمية، تنتشر عليها أغصان وزهور بالعنابي والأزرق الرمادي والذهبي، ويحيط بها إطار متدرج بالذهبي والأزرق والكحلي بزوايا مقطوعة. الحفر يدوي. تُفصّل بالمقاس والشكل الذي تريده. السعر حسب المقاس وحجم النقشة، ونؤكده عبر واتساب.
  usage: تناسب الصالات العربية بالكنب الكحلي والبيج، والعنابي يتناسق مع المخدات.
  care: نظّفه بالمكنسة الكهربائية بانتظام في اتجاه الوبر، وامسح البقع فور وقوعها دون فرك حتى تبقى حواف الحفر واضحة.
  seoTitle: زولية صالة محفورة بزهور عنابية وإطار كحلي في الكويت — سجادكو
  seoDescription: زولية صالة محفورة بزهور عنابية وإطار كحلي، حفر يدوي في ورشتنا بالنقشة والألوان التي تختارها، للصالات والمجالس والديوانيات في الكويت. السعر حسب المقاس.
  reviewed: true
  faq:
    - q: كم سعره؟
      a: السعر حسب المقاس وحجم النقشة وعدد ألوانها. أرسل صورة النقشة والمقاس عبر واتساب ونرسل لك السعر قبل البدء.
    - q: هل أستطيع تغيير النقشة أو الألوان؟
      a: نعم، ننفذ النقشة نفسها بألوانك، أو نحفر نقشة ترسلها أنت، ونؤكد معك الرسم والألوان قبل البدء.
    - q: هل الزيارة والقياس مجانًا؟
      a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Carved Living Room Rug with Burgundy Flowers and a Navy Border
  directAnswer: A large custom rug with a cream field scattered with stems and flowers in burgundy, blue-grey and gold, inside a stepped gold, blue and navy border with cut corners. Hand-carved. Made to the size and shape you want. Priced by size and design; we confirm on WhatsApp.
  usage: Suits Arabic-style living rooms with navy and beige sofas; burgundy picks up the cushions.
  care: Vacuum regularly along the pile and blot spills straight away without rubbing so the carved edges stay crisp.
  seoTitle: Carved Living Room Rug with Burgundy Flowers and a Navy Border in Kuwa
  seoDescription: 'Carved Living Room Rug with Burgundy Flowers and a Navy Border, hand-carved in our workshop in your design and colours for living rooms, majlis and diwaniya in '
  reviewed: true
  faq:
    - q: How much is it?
      a: Priced by size, design size and number of colours. Send the design and size on WhatsApp for a price before we start.
    - q: Can I change the design or colours?
      a: Yes. We make this design in your colours or carve a design you send, and confirm the drawing and colours before starting.
    - q: Is the home visit and measuring free?
      a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
