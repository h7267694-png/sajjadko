ar:
  name: موكيت مجلس بيج بزخرفة سوداء محفورة في الورشة
  directAnswer: موكيت بيج مخملي في ورشتنا قبل التركيب، تتوسطه زخرفة بخطوط سوداء متداخلة داخل إطار بني مزخرف، محفورة يدويًا. تُظهر الصورة الحفر في الورشة وعينات الموكيت التي نحضرها للعميل. نركّبه من الجدار للجدار ونقصه على مقاس المكان. السعر حسب المقاس وحجم النقشة، ونؤكده عبر واتساب.
  usage: يُحفر الموكيت كاملًا في الورشة ثم يُركّب في المجلس قطعة واحدة، فتبقى النقشة متصلة دون فواصل.
  care: نظّفه بالمكنسة الكهربائية بانتظام في اتجاه الوبر، وامسح البقع فور وقوعها دون فرك حتى تبقى حواف الحفر واضحة.
  seoTitle: موكيت مجلس بيج بزخرفة سوداء محفورة في الورشة في الكويت — سجادكو
  seoDescription: موكيت مجلس بيج بزخرفة سوداء محفورة في الورشة، حفر يدوي في ورشتنا بالنقشة والألوان التي تختارها، للصالات والمجالس والديوانيات في الكويت. السعر حسب المقاس.
  reviewed: true
  faq:
    - q: كم سعره؟
      a: السعر حسب مساحة المكان وحجم النقشة وعدد ألوانها. أرسل صورة النقشة والمقاس عبر واتساب ونرسل لك السعر قبل البدء.
    - q: هل أستطيع تغيير النقشة أو الألوان؟
      a: نعم، ننفذ النقشة نفسها بألوانك، أو نحفر نقشة ترسلها أنت، ونؤكد معك الرسم والألوان قبل البدء.
    - q: هل الزيارة والقياس مجانًا؟
      a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Beige Majlis Carpet with a Black Carved Medallion
  directAnswer: Beige plush carpet in our workshop before fitting, with interlaced black lines inside a decorated brown frame, hand-carved. The photo shows the work in the workshop next to the carpet samples we bring to customers. We fit it wall to wall, cut to your room. Priced by size and design; we confirm on WhatsApp.
  usage: The carpet is carved whole in the workshop and fitted in one piece, so the design has no seams.
  care: Vacuum regularly along the pile and blot spills straight away without rubbing so the carved edges stay crisp.
  seoTitle: Beige Majlis Carpet with a Black Carved Medallion in Kuwait | Sajjadko
  seoDescription: Beige Majlis Carpet with a Black Carved Medallion, hand-carved in our workshop in your design and colours for living rooms, majlis and diwaniya in Kuwait.
  reviewed: true
  faq:
    - q: How much is it?
      a: Priced by area, design size and number of colours. Send the design and size on WhatsApp for a price before we start.
    - q: Can I change the design or colours?
      a: Yes. We make this design in your colours or carve a design you send, and confirm the drawing and colours before starting.
    - q: Is the home visit and measuring free?
      a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
