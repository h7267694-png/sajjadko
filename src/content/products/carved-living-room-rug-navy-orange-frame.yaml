ar:
  name: زولية صالة تفصيل بإطار محفور كحلي وبرتقالي
  directAnswer: زولية تفصيل كريمية بشكل غير مستطيل، يحدّها خط كحلي متعرج، وفي داخلها إطار من شرائط برتقالية وبيج محفورة يدويًا مع زخارف عند الوسط والأطراف. تُفصّل بالمقاس والشكل الذي تريده. السعر حسب المقاس وحجم النقشة، ونؤكده عبر واتساب.
  usage: الكحلي والبرتقالي يتناسقان مع المخدات الملونة، وشكلها المفصّل يتبع توزيع الكنب في الصالة.
  care: نظّفه بالمكنسة الكهربائية بانتظام في اتجاه الوبر، وامسح البقع فور وقوعها دون فرك حتى تبقى حواف الحفر واضحة.
  seoTitle: زولية صالة بإطار محفور كحلي وبرتقالي | حفر يدوي بالكويت — سجادكو
  seoDescription: زولية صالة كريمية بإطار محفور كحلي وبرتقالي وشكل مفصّل، سجاد حفر يدوي وتفصيل سجاد بالمقاس والنقش الذي تختاره للصالات والمجالس في الكويت. السعر حسب المقاس.
  reviewed: true
  faq:
    - q: كم سعره؟
      a: السعر حسب المقاس وحجم النقشة وعدد ألوانها. أرسل صورة النقشة والمقاس عبر واتساب ونرسل لك السعر قبل البدء.
    - q: هل أستطيع تغيير النقشة أو الألوان؟
      a: نعم، ننفذ النقشة نفسها بألوانك، أو نحفر نقشة ترسلها أنت، ونؤكد معك الرسم والألوان قبل البدء.
    - q: هل الزيارة والقياس مجانًا؟
      a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Shaped Living Room Rug with a Carved Navy and Orange Frame
  directAnswer: A custom cream rug with a non-rectangular shape, edged by a curving navy line, with an inner frame of orange and beige bands hand-carved with motifs at the centre and ends. Made to the size and shape you want. Priced by size and design; we confirm on WhatsApp.
  usage: The navy and orange pick up coloured cushions, and the custom shape follows the layout of the sofas.
  care: Vacuum regularly along the pile and blot spills straight away without rubbing so the carved edges stay crisp.
  seoTitle: Shaped Carved Living Room Rug, Navy and Orange, Kuwait | Sajjadko
  seoDescription: Hand-carved living room rug with a shaped navy and orange frame, made in our workshop to your size, shape and colours for living rooms and majlis in Kuwait.
  reviewed: true
  faq:
    - q: How much is it?
      a: Priced by size, design size and number of colours. Send the design and size on WhatsApp for a price before we start.
    - q: Can I change the design or colours?
      a: Yes. We make this design in your colours or carve a design you send, and confirm the drawing and colours before starting.
    - q: Is the home visit and measuring free?
      a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
