ar:
  name: زولية صالة محفورة بأغصان كحلية وبرونزية
  directAnswer: زولية تفصيل كبيرة بأرضية كريمية تمتد عليها أغصان عريضة بالكحلي والبرونزي، محفورة يدويًا بارتفاعين للوبر. تصميم حديث بخطوط كبيرة يغطي الصالة. تُفصّل بالمقاس والشكل الذي تريده. السعر حسب المقاس وحجم النقشة، ونؤكده عبر واتساب.
  usage: الخطوط الكبيرة تناسب الصالات الحديثة، والكحلي يتناسق مع الكراسي الداكنة والبيج مع الكنب.
  care: نظّفه بالمكنسة الكهربائية بانتظام في اتجاه الوبر، وامسح البقع فور وقوعها دون فرك حتى تبقى حواف الحفر واضحة.
  seoTitle: زولية صالة محفورة بأغصان كحلية وبرونزية في الكويت — سجادكو
  seoDescription: زولية صالة محفورة بأغصان كحلية وبرونزية، حفر يدوي في ورشتنا بالنقشة والألوان التي تختارها، للصالات والمجالس والديوانيات في الكويت. السعر حسب المقاس.
  reviewed: true
  faq:
    - q: كم سعره؟
      a: السعر حسب المقاس وحجم النقشة وعدد ألوانها. أرسل صورة النقشة والمقاس عبر واتساب ونرسل لك السعر قبل البدء.
    - q: هل أستطيع تغيير النقشة أو الألوان؟
      a: نعم، ننفذ النقشة نفسها بألوانك، أو نحفر نقشة ترسلها أنت، ونؤكد معك الرسم والألوان قبل البدء.
    - q: هل الزيارة والقياس مجانًا؟
      a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Carved Living Room Rug with Navy and Bronze Scrolls
  directAnswer: A large custom rug with a cream field crossed by wide navy and bronze scrolls, hand-carved at two pile heights. A modern design with bold lines covering the living room. Made to the size and shape you want. Priced by size and design; we confirm on WhatsApp.
  usage: Bold lines suit modern living rooms; navy matches dark chairs and beige matches the sofas.
  care: Vacuum regularly along the pile and blot spills straight away without rubbing so the carved edges stay crisp.
  seoTitle: Carved Living Room Rug with Navy and Bronze Scrolls | Sajjadko Kuwait
  seoDescription: Carved Living Room Rug with Navy and Bronze Scrolls, hand-carved in our workshop in your design and colours for living rooms, majlis and diwaniya in Kuwait.
  reviewed: true
  faq:
    - q: How much is it?
      a: Priced by size, design size and number of colours. Send the design and size on WhatsApp for a price before we start.
    - q: Can I change the design or colours?
      a: Yes. We make this design in your colours or carve a design you send, and confirm the drawing and colours before starting.
    - q: Is the home visit and measuring free?
      a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
