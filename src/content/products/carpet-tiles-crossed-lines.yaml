ar:
  name: بلاط سجاد 40×40 بنقش خطوط هندسية متقاطعة
  directAnswer: بلاط سجاد بمقاس 40×40 سم بنقش خطوط هندسية فاتحة متقاطعة على أرضية سادة، بسبعة ألوان منها الزيتي والبني الرمادي والبيج والفحمي والفضي والعاجي والأبيض. للمكاتب والفنادق والقاعات. يُباع بالمتر المربع من 5 إلى 6 د.ك، والمتر فيه 6.25 بلاطة، والبلاطة التالفة تُبدل وحدها.
  usage: الخطوط المتقاطعة تعطي الأرضية مظهرًا هندسيًا حديثًا يناسب المكاتب المفتوحة والاستقبال. الزيتي والفحمي يبرزان النقش، والعاجي والفضي يعطيان المكان اتساعًا.
  care: نظّفه بالمكنسة الكهربائية بانتظام، وامسح البقع فور وقوعها بقطعة قماش مبللة. البلاطة التالفة تُبدل وحدها.
  seoTitle: بلاط سجاد 40×40 بنقش خطوط متقاطعة للمكاتب — سجادكو
  seoDescription: بلاط سجاد مكاتب 40×40 سم بنقش خطوط هندسية متقاطعة بسبعة ألوان، من 5 إلى 6 د.ك للمتر المربع في الكويت، مع القياس والتركيب.
  reviewed: true
  faq:
    - q: كم سعر بلاط السجاد بنقش الخطوط المتقاطعة؟
      a: من 5 إلى 6 د.ك للمتر المربع، ونؤكد السعر الدقيق عند اختيار الخامة. مكتب 100 م² يحتاج نحو 625 بلاطة، بكلفة بين 500 و600 د.ك قبل التركيب.
    - q: هل يمكن خلط لونين في الأرضية نفسها؟
      a: نعم، البلاط يُركّب بلاطة بلاطة، فيمكن تحديد ممرات أو مناطق بلون مختلف. نخطط التوزيع معك عند القياس.
    - q: هل تركّبونه خارج أوقات الدوام؟
      a: نعم، نتفق معك على موعد التركيب، ويمكن أن يكون خارج أوقات الدوام. أجرة التركيب منفصلة حسب المساحة والموقع.
en:
  name: 40×40 Carpet Tiles with a Crossed Geometric Line Pattern
  directAnswer: These are 40×40 cm carpet tiles with light crossed geometric lines on a plain ground, in seven colours including olive, taupe, beige, charcoal, silver, ivory and white. For offices, hotels and halls. Sold by the m² at 5 to 6 KWD; one m² takes 6.25 tiles, and a damaged tile can be replaced on its own.
  usage: The crossed lines give the floor a modern geometric look suited to open-plan offices and reception. Olive and charcoal bring out the pattern; ivory and silver make the space feel larger.
  care: Vacuum regularly and blot spills straight away with a damp cloth. A damaged tile is replaced on its own.
  seoTitle: 40×40 Crossed Line Carpet Tiles for Offices | Sajjadko Kuwait
  seoDescription: 40×40 cm office carpet tiles with a crossed geometric line pattern in seven colours, 5 to 6 KWD per m² in Kuwait, measured and installed.
  reviewed: true
  faq:
    - q: How much are these carpet tiles?
      a: 5 to 6 KWD per m², confirmed once you choose the material. A 100 m² office needs about 625 tiles, roughly 500 to 600 KWD before installation.
    - q: Can two colours be mixed on one floor?
      a: Yes. Tiles are laid one by one, so walkways or zones can be marked in a different colour. We plan the layout with you when we measure.
