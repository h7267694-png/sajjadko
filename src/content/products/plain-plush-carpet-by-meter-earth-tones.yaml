ar:
  name: موكيت سادة مخملي بالمتر بألوان ترابية ورمادية
  directAnswer: 'موكيت سادة مخملي بوبر مقصوص كثيف ولمعة خفيفة، متوفر في المحل رولات بسبعة ألوان: الأبيض والبني الغامق والبيج الرملي والذهبي الزيتي والرمادي المزرق والرمادي الوردي والبني الرمادي. يُباع بالمتر المربع ويُقص على مقاس الغرفة، من 5 إلى 15 د.ك للمتر المربع حسب السماكة والضغط والكثافة.'
  usage: الموكيت السادة يناسب غرف النوم والصالات والمجالس حين يكون الأثاث والستائر هما محور الغرفة. الألوان الترابية والرمادية تتناسق مع الخشب والجدران الفاتحة، والوبر المخملي يعطي الأرضية ملمسًا ناعمًا ومظهرًا متصلًا من الجدار إلى الجدار.
  care: نظّفه بالمكنسة الكهربائية بانتظام باتجاه الوبر، وامسح البقع فور وقوعها بقطعة قماش مبللة دون فرك. اختلاف لمعة الوبر حسب اتجاه الضوء طبيعي في الموكيت المخملي.
  seoTitle: موكيت سادة مخملي بالمتر في الكويت بألوان ترابية — سجادكو
  seoDescription: موكيت سادة مخملي بالمتر بسبعة ألوان ترابية ورمادية لغرف النوم والصالات والمجالس، يُقص على المقاس من 5 إلى 15 د.ك للمتر المربع في الكويت.
  reviewed: true
  faq:
    - q: كم سعر الموكيت السادة بالمتر؟
      a: من 5 إلى 15 د.ك للمتر المربع حسب السماكة والضغط والكثافة. غرفة 4×5 م (20 م²) تكلف بين 100 و300 د.ك قبل التركيب.
    - q: ما الألوان المتوفرة؟
      a: 'سبعة ألوان في المحل: الأبيض، والبني الغامق، والبيج الرملي، والذهبي الزيتي، والرمادي المزرق، والرمادي الوردي، والبني الرمادي. أرسل اللون عبر واتساب لنؤكد الكمية المتوفرة.'
    - q: لماذا يبدو لون الموكيت المخملي مختلفًا من زاوية لأخرى؟
      a: الوبر المخملي يعكس الضوء حسب اتجاهه، فيبدو أفتح أو أغمق قليلًا من زاوية لأخرى. هذا طبيعي في الموكيت المخملي ويعطيه لمعته.
en:
  name: Plain Plush Carpet by the Metre in Earth and Grey Tones
  directAnswer: 'This is a plain plush carpet with a dense cut pile and a light sheen, stocked in rolls in seven colours: white, dark brown, sand beige, olive gold, blue grey, mauve grey and taupe. Sold by the m² and cut to your room at 5 to 15 KWD per m² (0.465 to 1.394 KWD per sq ft), depending on thickness, pile pressure and density.'
  usage: Plain carpet suits bedrooms, living rooms and majlis rooms where furniture and curtains are the focus. Earth and grey tones work with wood and light walls, and the plush pile gives a soft, continuous floor from wall to wall.
  care: Vacuum regularly in the direction of the pile and blot spills straight away with a damp cloth. Shading that changes with the light is normal in plush carpet.
  seoTitle: Plain Plush Carpet by the Metre in Kuwait | Sajjadko Kuwait
  seoDescription: Plain plush carpet by the metre in seven earth and grey tones for bedrooms, living rooms and majlis, cut to size at 5 to 15 KWD per m² in Kuwait.
  reviewed: true
  faq:
    - q: How much is plain carpet per m²?
      a: 5 to 15 KWD per m² depending on thickness, pile pressure and density. A 20 m² room costs about 100 to 300 KWD before installation.
    - q: Why does plush carpet look different from different angles?
      a: The plush pile reflects light by direction, so it looks slightly lighter or darker from different angles. This shading is normal and gives plush carpet its sheen.
