ar:
  name: موكيت مخملي رمادي فضي مع نهاية معدنية
  directAnswer: موكيت مخملي كثيف بوبر مقصوص ناعم، بلون رمادي فضي يتناسق مع الجدران البيضاء والرمادية والخشب الداكن. يُفرش من الجدار إلى الجدار في غرف النوم والصالات والمجالس، ويُنهى عند الرخام والبلاط بنهاية سجاد معدنية فضية تحمي الحافة. يُباع بالمتر المربع من 5 إلى 15 د.ك حسب السماكة والضغط والكثافة.
  usage: ركّبناه في فيلا بمنطقة القصر في الجهراء، في غرف النوم والصالة، مع ستائر رمادية وبيضاء وجدار خزائن رمادي وفاصل خشبي. الرمادي الفضي لون فاتح يخفي الغبار أكثر من الأبيض، ويتناسق مع الأثاث الحديث. النهاية المعدنية الفضية عند المداخل تمنع تنسيل الحافة وتحميها من التآكل مع كثرة المشي.
  care: نظّفه بالمكنسة الكهربائية مرة أو مرتين أسبوعيًا، وامسح البقع فور وقوعها بقطعة قماش مبللة دون فرك. إذا ظهرت آثار الأقدام على الوبر الناعم، فمرّر المكنسة باتجاه واحد ليعود الوبر متساويًا.
  seoTitle: موكيت مخملي رمادي فضي مع نهاية معدنية في الكويت — سجادكو
  seoDescription: موكيت مخملي رمادي فضي لغرف النوم والصالات، يُركّب من الجدار إلى الجدار مع نهاية سجاد معدنية فضية. من 5 إلى 15 د.ك للمتر المربع.
  reviewed: true
  faq:
    - q: كم سعر الموكيت المخملي الرمادي بالمتر؟
      a: يُباع بالمتر المربع من 5 إلى 15 د.ك حسب السماكة والضغط والكثافة. غرفة 4×5 م (20 م²) تكلف بين 100 و300 د.ك تقريبًا قبل التركيب. أجرة التركيب منفصلة وتُتفق حسب المساحة والموقع.
    - q: ما فائدة نهاية السجاد المعدنية الفضية؟
      a: النهاية المعدنية تُثبت حافة الموكيت عند الانتقال إلى الرخام أو البلاط، فتمنع تنسيل الخيوط وارتفاع الحافة، وتعطي خطًا فاصلًا نظيفًا بلون فضي يتناسق مع الموكيت الرمادي.
    - q: هل يناسب الموكيت الرمادي غرف النوم؟
      a: نعم، الرمادي الفضي لون محايد يناسب غرف النوم والصالات، ويخفي الغبار وآثار الاستعمال أكثر من الألوان الفاتحة جدًا، ويتناسق مع الجدران البيضاء والرمادية والأثاث الخشبي.
    - q: هل تركّبون في الجهراء ومناطقها؟
      a: نعم، نركّب في كل مناطق الكويت ومنها الجهراء والقصر. مندوبنا يزورك مجانًا لأخذ المقاسات وعرض العينات، ثم نقص ونركّب ونتابع معك يومين بعد التركيب.
    - q: هل يتوفر بألوان أخرى؟
      a: هذا العمل بلون رمادي فضي. لدينا موكيت مخملي بألوان أخرى من البيج إلى الفحمي، فاطلب العينات عبر واتساب أو في الزيارة المجانية.
en:
  name: Silver Grey Plush Carpet with Metal Edge Trim
  directAnswer: This is a dense cut-pile plush carpet in silver grey that suits white and grey walls and dark wood. It is fitted wall to wall in bedrooms, living rooms and majlis rooms, and finished at marble and tiles with a silver metal carpet edge trim that protects the edge. Sold per m² at 5 to 15 KWD (0.465 to 1.394 KWD per sq ft), depending on thickness, pile pressure and density.
  usage: We fitted it in a villa in Qasr, Jahra, across the bedrooms and living room, alongside grey and white curtains, a grey wardrobe wall and a wooden slat divider. Silver grey is a light shade that hides dust better than white and suits modern furniture. The silver metal trim at each doorway stops the edge fraying and protects it from foot traffic.
  care: Vacuum once or twice a week, and blot spills straight away with a damp cloth without rubbing. If footprints show on the soft pile, vacuum in one direction to even it out.
  seoTitle: Silver Grey Plush Carpet with Metal Edge Trim in Kuwait | Sajjadko
  seoDescription: Silver grey plush carpet for bedrooms and living rooms, fitted wall to wall with a silver metal edge trim. 5 to 15 KWD per m² in Kuwait.
  reviewed: true
  faq:
    - q: How much is the grey plush carpet per m²?
      a: It is sold by the m² at 5 to 15 KWD (0.465 to 1.394 KWD per sq ft), depending on thickness, pile pressure and density. A 4 × 5 m (20 m², 215 sq ft) room costs about 100 to 300 KWD before installation, which is priced separately.
    - q: What does the silver metal edge trim do?
      a: The metal trim holds the carpet edge where it meets marble or tiles, so the yarn does not fray and the edge does not lift, and it gives a clean silver dividing line that matches the grey carpet.
    - q: Is grey carpet a good choice for bedrooms?
      a: Yes. Silver grey is a neutral colour for bedrooms and living rooms, hides dust and wear better than very light shades, and suits white and grey walls and wood furniture.
    - q: Do you install in Jahra?
      a: Yes, we install across Kuwait, including Jahra and Qasr. Our representative visits for free to measure and show samples, then we cut, install and follow up for two days.
    - q: Is it available in other colours?
      a: This job used silver grey. We have plush carpet in other shades from beige to charcoal; ask for samples on WhatsApp or at the free visit.
