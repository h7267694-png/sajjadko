ar:
  name: موكيت تركي بملمس حريري
  directAnswer: موكيت تركي بوبر ناعم لامع يعكس الضوء وملمس حريري، بثمانية ألوان بين العاجي واللؤلؤي والبني الشوكولاتة والأسود الفحمي. يناسب الصالات وغرف النوم والمجالس. يُباع بالمتر المربع ويُقص على مقاس المكان، والسعر من 5 إلى 15 د.ك للمتر المربع حسب السماكة والضغط والكثافة.
  usage: تتغير درجة لمعته مع اتجاه الضوء. الألوان الفاتحة (العاجي واللؤلؤي) للغرف المضيئة، والداكنة (الشوكولاتة والفحمي) تُظهر الأثاث الفاتح بوضوح.
  care: نظّفه بالمكنسة الكهربائية بانتظام، وعالج البقع فور وقوعها بقطعة قماش مبللة دون فرك.
  seoTitle: موكيت تركي بملمس حريري بالمتر في الكويت — سجادكو الكويت
  seoDescription: موكيت تركي لامع بملمس حريري وثمانية ألوان للصالات والمجالس وغرف النوم، يُقص على المقاس من 5 إلى 15 د.ك للمتر المربع.
  reviewed: false
  faq:
    - q: كم سعر الموكيت التركي بملمس حريري بالمتر؟
      a: يُباع بالمتر المربع، والسعر من 5 إلى 15 د.ك للمتر المربع حسب السماكة والضغط والكثافة. اضرب مساحة المكان في سعر المتر لتعرف الكلفة التقريبية، وأجرة التركيب منفصلة وتُتفق حسب المساحة والموقع. نؤكد لك السعر النهائي عبر واتساب.
    - q: هل يُقص على مقاس غرفتي؟
      a: نعم، يُقص على مقاس المكان بالمتر، فلا تحتاج مقاسًا جاهزًا. أرسل الطول والعرض عبر واتساب، ونراجع معك المقاس قبل القص لأن القص لا يُعاد، ونقيس في الموقع عند الحاجة.
    - q: كم لونًا متوفرًا وكيف أختار؟
      a: تتوفر 8 ألوان بأرقام واضحة في جدول الألوان بالصفحة. أرسل رقم اللون الذي يعجبك عبر واتساب لنؤكد توفره، واختر الفاتح للغرف الصغيرة والداكن للأماكن كثيرة الحركة.
    - q: هل تركّبونه؟
      a: نعم، نركّب ما نوفره من سجاد وموكيت، وأجرة التركيب منفصلة عن سعر المتر وتُتفق حسب المساحة والموقع. بعد التركيب نتابع معك يومين لمعالجة أي خطأ في التركيب.
    - q: هل الزيارة والقياس مجانًا؟
      a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Turkish Silk-Touch Carpet
  directAnswer: This is a Turkish wall-to-wall carpet with a soft, lustrous pile that reflects light and has a silky feel, in eight shades from ivory and pearl to chocolate brown and charcoal black. It suits living rooms, bedrooms and majlis rooms. Sold per m² and cut to your room size, from 5 to 15 KWD per m² (0.465 to 1.394 KWD per sq ft) depending on thickness, pile pressure and density.
  usage: Its sheen varies with the direction of the light. Light shades (ivory, pearl) suit bright rooms, while dark shades (chocolate, charcoal) contrast with light furniture.
  care: Vacuum regularly, and blot spills straight away with a damp cloth without rubbing.
  seoTitle: Turkish Silk-Touch Carpet by the m² in Kuwait | Sajjadko Kuwait
  seoDescription: Turkish wall-to-wall carpet with a lustrous pile and a silky feel in eight shades for living rooms, majlis rooms and bedrooms, from 5 to 15 KWD per m².
  reviewed: true
  faq:
    - q: How much is the Turkish silk-touch carpet per m²?
      a: It is sold by the m², from 5 to 15 KWD per m² (0.465 to 1.394 KWD per sq ft), depending on thickness, pile pressure and density. Multiply your floor area by the price per m² for an estimate. Installation is separate and agreed by area and location.
    - q: Can it be cut to my room size?
      a: Yes. It is cut to your room in metres, so you are not limited to stock sizes. Send the length and width on WhatsApp, in metres or feet, and we check the measurements with you before cutting, since a cut cannot be undone.
    - q: How many colours are there, and how do I choose?
      a: There are 8 colours, each with a code in the colour table on this page. Send the code you like on WhatsApp and we confirm it is in stock. Light shades suit small rooms, and darker shades suit busy areas.
    - q: Do you install it?
      a: Yes, we install the carpet we supply. Installation is priced separately from the per-m² price and agreed by area and location. After installation we follow up for two days to fix any installation error.
    - q: Is the home visit and measuring free?
      a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
