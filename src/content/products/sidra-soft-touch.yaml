ar:
  name: موكيت تركي ناعم بألوان محايدة
  directAnswer: موكيت تركي بوبر مقصوص قصير متراص ولمعة خفيفة، بثمانية ألوان محايدة بين العاجي والجملي والرمادي الفحمي. يناسب الصالات وغرف النوم والمجالس والغرف الفندقية. يُباع بالمتر الطولي ويُقص على مقاس المكان، والسعر من 5 إلى 15 د.ك للمتر الطولي من رول عرضه 4 م حسب السماكة والضغط والكثافة.
  usage: سطحه المتراص مستوٍ ومنتظم، فيناسب المجالس والصالات الواسعة التي تُفرش من الجدار إلى الجدار. العاجي والبيج يجعلان الغرفة تبدو أوسع، والرمادي الفضي والفحمي يتناسقان مع الأثاث الحديث.
  care: نظّفه بالمكنسة الكهربائية بانتظام، وعالج البقع فور وقوعها بقطعة قماش مبللة دون فرك.
  seoTitle: موكيت تركي ناعم بألوان محايدة في الكويت — سجادكو الكويت
  seoDescription: موكيت تركي ناعم بثمانية ألوان محايدة للصالات والمجالس وغرف النوم، يُقص ويُركّب على المقاس من 5 إلى 15 د.ك للمتر الطولي من رول عرضه 4 م.
  reviewed: false
  faq:
    - q: كم سعر الموكيت التركي الناعم بالمتر؟
      a: يُباع بالمتر الطولي، والسعر من 5 إلى 15 د.ك للمتر الطولي من رول عرضه 4 م حسب السماكة والضغط والكثافة. إذا كان أحد ضلعي الغرفة 4 م أو أقل فعدد الأمتار هو الضلع الآخر، فغرفة 3×4 م تحتاج 3 أمتار، وأجرة التركيب منفصلة وتُتفق حسب المساحة والموقع. نؤكد لك السعر النهائي عبر واتساب.
    - q: هل يُقص على مقاس غرفتي؟
      a: نعم، يُقص على مقاس المكان بالمتر، فلا تحتاج مقاسًا جاهزًا. أرسل الطول والعرض عبر واتساب، ونراجع معك المقاس قبل القص لأن القص لا يُعاد، ونقيس في الموقع عند الحاجة.
    - q: كم لونًا متوفرًا وكيف أختار؟
      a: تتوفر 8 ألوان بأرقام واضحة في جدول الألوان بالصفحة. أرسل رقم اللون الذي يعجبك عبر واتساب لنؤكد توفره، واختر الفاتح للغرف الصغيرة والداكن للأماكن كثيرة الحركة.
    - q: هل تركّبونه؟
      a: نعم، نركّب ما نوفره من سجاد وموكيت، وأجرة التركيب منفصلة عن سعر المتر وتُتفق حسب المساحة والموقع. بعد التركيب نتابع معك يومين لمعالجة أي خطأ في التركيب.
    - q: هل الزيارة والقياس مجانًا؟
      a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Turkish Soft-Touch Carpet in Neutral Colours
  directAnswer: This is a Turkish wall-to-wall carpet with a short, tightly packed cut pile and a light sheen, in eight neutral shades from ivory and camel to charcoal grey. It suits living rooms, bedrooms, majlis rooms and hotel rooms. Sold by the running metre and cut to your room size, from 5 to 15 KWD per running metre of a 4 m wide roll depending on thickness, pile pressure and density.
  usage: Its tight, even surface suits large living rooms and majlis rooms carpeted wall to wall. Ivory and beige make a room appear larger, while silver and charcoal grey suit modern furniture.
  care: Vacuum regularly, and blot spills straight away with a damp cloth without rubbing.
  seoTitle: Turkish Soft-Touch Carpet by the Metre in Kuwait | Sajjadko Kuwait
  seoDescription: Soft Turkish wall-to-wall carpet in eight neutral shades for living rooms, majlis rooms and bedrooms, cut and fitted from 5 to 15 KWD per running metre.
  reviewed: true
  faq:
    - q: How much is the Turkish soft-touch carpet per metre?
      a: It is sold by the running metre, from 5 to 15 KWD per running metre of a 4 m wide roll, depending on thickness, pile pressure and density. A room with one side of 4 m or less needs running metres equal to its other side, so a 3 × 4 m room needs 3 metres. Installation is separate and agreed by area and location.
    - q: Can it be cut to my room size?
      a: Yes. It is cut to your room in metres, so you are not limited to stock sizes. Send the length and width on WhatsApp, in metres or feet, and we check the measurements with you before cutting, since a cut cannot be undone.
    - q: How many colours are there, and how do I choose?
      a: There are 8 colours, each with a code in the colour table on this page. Send the code you like on WhatsApp and we confirm it is in stock. Light shades suit small rooms, and darker shades suit busy areas.
    - q: Do you install it?
      a: Yes, we install the carpet we supply. Installation is priced separately from the carpet price and agreed by area and location. After installation we follow up for two days to fix any installation error.
    - q: Is the home visit and measuring free?
      a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
