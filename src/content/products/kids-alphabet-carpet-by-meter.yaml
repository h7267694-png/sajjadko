ar:
  name: سجاد أطفال بالمتر بنقش الحروف الإنجليزية بثلاثة ألوان
  directAnswer: 'سجاد أطفال يُباع بالمتر بنقش مربعات تحمل الحروف الإنجليزية، تفصل بينها نقاط ملونة، بثلاث مجموعات ألوان: متعدد الألوان، والوردي مع البيج، والرمادي مع البيج. يُقص على مقاس غرفة الأطفال أو الحضانة أو غرفة اللعب. السعر حسب المساحة، ونؤكده عبر واتساب.'
  usage: يناسب غرف الأطفال والحضانات وغرف اللعب في المدارس، لأنه يغطي المساحة كاملة ويساعد الطفل على التعرف على الحروف أثناء اللعب.
  care: نظّفها بالمكنسة الكهربائية بانتظام، وامسح البقع والسوائل فور وقوعها بقطعة قماش مبللة دون فرك.
  seoTitle: سجاد أطفال بالمتر بنقش الحروف في الكويت — سجادكو
  seoDescription: سجاد أطفال بالمتر بنقش الحروف الإنجليزية بثلاثة ألوان لغرف الأطفال والحضانات وغرف اللعب، يُقص على المقاس في الكويت.
  reviewed: true
  faq:
    - q: كم سعره؟
      a: السعر حسب المقاس. أرسل المقاس الذي تحتاجه عبر واتساب، ونؤكد لك المتوفر والسعر.
    - q: هل يناسب الحضانات وغرف اللعب في المدارس؟
      a: نعم، يُباع بالمتر ويُقص على مقاس القاعة كاملة، ونقش الحروف مناسب لأماكن تعليم الأطفال.
en:
  name: Kids Alphabet Carpet by the Metre in Three Colours
  directAnswer: 'This is kids carpet sold by the metre with squares carrying English letters separated by coloured dots, in three colour sets: multicolour, pink with beige, and grey with beige. It is cut to fit a kids room, nursery or playroom. Priced by area, confirmed on WhatsApp.'
  usage: It suits kids rooms, nurseries and school playrooms, covering the whole floor and helping children learn letters while they play.
  care: Vacuum regularly and blot spills straight away with a damp cloth without rubbing.
