ar:
  name: زولية مدخل محفورة بإطار أزرق وزوايا مقعرة
  directAnswer: زولية تفصيل فاتحة مخملية للمدخل، يحيط بوسطها إطار أزرق محفور يدويًا بزوايا مقعرة، وحوله حافة سادة. تُفصّل على مقاس المدخل أو الممر. السعر حسب المقاس وحجم النقشة، ونؤكده عبر واتساب.
  usage: مقاسها المفصّل يناسب المساحة أمام الباب أو أعلى الدرج، والإطار الأزرق يحدد المكان بهدوء.
  care: نظّفه بالمكنسة الكهربائية بانتظام في اتجاه الوبر، وامسح البقع فور وقوعها دون فرك حتى تبقى حواف الحفر واضحة.
  seoTitle: زولية مدخل محفورة بإطار أزرق وزوايا مقعرة في مبارك الكبير — سجادكو
  seoDescription: زولية مدخل فاتحة بإطار أزرق محفور وزوايا مقعرة، سجاد حفر يدوي وتفصيل سجاد على مقاس المدخل أو الممر في الكويت. السعر حسب المقاس.
  reviewed: true
  faq:
    - q: كم سعره؟
      a: السعر حسب المقاس وحجم النقشة وعدد ألوانها. أرسل صورة النقشة والمقاس عبر واتساب ونرسل لك السعر قبل البدء.
    - q: هل أستطيع تغيير النقشة أو الألوان؟
      a: نعم، ننفذ النقشة نفسها بألوانك، أو نحفر نقشة ترسلها أنت، ونؤكد معك الرسم والألوان قبل البدء.
    - q: هل الزيارة والقياس مجانًا؟
      a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Carved Entrance Rug with a Blue Frame and Concave Corners
  directAnswer: A custom light plush entrance rug with a hand-carved blue frame with concave corners around the centre and a plain outer edge. Made to the size of your entrance or landing. Priced by size and design; we confirm on WhatsApp.
  usage: The custom size fits the space in front of a door or at the top of the stairs, and the blue frame marks it out quietly.
  care: Vacuum regularly along the pile and blot spills straight away without rubbing so the carved edges stay crisp.
  seoTitle: Carved Blue-Frame Entrance Rug in Mubarak Al-Kabeer
  seoDescription: Hand-carved entrance rug with a blue frame and concave corners, made in our workshop to the size of your entrance or landing in Kuwait.
  reviewed: true
  faq:
    - q: How much is it?
      a: Priced by size, design size and number of colours. Send the design and size on WhatsApp for a price before we start.
    - q: Can I change the design or colours?
      a: Yes. We make this design in your colours or carve a design you send, and confirm the drawing and colours before starting.
    - q: Is the home visit and measuring free?
      a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
