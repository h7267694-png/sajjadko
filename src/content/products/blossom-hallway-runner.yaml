  seoTitle: سجاد ممر مورد بالطول في الكويت — سجادكو الكويت
  seoDescription: سجاد ممرات بنقشة أغصان وأزهار بخمسة ألوان، يُقص بطول ممرك في الكويت من 5 إلى 15 د.ك للمتر المربع.
  faq:
    - q: كم سعر سجاد الممر المورد بالمتر؟
      a: 'يُسعّر بالمتر المربع من 5 إلى 15 د.ك حسب السماكة والكثافة. اضرب الطول في العرض لتعرف المساحة: مدة 0.8 × 5 م مساحتها 4 م²، فكلفتها بين 20 و60 د.ك قبل التركيب.'
    - q: هل تقصّونها بطول ممر طويل؟
      a: نعم، نقص المدة على الطول الذي تحتاجه بالضبط، فلا يقيدك مقاس جاهز. أرسل طول الممر وعرضه عبر واتساب، ونراجع المقاس معك قبل القص لأن القص لا يُعاد.
    - q: كيف أقيس الممر؟
      a: قس الطول كاملًا والعرض في أضيق نقطة، واترك من الأرضية على كل جانب ما بين 10 و20 سم. تأكد أن الأبواب التي تُفتح فوق المدة تتسع لسماكتها، ثم أرسل الأرقام عبر واتساب.
    - q: هل تركّبون المدات؟
      a: نعم، نركّب المدات التي نوفرها، وأجرة التركيب منفصلة وتُتفق حسب المساحة والموقع، ونتابع معك يومين بعد التركيب لمعالجة أي خطأ. ولا نركّب سجادًا اشتريته من غيرنا.
