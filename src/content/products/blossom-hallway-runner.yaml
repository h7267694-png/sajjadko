en:
  name: Blossom Branch Hallway Runner, Cut to Any Length
  directAnswer: The Blossom Branch runner is a hallway carpet runner with a soft branch-and-flower pattern on an ivory ground, carved in relief so the design has depth. It comes in five flower colourways, from grey to orange, and is cut to the exact length of your hallway. Sold by the m² and cut to your hallway length, from 5 to 15 KWD per m² (0.465 to 1.394 KWD per sq ft) depending on thickness and density.
  usage: A long runner for bedroom corridors, entrance halls and the side of the bed. The ivory ground makes a narrow hallway feel wider, while the flowers break up the length of a long corridor. Choose grey or black for a calm, modern hall, and mustard or orange to add warmth.
  care: Vacuum regularly in the direction of the pile, and blot spills straight away with a damp cloth without rubbing.
  seoTitle: Blossom Hallway Runner, Any Length, Kuwait | Sajjadko Kuwait
  seoDescription: Ivory carpet runner with a carved blossom pattern in five colourways, cut to any hallway length in Kuwait. 5 to 15 KWD per m².
  faq:
    - q: How much does the Blossom Branch Hallway Runner cost in Kuwait?
      a: 'Runners are priced per m², from 5 to 15 KWD (0.465 to 1.394 KWD per sq ft) depending on thickness and density. Multiply length by width for the area: a 0.8 × 5 m (2.6 × 16.4 ft) runner is 4 m², so 20 to 60 KWD before installation.'
    - q: Can you cut a long hallway runner, like 15 ft or 20 ft?
      a: Yes. We cut the runner to the exact length you need, so you are not limited to stock sizes. 15 ft is about 4.6 m and 20 ft about 6.1 m. Send your hallway length and width on WhatsApp, in metres or feet, and we confirm before cutting.
    - q: Is this runner suitable for a bedroom or an entrance?
      a: Yes. It works well beside the bed and in long entrance halls, as well as in corridors. The ivory ground keeps a small space bright. We cut it to the length you need, so a short bedside runner and a long entrance runner can come from the same design.
    - q: How do I measure my hallway for a runner?
      a: Measure the full length, and the width at the narrowest point. Leave an even strip of floor on each side, usually 10 to 20 cm (4 to 8 in). Check that doors opening over the runner have enough clearance, then send the numbers on WhatsApp.
    - q: Do you install carpet runners?
      a: Yes, we install the runners we supply. Installation is priced separately and agreed by area and location, and we follow up for two days after installation to fix any installation error. We do not install carpet bought elsewhere.
  reviewed: true
