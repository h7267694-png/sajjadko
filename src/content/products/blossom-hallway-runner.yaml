en:
  name: Floral Hallway Runner
  directAnswer: This is a hallway carpet runner with a branch-and-flower pattern on an ivory ground, carved in relief. It comes in five flower colourways, from grey to orange, and is cut to the exact length of your hallway. Sold by the running metre and cut to your hallway length, from 5 to 15 KWD per running metre depending on thickness and density.
  usage: Suitable for bedroom corridors, entrance halls and the side of the bed. The ivory ground makes a narrow hallway appear wider, and the flowers add a pattern along a long corridor. Grey or black suit a modern hall, and mustard or orange add warmer colour.
  care: Vacuum regularly in the direction of the pile, and blot spills straight away with a damp cloth without rubbing.
  seoTitle: Floral Hallway Runner Cut to Length in Kuwait | Sajjadko Kuwait
  seoDescription: Ivory carpet runner with a carved floral pattern in five colourways, cut to any hallway length in Kuwait. 5 to 15 KWD per running metre.
  faq:
    - q: How much does the Floral Hallway Runner cost in Kuwait?
      a: 'Runners are priced per running metre, from 5 to 15 KWD depending on thickness and density. Multiply the runner length by the price per metre: a 5 m (16.4 ft) runner costs 25 to 75 KWD before installation.'
    - q: Can you cut a long hallway runner, like 15 ft or 20 ft?
      a: Yes. We cut the runner to the exact length you need, so you are not limited to stock sizes. 15 ft is about 4.6 m and 20 ft about 6.1 m. Send your hallway length and width on WhatsApp, in metres or feet, and we confirm before cutting.
    - q: Is this runner suitable for a bedroom or an entrance?
      a: Yes. It works well beside the bed and in long entrance halls, as well as in corridors. The ivory ground keeps a small space bright. We cut it to the length you need, so a short bedside runner and a long entrance runner can come from the same design.
    - q: How do I measure my hallway for a runner?
      a: Measure the full length, and the width at the narrowest point. Leave an even strip of floor on each side, usually 10 to 20 cm (4 to 8 in). Check that doors opening over the runner have enough clearance, then send the numbers on WhatsApp.
    - q: Do you install carpet runners?
      a: Yes, we install the runners we supply. Installation is priced separately and agreed by area and location, and we follow up for two days after installation to fix any installation error. We do not install carpet bought elsewhere.
    - q: Is the home visit and measuring free?
      a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
  reviewed: true
