ar:
  name: موكيت شقة بيج رملي لغرف النوم والصالة
  directAnswer: 'موكيت سادة بوبر قصير بلون بيج رملي ركّبناه من الجدار للجدار في شقة: غرف النوم وصالة الدور العلوي والممرات. اللون البيج المحايد يتناسق مع الجدران البيضاء والأبواب الفاتحة ويُظهر الغرف أوسع. السعر 8 د.ك للمتر الطولي من رول عرضه 4 م.'
  usage: نقص الموكيت على مقاس كل غرفة ونمدّه من الصالة إلى الغرف بقطع متصلة قدر الإمكان حتى لا تظهر فواصل عند الأبواب. يناسب غرف النوم والصالات والممرات في الشقق والبيوت، ويُحسب المتر الطولي من رول عرضه 4 م، فغرفة 4×4 م تحتاج 4 أمتار طولية.
  care: نظّفه بالمكنسة الكهربائية مرة أو مرتين أسبوعيًا، خصوصًا في الصالة والممرات لأنها الأكثر مرورًا، وامسح البقع فور وقوعها دون فرك.
  seoTitle: موكيت غرف نوم وصالات بيج للشقق — 8 د.ك للمتر الطولي
  seoDescription: 'موكيت بيج رملي من الجدار للجدار لغرف النوم والصالة والممرات في الشقق بالكويت. 8 د.ك للمتر الطولي من رول عرضه 4 م، مع زيارة مجانية لأخذ المقاس.'
  reviewed: true
  faq:
    - q: كم سعر موكيت غرف النوم؟
      a: 8 د.ك للمتر الطولي من رول عرضه 4 م. غرفة 4×4 م تحتاج 4 أمتار طولية.
    - q: هل تفرشون الشقة كاملة؟
      a: نعم، نفرش غرف النوم والصالة والممرات بنفس الموكيت، ونحدد الكمية بعد الزيارة المجانية للقياس.
    - q: هل زيارة القياس مجانية؟
      a: نعم، يزورك مندوبنا مجانًا لأخذ المقاس وعرض العينات، ثم نرسل لك السعر على واتساب قبل أي التزام.
en:
  name: Sand Beige Apartment Carpet for Bedrooms and Living Room
  directAnswer: 'Plain short-pile carpet in sand beige that we fitted wall to wall in an apartment: bedrooms, the upper floor hall and hallways. The neutral beige suits white walls and light doors and makes rooms look larger. 8 KWD per running metre of a 4 m wide roll.'
  usage: We cut the carpet to each room and carry it from the hall into the bedrooms in continuous pieces where possible, so no seams show at doorways. A 4 × 4 m room needs 4 running metres from a 4 m wide roll.
  care: Vacuum once or twice a week, especially the hall and hallways, and blot spills straight away without rubbing.
  seoTitle: Beige Bedroom and Living Room Carpet for Apartments | Sajjadko
  seoDescription: Sand beige wall-to-wall carpet for apartment bedrooms, living room and hallways in Kuwait. 8 KWD per running metre of a 4 m wide roll, free home measuring visit.
  reviewed: true
  faq:
    - q: How much is it per metre?
      a: 8 KWD per running metre of a 4 m wide roll. A 4 × 4 m room needs 4 running metres.
    - q: Is the home visit and measuring free?
      a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
