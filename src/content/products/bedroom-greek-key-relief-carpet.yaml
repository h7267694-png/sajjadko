ar:
  name: سجاد غرف نوم بنقش المفتاح اليوناني البارز
  directAnswer: 'سجاد بوبر محفور بمستويين يُظهر نقش المفتاح اليوناني بارزًا على السطح، بستة ألوان: رمادي فاتح وبيج وكحلي وأزرق رمادي وجملي ووردي رمادي. يُقص بالمتر ويُركّب من الجدار للجدار في غرف النوم والصالات، أو يُقص ويُحبك بمقاس زولية. السعر من 5 إلى 15 د.ك للمتر المربع حسب السماكة والكثافة، والصور الأولى من تركيب نفّذناه في فيلا مع نهاية ذهبية معدنية.'
  usage: النقش البارز يعطي الأرضية ملمسًا وعمقًا دون ألوان كثيرة، فيناسب غرف النوم الكبيرة والماستر والصالات. الدرجات الفاتحة (الرمادي والبيج والجملي) توسّع الغرفة بصريًا، والكحلي والأزرق الرمادي يناسبان غرف الأولاد والمجالس. عند التركيب من الجدار للجدار نركّب نهاية معدنية عند الأبواب وحدود البلاط.
  care: نظّفه بالمكنسة الكهربائية مرة أو مرتين أسبوعيًا، وامسح البقع والسوائل فور وقوعها بقطعة قماش مبللة دون فرك.
  seoTitle: سجاد غرف نوم بنقش المفتاح اليوناني في الكويت — سجادكو
  seoDescription: سجاد غرف نوم بنقش المفتاح اليوناني البارز بستة ألوان، يُقص بالمتر ويُركّب من الجدار للجدار أو بمقاس زولية. من 5 إلى 15 د.ك للمتر.
  reviewed: true
  faq:
  - q: هل يُركّب من الجدار للجدار أم يُباع زولية؟
    a: الاثنان. نقصه بالمتر ونركّبه من الجدار للجدار، أو نقصه ونحبك أطرافه بالمقاس الذي تريده كزولية.
  - q: كم سعر المتر؟
    a: من 5 إلى 15 د.ك للمتر المربع حسب السماكة والكثافة. أرسل مقاس الغرفة واللون عبر واتساب ونرسل لك السعر.
  - q: ما النهاية الذهبية في الصور؟
    a: نهاية معدنية تُركّب عند حافة السجاد على الأبواب وحدود البلاط، تحمي الطرف من التقشر وتعطي حدًا مرتبًا.
  - q: هل الزيارة والقياس مجانًا؟
    a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Greek Key Relief Bedroom Carpet
  directAnswer: 'A carved two-level pile carpet with a raised Greek key pattern, in six colours: light grey, beige, navy, slate blue, camel and dusty pink. It is cut by the metre and fitted wall to wall in bedrooms and living rooms, or cut and bound to a rug size. Price is 5 to 15 KWD per m² depending on thickness and density. The first photos are from a villa we fitted with a gold metal edge trim.'
  usage: The raised pattern gives the floor texture without busy colour, so it suits large and master bedrooms and living rooms. Light grey, beige and camel make a room feel larger; navy and slate blue suit boys rooms and majlis. For wall-to-wall fitting we add metal edge trims at doorways and tile edges.
  care: Vacuum once or twice a week and blot spills straight away with a damp cloth without rubbing.
  seoTitle: Greek Key Relief Bedroom Carpet in Kuwait | Sajjadko
  seoDescription: Greek key relief carpet in six colours, cut by the metre and fitted wall to wall or bound as a rug. 5 to 15 KWD per m².
  reviewed: true
  faq:
  - q: How much is it?
    a: 5 to 15 KWD per m² depending on thickness and density. Send your size on WhatsApp for an exact price.
  - q: Is it fitted wall to wall or sold as a rug?
    a: Both. We cut it by the metre and fit it wall to wall, or cut and bind it to the size you want.
  - q: Is the home visit and measuring free?
    a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
