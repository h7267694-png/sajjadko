ar:
  name: بلاط سجاد 40×40 رمادي مخطط مع بلاطات عنابية
  directAnswer: بلاط سجاد 40×40 سم بوبر حلقي مخطط بدرجتين من الرمادي، تتوزع بينه بلاطات عنابية. ركّبناه في مكتبة وممرات مبنى تعليمي بمنطقة حولي، مع تبديل اتجاه الخطوط بين البلاطات فتظهر الأرضية كمربعات. يُباع بالمتر المربع من 5 إلى 6 د.ك.
  usage: 'يناسب المكتبات والمدارس والجامعات والمكاتب الكبيرة: يخفف صوت الخطوات والكراسي، والبلاطات العنابية تحدد الممرات ومناطق القراءة وتتناسق مع ألوان الأثاث.'
  care: نظّفه بالمكنسة الكهربائية بانتظام، وامسح البقع فور وقوعها بقطعة قماش مبللة. البلاطة التي يتعذر تنظيفها تُرفع وتُبدل بأخرى من الطلبية نفسها.
  seoTitle: بلاط سجاد مكتبات ومدارس 40×40 في حولي — سجادكو
  seoDescription: بلاط سجاد 40×40 رمادي مخطط مع بلاطات عنابية ركّبناه لمكتبة وممرات في حولي. من 5 إلى 6 د.ك للمتر مع القياس والتركيب.
  reviewed: true
  faq:
    - q: هل يناسب بلاط السجاد المدارس والمكتبات؟
      a: نعم، يخفف الصوت ويتحمل كثرة الحركة وعجلات الكراسي، والبلاطة التالفة تُبدل وحدها دون رفع الأرضية كلها.
    - q: كم سعر بلاط السجاد بالمتر؟
      a: من 5 إلى 6 د.ك للمتر المربع، والمتر فيه 6.25 بلاطة. مكتب 50 م² يحتاج نحو 313 بلاطة بكلفة بين 250 و300 د.ك قبل التركيب.
    - q: هل يمكن تبديل بلاطة واحدة؟
      a: نعم، البلاطة التالفة تُرفع وتوضع مكانها بلاطة جديدة دون المساس بالباقي، لذلك ننصح بالاحتفاظ ببضع بلاطات احتياطية.
    - q: هل الزيارة والقياس مجانًا؟
      a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Grey Striped 40×40 Carpet Tiles with Burgundy Accents
  directAnswer: 40×40 cm loop-pile carpet tiles striped in two greys with burgundy tiles mixed in. We fitted them in the library and corridors of an educational building in Hawalli, alternating the stripe direction so the floor reads as a grid. 5 to 6 KWD per m².
  usage: 'Suits libraries, schools, universities and large offices: it quietens footsteps and chairs, and the burgundy tiles mark aisles and reading areas.'
  care: Vacuum regularly and blot spills straight away with a damp cloth. A tile that will not come clean is lifted and replaced with one from the same batch.
  seoTitle: Library and School Carpet Tiles in Hawalli, Kuwait | Sajjadko
  seoDescription: Grey striped 40×40 carpet tiles with burgundy accents fitted in a library in Hawalli. 5 to 6 KWD per m².
  reviewed: true
  faq:
    - q: How much are carpet tiles per m²?
      a: 5 to 6 KWD per m², with 6.25 tiles per m². A 50 m² office needs about 313 tiles, 250 to 300 KWD before fitting.
    - q: Is the home visit and measuring free?
      a: Yes. We visit free of charge to measure and show samples, then send the price on WhatsApp.
