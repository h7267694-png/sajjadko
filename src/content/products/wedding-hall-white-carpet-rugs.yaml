ar:
  name: فرش قاعة استقبال بممر أبيض وزوالي
  directAnswer: 'فرش قاعة استقبال كاملة: ممر بموكيت أبيض تمتد عليه زوالي بيج وزرقاء متتالية حتى المنصة، وأرضية منقوشة على جانبي القاعة حيث الجلسات. يناسب الأعراس والملكة واستقبال الضيوف في القاعات. السعر حسب المساحة ونوع الفرش، ونؤكده عبر واتساب.'
  usage: الممر الأبيض بالزوالي يقود الضيوف إلى المنصة ويفصله عن مناطق الجلوس، فيرتب حركة الضيوف في القاعات الكبيرة.
  care: في التأجير نفك الفرش ونأخذه بعد المناسبة. وفي الشراء نظّفه بالمكنسة الكهربائية وخزّنه ملفوفًا في مكان جاف.
  seoTitle: فرش قاعات أعراس واستقبال في الكويت — سجادكو
  seoDescription: فرش قاعات الأعراس والاستقبال بممر موكيت أبيض وزوالي حتى المنصة، تأجير وبيع في الكويت.
  reviewed: true
  faq:
    - q: هل تجهزون القاعة كاملة؟
      a: نعم، نفرش الممر والزوالي وأرضيات الجلسات حسب مخطط القاعة، ونرفعها بعد المناسبة في حال التأجير.
    - q: هل تزورون المكان قبل المناسبة؟
      a: نعم، نزور المكان مجانًا للقياس عند الحاجة، أو نقدّر المساحة من الصور والمقاسات التي ترسلها عبر واتساب.
en:
  name: Reception Hall Flooring with a White Aisle and Rugs
  directAnswer: 'A full reception hall fit-out: a white carpet aisle with a line of beige and blue rugs leading to the stage, and patterned carpet on both sides for seating. Suits weddings and receptions. Priced by area and flooring type, confirmed on WhatsApp.'
  usage: The white aisle with rugs leads guests to the stage and separates it from the seating areas.
  care: For rentals we lift and take the carpet away after the event. If you buy, vacuum it and store it rolled in a dry place.
  seoTitle: Wedding and Reception Hall Carpet in Kuwait | Sajjadko
  seoDescription: Wedding and reception hall flooring with a white carpet aisle and rugs to the stage. Rental and sale in Kuwait.
  reviewed: true
  faq:
    - q: Do you fit out the whole hall?
      a: 'Yes: aisle, rugs and seating floors to the hall plan, removed after the event for rentals.'
    - q: Do you visit the venue first?
      a: Yes, we visit free of charge to measure when needed, or estimate the area from photos and sizes you send on WhatsApp.
