ar:
  name: موكيت مجلس كريمي بزخرفة دائرية محفورة يدويًا
  directAnswer: موكيت كريمي مركّب من الجدار للجدار في مجلس عربي، تتوسطه زخرفة دائرية من أغصان متداخلة بالأزرق والبني ولمسات برتقالية، محفورة يدويًا ومدمجة في الموكيت نفسه. من أعمالنا في الحفر اليدوي، ونفّذ مثلها بالنقشة والألوان التي تختارها. السعر حسب مساحة المجلس وحجم النقشة.
  usage: تجعل الزخرفة الدائرية وسط المجلس نقطة تجمع للنظر بين الجلسات الأرضية، ويبقى باقي الموكيت سادة هادئًا يناسب المساند والكنب العربي الفاتح.
  care: نظّفه بالمكنسة الكهربائية بانتظام في اتجاه الوبر، وامسح البقع فور وقوعها دون فرك حتى تبقى حواف الحفر واضحة.
  seoTitle: موكيت مجلس بزخرفة دائرية محفورة يدويًا في الكويت — سجادكو
  seoDescription: موكيت مجالس كريمي بزخرفة دائرية محفورة يدويًا بالأزرق والبني، من أعمالنا في الكويت. ننفذ النقشة والألوان التي تختارها.
  reviewed: true
  faq:
    - q: هل أستطيع اختيار نقشة أخرى أو لونًا آخر؟
      a: نعم. ترسل صورة النقشة أو فكرتها مع مقاس المجلس عبر واتساب، ونؤكد معك الألوان والمقاس والسعر قبل البدء.
    - q: كم سعره؟
      a: السعر حسب مساحة المجلس وحجم النقشة وعدد ألوانها. نزورك مجانًا للقياس وعرض العينات، ثم نرسل السعر.
    - q: هل الزيارة والقياس مجانًا؟
      a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Cream Majlis Carpet with a Hand-Carved Round Medallion
  directAnswer: Cream wall-to-wall carpet in a floor-seating majlis with a round medallion of interlaced scrolls in blue, brown and orange, hand-carved into the carpet itself. One of our hand-carving jobs; we make it in the design and colours you choose. Priced by majlis area and design size.
  usage: The medallion anchors the centre between the floor seats while the rest of the carpet stays plain and calm.
  care: Vacuum regularly along the pile and blot spills straight away without rubbing so the carved edges stay crisp.
  seoTitle: Hand-Carved Medallion Majlis Carpet in Kuwait | Sajjadko
  seoDescription: Cream majlis carpet with a hand-carved round medallion in blue and brown. We make your design and colours.
  reviewed: true
  faq:
    - q: Can I choose another design or colour?
      a: Yes. Send the design and your majlis size on WhatsApp and we confirm colours, size and price before starting.
    - q: Is the home visit and measuring free?
      a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
