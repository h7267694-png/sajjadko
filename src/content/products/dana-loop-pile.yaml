ar:
  name: موكيت دانة الحلقي للمكاتب والممرات
  directAnswer: دانة موكيت تركي بوبر حلقي (لوب) مضفور بخطوط دقيقة ظاهرة، بتسعة ألوان بين الأبيض الكريمي والبيج والرمادي والأزرق الملكي. سطحه المتماسك يناسب المكاتب والممرات والفنادق وغرف النوم. يُباع بالمتر المربع ويُقص على مقاس المكان، والسعر من 5 إلى 15 د.ك للمتر المربع حسب السماكة والضغط والكثافة.
  usage: الوبر الحلقي يحافظ على شكله مع كثرة المشي، لذلك يُختار عادة للمكاتب والممرات والغرف الفندقية. الرمادي والبيج للمكاتب، والأزرق الملكي حين تريد لون الهوية في قاعة أو مكتب.
  care: نظّفه بالمكنسة الكهربائية بانتظام، وعالج البقع فور وقوعها بقطعة قماش مبللة دون فرك.
  seoTitle: موكيت دانة الحلقي للمكاتب بالمتر في الكويت — سجادكو الكويت
  seoDescription: موكيت تركي بوبر حلقي بتسعة ألوان للمكاتب والممرات والفنادق، يُقص ويُركّب على المقاس من 5 إلى 15 د.ك للمتر المربع.
  reviewed: false
en:
  name: Dana Loop-Pile Carpet for Offices and Hallways
  directAnswer: Dana is a Turkish wall-to-wall carpet with a loop pile and fine visible ribs, in nine colours from cream white, beige and grey to royal blue. Its firm surface suits offices, hallways, hotels and bedrooms. Sold per m² and cut to your room size, from 5 to 15 KWD per m² (0.465 to 1.394 KWD per sq ft) depending on thickness, pile pressure and density.
  usage: A loop pile keeps its shape under heavy foot traffic, which is why it is a common choice for offices, corridors and hotel rooms. Grey and beige suit offices, and royal blue works when you want a brand colour in a hall or office.
  care: Vacuum regularly, and blot spills straight away with a damp cloth without rubbing.
  seoTitle: Dana Loop-Pile Office Carpet by the m² in Kuwait | Sajjadko Kuwait
  seoDescription: Turkish loop-pile wall-to-wall carpet in nine colours for offices, hallways and hotels, cut and fitted from 5 to 15 KWD per m².
  reviewed: false
