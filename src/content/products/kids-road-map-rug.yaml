ar:
  name: زولية أطفال بنقش طريق وسيارات
  directAnswer: 'زولية أطفال جاهزة بأرضية عاجية ونقش طريق متعرج تمر عليه سيارة وحافلة، حوله جبال وأشجار وأقواس قزح وخيام بألوان هادئة: الرمادي والبرتقالي والأزرق الفاتح والعنابي. تناسب غرف الأولاد وغرف اللعب. السعر حسب المقاس، ونؤكده عبر واتساب.'
  usage: الطريق المرسوم يصبح مسارًا للعب بالسيارات الصغيرة، والألوان الهادئة تتناسق مع أثاث غرف الأطفال الخشبي والأبيض.
  care: نظّفها بالمكنسة الكهربائية بانتظام، وامسح البقع والسوائل فور وقوعها بقطعة قماش مبللة دون فرك.
  seoTitle: زولية أطفال بنقش طريق وسيارات في الكويت — سجادكو
  seoDescription: زولية أطفال جاهزة بنقش طريق وسيارات وجبال بألوان هادئة لغرف الأولاد وغرف اللعب. السعر حسب المقاس عبر واتساب.
  reviewed: true
  faq:
    - q: كم سعره؟
      a: السعر حسب المقاس. أرسل المقاس الذي تحتاجه عبر واتساب، ونؤكد لك المتوفر والسعر.
    - q: هل تصلح للعب بالسيارات الصغيرة؟
      a: نعم، الطريق المرسوم مسار للعب، والسطح مستوٍ تسير عليه السيارات الصغيرة.
en:
  name: Kids Rug with a Road and Cars Design
  directAnswer: This is a ready-made kids rug on an ivory ground with a winding road carrying a car and bus, surrounded by mountains, trees, rainbows and tents in calm grey, orange, light blue and burgundy. It suits boys rooms and playrooms. Priced by size, confirmed on WhatsApp.
  usage: The printed road becomes a track for toy cars, and the calm colours suit wood and white kids furniture.
  care: Vacuum regularly and blot spills straight away with a damp cloth without rubbing.
  seoTitle: Kids Road and Cars Rug in Kuwait | Sajjadko Kuwait
  seoDescription: Ready-made kids rug with a road, cars and mountains in calm colours for boys rooms and playrooms. Priced by size.
  reviewed: true
  faq:
    - q: How much is it?
      a: Priced by size. Send the size you need on WhatsApp and we confirm stock and price.
