en:
  name: Classic Dot Runner with Ribbed Gold Border
  directAnswer: The Classic Dot runner is a carpet runner with small gold dots across a navy or green ground, framed by a ribbed ivory-and-gold border on both sides. It is cut to the length you need for busy hallways, majlis rooms and office corridors. Sold by the m² and cut to your hallway length, from 5 to 15 KWD per m² (0.465 to 1.394 KWD per sq ft) depending on thickness and density.
  usage: The small repeating dots hide everyday foot traffic, and the ribbed border frames the walkway clearly, so it suits high-traffic hallways, majlis rooms and office corridors. Navy gives a formal look, while green suits traditional majlis rooms.
  care: Vacuum regularly, and blot spills straight away with a damp cloth without rubbing.
  seoTitle: Classic Dot Hallway Runner, Navy & Green, Kuwait | Sajjadko Kuwait
  seoDescription: Navy or green carpet runner with gold dots and a ribbed border, cut to any length for hallways, majlis rooms and offices in Kuwait.
  faq:
    - q: How much does the Classic Dot Runner cost in Kuwait?
      a: 'Runners are priced per m², from 5 to 15 KWD (0.465 to 1.394 KWD per sq ft) depending on thickness and density. Multiply length by width for the area: a 0.8 × 5 m (2.6 × 16.4 ft) runner is 4 m², so 20 to 60 KWD before installation.'
    - q: Can you cut a long hallway runner, like 15 ft or 20 ft?
      a: Yes. We cut the runner to the exact length you need, so you are not limited to stock sizes. 15 ft is about 4.6 m and 20 ft about 6.1 m. Send your hallway length and width on WhatsApp, in metres or feet, and we confirm before cutting.
    - q: Is this runner suitable for a bedroom or an entrance?
      a: It is designed more for hallways, majlis rooms and office corridors than bedrooms, because the dotted pattern and border give a formal look. For a softer bedroom runner, the Blossom Branch runner is a closer fit. We cut either to the length you need.
    - q: How do I measure my hallway for a runner?
      a: Measure the full length, and the width at the narrowest point. Leave an even strip of floor on each side, usually 10 to 20 cm (4 to 8 in). Check that doors opening over the runner have enough clearance, then send the numbers on WhatsApp.
    - q: Do you install carpet runners?
      a: Yes, we install the runners we supply. Installation is priced separately and agreed by area and location, and we follow up for two days after installation to fix any installation error. We do not install carpet bought elsewhere.
  reviewed: true
