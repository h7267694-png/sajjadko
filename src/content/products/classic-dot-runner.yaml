ar:
  name: مدة النقاط الكلاسيكية بإطار ذهبي مضلع
  directAnswer: 'مدة النقاط الكلاسيكية سجاد ممرات بأرضية ملونة تتوزع عليها نقاط ذهبية صغيرة، وإطار عاجي وذهبي مضلع على الجانبين، بلونين: أزرق داكن وأخضر. تُقص بالطول الذي تحتاجه للممرات والمجالس والمكاتب. يُباع بالمتر المربع ويُقص على طول ممرك، والسعر من 5 إلى 15 د.ك للمتر المربع حسب السماكة والكثافة.'
  usage: النقاط الصغيرة المتكررة تخفي آثار المشي اليومي، والإطار المضلع يحدد الممر بوضوح، فتناسب الممرات كثيرة الحركة والمجالس وممرات المكاتب. الأزرق الداكن للطابع الرسمي، والأخضر للمجالس التقليدية.
  care: نظّفها بالمكنسة الكهربائية بانتظام، وعالج البقع فور وقوعها بقطعة قماش مبللة دون فرك.
  seoTitle: مدة النقاط الكلاسيكية للممرات بالطول في الكويت — سجادكو الكويت
  seoDescription: سجاد ممرات بنقاط ذهبية وإطار مضلع بالأزرق الداكن والأخضر للممرات والمجالس، يُقص بالطول من 5 إلى 15 د.ك للمتر المربع.
  faq:
    - q: كم سعر مدة النقاط الكلاسيكية بالمتر؟
      a: 'يُسعّر بالمتر المربع من 5 إلى 15 د.ك حسب السماكة والكثافة. اضرب الطول في العرض لتعرف المساحة: مدة 0.8 × 5 م مساحتها 4 م²، فكلفتها بين 20 و60 د.ك قبل التركيب.'
    - q: هل تقصّونها بطول ممر طويل؟
      a: نعم، نقص المدة على الطول الذي تحتاجه بالضبط، فلا يقيدك مقاس جاهز. أرسل طول الممر وعرضه عبر واتساب، ونراجع المقاس معك قبل القص لأن القص لا يُعاد.
    - q: كيف أقيس الممر؟
      a: قس الطول كاملًا والعرض في أضيق نقطة، واترك من الأرضية على كل جانب ما بين 10 و20 سم. تأكد أن الأبواب التي تُفتح فوق المدة تتسع لسماكتها، ثم أرسل الأرقام عبر واتساب.
    - q: هل تركّبون المدات؟
      a: نعم، نركّب المدات التي نوفرها، وأجرة التركيب منفصلة وتُتفق حسب المساحة والموقع، ونتابع معك يومين بعد التركيب لمعالجة أي خطأ. ولا نركّب سجادًا اشتريته من غيرنا.
