ar:
  name: زولية مجلس تفصيل بإطار هندسي متدرج محفور
  directAnswer: زولية تفصيل كريمية مخملية بحواف مفصّلة على شكل درجات، يحيط بوسطها إطار هندسي من خطوط متداخلة بدرجات البيج والبني الرمادي، محفور يدويًا. تُفصّل بالمقاس والشكل الذي تريده. السعر حسب المقاس وحجم النقشة، ونؤكده عبر واتساب.
  usage: الألوان الترابية الهادئة تتناسق مع الخشب والرخام الأبيض في المجالس الحديثة.
  care: نظّفه بالمكنسة الكهربائية بانتظام في اتجاه الوبر، وامسح البقع فور وقوعها دون فرك حتى تبقى حواف الحفر واضحة.
  seoTitle: زولية مجلس تفصيل بإطار هندسي متدرج محفور في مبارك الكبير — سجادكو
  seoDescription: زولية مجلس كريمية بإطار هندسي متدرج محفور بدرجات البيج، سجاد حفر يدوي وتفصيل سجاد بالمقاس والشكل الذي تختاره للمجالس والصالات في الكويت. السعر حسب المقاس.
  reviewed: true
  faq:
    - q: كم سعره؟
      a: السعر حسب المقاس وحجم النقشة وعدد ألوانها. أرسل صورة النقشة والمقاس عبر واتساب ونرسل لك السعر قبل البدء.
    - q: هل أستطيع تغيير النقشة أو الألوان؟
      a: نعم، ننفذ النقشة نفسها بألوانك، أو نحفر نقشة ترسلها أنت، ونؤكد معك الرسم والألوان قبل البدء.
    - q: هل الزيارة والقياس مجانًا؟
      a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Majlis Rug with a Carved Stepped Geometric Border
  directAnswer: A custom cream plush rug with stepped shaped edges and a geometric border of interlocking lines in shades of beige and greyish brown, hand-carved. Made to the size and shape you want. Priced by size and design; we confirm on WhatsApp.
  usage: The calm earthy tones work with wood and white marble in modern majlis rooms.
  care: Vacuum regularly along the pile and blot spills straight away without rubbing so the carved edges stay crisp.
  seoTitle: Majlis Rug with a Carved Stepped Geometric Border, Mubarak Al-Kabeer
  seoDescription: Hand-carved majlis rug with a stepped geometric border in beige tones, made in our workshop to your size and shape for majlis and living rooms in Kuwait.
  reviewed: true
  faq:
    - q: How much is it?
      a: Priced by size, design size and number of colours. Send the design and size on WhatsApp for a price before we start.
    - q: Can I change the design or colours?
      a: Yes. We make this design in your colours or carve a design you send, and confirm the drawing and colours before starting.
    - q: Is the home visit and measuring free?
      a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
