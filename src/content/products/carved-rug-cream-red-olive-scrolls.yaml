ar:
  name: زولية محفورة يدويًا بأغصان حمراء وزيتية
  directAnswer: زولية تفصيل بأرضية كريمية وإطار بيج وزيتي، تتوسطها خرطوشة محفورة يتفرع منها غصن أحمر وأوراق زيتية، مع نقش بارز بلون الأرضية نفسه ودوائر بخطوط متموجة. كل لون محفور يدويًا بارتفاع وبر مختلف فيُلمس النقش باليد. تُفصّل بالمقاس والشكل الذي تريده. السعر حسب المقاس وحجم النقشة، ونؤكده عبر واتساب.
  usage: تناسب الصالات بالكنب الفاتح والخشب الداكن، والأحمر والزيتي يتناسقان مع المخدات الملونة.
  care: نظّفه بالمكنسة الكهربائية بانتظام في اتجاه الوبر، وامسح البقع فور وقوعها دون فرك حتى تبقى حواف الحفر واضحة.
  seoTitle: زولية محفورة يدويًا بأغصان حمراء وزيتية في الكويت — سجادكو
  seoDescription: زولية محفورة يدويًا بأغصان حمراء وزيتية، حفر يدوي في ورشتنا بالنقشة والألوان التي تختارها، للصالات والمجالس والديوانيات في الكويت. السعر حسب المقاس.
  reviewed: true
  faq:
    - q: كم سعره؟
      a: السعر حسب المقاس وحجم النقشة وعدد ألوانها. أرسل صورة النقشة والمقاس عبر واتساب ونرسل لك السعر قبل البدء.
    - q: هل أستطيع تغيير النقشة أو الألوان؟
      a: نعم، ننفذ النقشة نفسها بألوانك، أو نحفر نقشة ترسلها أنت، ونؤكد معك الرسم والألوان قبل البدء.
    - q: هل الزيارة والقياس مجانًا؟
      a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Hand-Carved Rug with Red and Olive Scrolls
  directAnswer: A custom rug with a cream field and beige and olive border, a carved cartouche branching into red stems and olive leaves, tone-on-tone relief scrolls and wavy-line roundels. Each colour is hand-carved at its own pile height, so the design can be felt by hand. Made to the size and shape you want. Priced by size and design; we confirm on WhatsApp.
  usage: Suits living rooms with light sofas and dark wood; the red and olive pick up coloured cushions.
  care: Vacuum regularly along the pile and blot spills straight away without rubbing so the carved edges stay crisp.
  seoTitle: Hand-Carved Rug with Red and Olive Scrolls in Kuwait | Sajjadko
  seoDescription: Hand-Carved Rug with Red and Olive Scrolls, hand-carved in our workshop in your design and colours for living rooms, majlis and diwaniya in Kuwait.
  reviewed: true
  faq:
    - q: How much is it?
      a: Priced by size, design size and number of colours. Send the design and size on WhatsApp for a price before we start.
    - q: Can I change the design or colours?
      a: Yes. We make this design in your colours or carve a design you send, and confirm the drawing and colours before starting.
    - q: Is the home visit and measuring free?
      a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
