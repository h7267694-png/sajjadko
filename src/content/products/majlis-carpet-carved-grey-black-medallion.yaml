ar:
  name: موكيت ديوانية رمادي بزخرفة سوداء محفورة في الوسط
  directAnswer: موكيت رمادي فضي مخملي مركّب من الجدار للجدار في ديوانية واسعة، تتوسطه زخرفة طولية سوداء بإطار أبيض محفورة يدويًا. التباين بين الأسود والرمادي يُبرز النقشة في القاعات الكبيرة. من أعمالنا في الحفر اليدوي، والسعر حسب المساحة وحجم النقشة.
  usage: 'يناسب الديوانيات والقاعات الطويلة: الزخرفة الطولية تتبع امتداد القاعة، والرمادي يتناسق مع الجلسات الفاتحة والجدران الداكنة.'
  care: نظّفه بالمكنسة الكهربائية بانتظام في اتجاه الوبر، وامسح البقع فور وقوعها دون فرك حتى تبقى حواف الحفر واضحة.
  seoTitle: موكيت ديوانية رمادي بزخرفة محفورة في الكويت — سجادكو
  seoDescription: موكيت ديوانيات رمادي فضي بزخرفة سوداء محفورة يدويًا في الوسط، من أعمالنا في الكويت. السعر حسب المساحة.
  reviewed: true
  faq:
  - q: هل أستطيع اختيار نقشة أخرى أو لونًا آخر؟
    a: نعم. ترسل صورة النقشة أو فكرتها مع مقاس المجلس عبر واتساب، ونؤكد معك الألوان والمقاس والسعر قبل البدء.
  - q: كم سعره؟
    a: السعر حسب مساحة المجلس وحجم النقشة وعدد ألوانها. نزورك مجانًا للقياس وعرض العينات، ثم نرسل السعر.
