ar:
  name: سجاد مسجد بنقش نجمة إسلامية بثلاثة ألوان
  directAnswer: 'سجاد مساجد بصفوف، لكل صف نقش نجمة إسلامية هندسية بخطوط بيج وإطار سفلي يحدد موضع السجود، بثلاثة ألوان: العنابي والكحلي والأزرق المخضر. رول بعرض 1.33 م أو 4 م، والسعر 6 أو 7 أو 8 د.ك للمتر المربع حسب السماكة، مع القياس ومحاذاة الصفوف مع القبلة والتركيب.'
  usage: النقش الهندسي يناسب المساجد الحديثة والمصليات، والإطار السفلي يجعل الصفوف واضحة ومستقيمة. العنابي اللون المعتاد في المساجد، والكحلي والأزرق المخضر يناسبان المساجد ذات الجدران الفاتحة.
  care: نظّفه بالمكنسة الكهربائية بانتظام، وامسح البقع فور وقوعها بقطعة قماش مبللة دون فرك.
  seoTitle: سجاد مسجد بنقش نجمة إسلامية في الكويت — سجادكو
  seoDescription: سجاد مساجد بصفوف بنقش نجمة إسلامية بالعنابي والكحلي والأزرق، رول 1.33 أو 4 م، من 6 إلى 8 د.ك للمتر المربع مع محاذاة القبلة والتركيب.
  reviewed: true
  faq:
    - q: كم سعر سجاد المسجد بالمتر؟
      a: 6 د.ك للخفيف و7 للوسط و8 للسميك للمتر المربع، والسعر نفسه لرول 1.33 م ورول 4 م. قاعة 180 م² تكلف بين 1,080 و1,440 د.ك قبل التركيب.
    - q: هل تُحاذى الصفوف مع القبلة؟
      a: نعم، نقيس القاعة في الموقع ونحدد القبلة، ونقص الرول بحيث يكون كل صف بعرض 1.33 م ومحاذيًا للقبلة، ونراجع القياس مع صاحب الطلب قبل القص.
    - q: ما الألوان المتوفرة؟
      a: 'ثلاثة ألوان بهذا النقش: العنابي والكحلي والأزرق المخضر. أرسل اللون والمساحة عبر واتساب لنؤكد الكمية.'
    - q: هل الزيارة والقياس مجانًا؟
      a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Mosque Carpet with an Islamic Star Pattern in Three Colours
  directAnswer: 'This is mosque carpet in prayer rows, each row with a geometric Islamic star pattern in beige lines and a lower border marking the place of prostration, in three colours: burgundy, navy and teal. Rolls are 1.33 m or 4 m wide, at 6, 7 or 8 KWD per m² by thickness, with measuring, qibla alignment and installation.'
  usage: The geometric pattern suits modern mosques and prayer rooms, and the lower border keeps rows clear and straight. Burgundy is the usual mosque colour; navy and teal suit mosques with light walls.
  care: Vacuum regularly and blot spills straight away with a damp cloth.
  seoTitle: Mosque Carpet with Islamic Star Pattern, Kuwait | Sajjadko
  seoDescription: Mosque carpet in rows with an Islamic star pattern in burgundy, navy and teal, 1.33 or 4 m rolls, 6 to 8 KWD per m² with qibla alignment and fitting.
  reviewed: true
  faq:
    - q: How much is mosque carpet per m²?
      a: 6 KWD light, 7 medium and 8 thick per m², the same for 1.33 m and 4 m rolls. A 180 m² hall costs about 1,080 to 1,440 KWD before installation.
    - q: Are the rows aligned with the qibla?
      a: Yes. We measure the hall on site, find the qibla and cut the roll so each 1.33 m row is aligned with it, confirming measurements before cutting.
    - q: Is the home visit and measuring free?
      a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
