  name: موكيت غرف نوم سادة مخملي بالرمادي والبيج
  directAnswer: موكيت سادة بوبر مقصوص ناعم وملمس مخملي، بالرمادي الفاتح والرمادي الداكن والبيج. يُقص على مقاس الغرفة ويُركّب من الجدار للجدار، فيعطي غرفة النوم أرضية دافئة وهادئة. السعر من 5 إلى 15 د.ك للمتر المربع حسب السماكة والكثافة.
  usage: يناسب غرف النوم وغرف الأولاد والضيوف. الرمادي الفاتح والبيج يوسّعان الغرفة ويناسبان الأثاث الأبيض والخشبي، والرمادي الداكن يخفي آثار الاستعمال اليومي أكثر.
  care: نظّفه بالمكنسة الكهربائية مرة أو مرتين أسبوعيًا، وامسح البقع والسوائل فور وقوعها بقطعة قماش مبللة دون فرك.
