en:
  name: Plain Plush Bedroom Carpet in Grey and Beige
  directAnswer: A plain soft cut-pile plush carpet in light grey, charcoal grey and beige. It is cut to the room and fitted wall to wall for a warm, quiet bedroom floor. Price is 5 to 15 KWD per m² depending on thickness and density.
  usage: Suits bedrooms, kids rooms and guest rooms. Light grey and beige open up a room; charcoal hides daily wear better.
  care: Vacuum once or twice a week and blot spills straight away with a damp cloth without rubbing.
