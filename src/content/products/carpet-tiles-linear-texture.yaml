ar:
  name: بلاط سجاد 40×40 بنقش خطوط متداخلة بسبعة ألوان
  directAnswer: بلاط سجاد بمقاس 40×40 سم بنقش خطوط قصيرة متداخلة بارزة تشكّل مربعات متدرجة، بسبعة ألوان من العاجي والكريمي إلى الرمادي الداكن والبني الرمادي. للمكاتب والفنادق. يُباع بالمتر المربع من 5 إلى 6 د.ك، والمتر فيه 6.25 بلاطة، والبلاطة التالفة تُبدل وحدها.
  usage: النقش الخطي المتداخل يعطي الأرضية ملمسًا هادئًا ويخفي البقع الصغيرة وآثار عجلات الكراسي. الألوان الفاتحة لمكاتب الإدارة والاستقبال، والرمادي الداكن لمناطق الحركة.
  care: نظّفه بالمكنسة الكهربائية بانتظام، وامسح البقع فور وقوعها بقطعة قماش مبللة. البلاطة التالفة تُبدل وحدها.
  seoTitle: بلاط سجاد 40×40 بنقش خطوط متداخلة للمكاتب — سجادكو
  seoDescription: بلاط سجاد مكاتب 40×40 سم بنقش خطوط متداخلة بسبعة ألوان، من 5 إلى 6 د.ك للمتر المربع في الكويت، مع القياس والتركيب.
  reviewed: true
  faq:
    - q: كم سعر هذا البلاط بالمتر؟
      a: من 5 إلى 6 د.ك للمتر المربع، ونؤكد السعر الدقيق عند اختيار الخامة. المتر المربع فيه 6.25 بلاطة.
    - q: أي لون أنسب للمكاتب كثيرة الحركة؟
      a: الرمادي الداكن والبني الرمادي يخفيان آثار المشي وعجلات الكراسي أكثر من العاجي والأبيض.
    - q: هل تركّبونه خارج أوقات الدوام؟
      a: نعم، نتفق معك على موعد التركيب، ويمكن أن يكون خارج أوقات الدوام. أجرة التركيب منفصلة حسب المساحة والموقع.
en:
  name: 40×40 Carpet Tiles with a Linear Texture in Seven Colours
  directAnswer: These are 40×40 cm carpet tiles with a raised pattern of short interlocking lines forming stepped squares, in seven colours from ivory and cream to dark grey and taupe. For offices and hotels. Sold by the m² at 5 to 6 KWD; one m² takes 6.25 tiles, and a damaged tile can be replaced on its own.
  usage: The linear texture gives the floor a calm surface and hides small marks and chair castor tracks. Light colours suit executive offices and reception; dark grey suits high-traffic areas.
  care: Vacuum regularly and blot spills straight away with a damp cloth. A damaged tile is replaced on its own.
  seoTitle: 40×40 Linear Texture Carpet Tiles for Offices | Sajjadko
  seoDescription: 40×40 cm office carpet tiles with a linear texture in seven colours, 5 to 6 KWD per m² in Kuwait, measured and installed.
  reviewed: true
  faq:
    - q: How much are these tiles per m²?
      a: 5 to 6 KWD per m², confirmed once you choose the material. One m² takes 6.25 tiles.
    - q: Which colour suits a busy office?
      a: Dark grey and taupe hide foot traffic and chair castor marks better than ivory and white.
