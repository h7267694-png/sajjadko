ar:
  name: زولية صالة محفورة بإطار أسود وزخارف ركنية
  directAnswer: زولية تفصيل كبيرة بأرضية كريمية مخملية، يحيط بها إطار أسود بزوايا مقوسة وزخارف ركنية بيج بارزة، وحافة بيج خارجية. مقصوصة على طول الصالة بين الكنب. تُفصّل بالمقاس والشكل الذي تريده. السعر حسب المقاس وحجم النقشة، ونؤكده عبر واتساب.
  usage: الإطار الأسود يحدد الجلسة على الرخام الفاتح، ويناسب الصالات الطويلة ذات الكنب المنحني.
  care: نظّفه بالمكنسة الكهربائية بانتظام في اتجاه الوبر، وامسح البقع فور وقوعها دون فرك حتى تبقى حواف الحفر واضحة.
  seoTitle: زولية صالة محفورة بإطار أسود وزخارف ركنية في الكويت — سجادكو
  seoDescription: زولية صالة محفورة بإطار أسود وزخارف ركنية، حفر يدوي في ورشتنا بالنقشة والألوان التي تختارها، للصالات والمجالس والديوانيات في الكويت. السعر حسب المقاس.
  reviewed: true
  faq:
    - q: كم سعره؟
      a: السعر حسب المقاس وحجم النقشة وعدد ألوانها. أرسل صورة النقشة والمقاس عبر واتساب ونرسل لك السعر قبل البدء.
    - q: هل أستطيع تغيير النقشة أو الألوان؟
      a: نعم، ننفذ النقشة نفسها بألوانك، أو نحفر نقشة ترسلها أنت، ونؤكد معك الرسم والألوان قبل البدء.
    - q: هل الزيارة والقياس مجانًا؟
      a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Carved Living Room Rug with a Black Frame and Corner Scrolls
  directAnswer: A large custom rug with a cream plush field, a black frame with curved corners, raised beige corner scrolls and an outer beige edge, cut to the length of the living room between the sofas. Made to the size and shape you want. Priced by size and design; we confirm on WhatsApp.
  usage: The black frame defines the seating on light marble and suits long living rooms with curved sofas.
  care: Vacuum regularly along the pile and blot spills straight away without rubbing so the carved edges stay crisp.
  seoTitle: Carved Living Room Rug with a Black Frame and Corner Scrolls in Kuwait
  seoDescription: Carved Living Room Rug with a Black Frame and Corner Scrolls, hand-carved in our workshop in your design and colours for living rooms, majlis and diwaniya in Ku
  reviewed: true
  faq:
    - q: How much is it?
      a: Priced by size, design size and number of colours. Send the design and size on WhatsApp for a price before we start.
    - q: Can I change the design or colours?
      a: Yes. We make this design in your colours or carve a design you send, and confirm the drawing and colours before starting.
    - q: Is the home visit and measuring free?
      a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
