ar:
  name: سجاد حفر يدوي رمادي بإطار أوراق ملتفة كريمي
  directAnswer: سجاد حفر يدوي بأرضية رمادية، يحيط بها إطار عريض من أوراق وأغصان ملتفة بلون كريمي بين خطين مستقيمين، محفور يدويًا في مشغلنا. يُفصّل بالمقاس والألوان التي تختارها، والسعر حسب المواصفات ونؤكده عبر واتساب.
  usage: شكله المستطيل الطويل يناسب المجالس والممرات العريضة، والإطار الكريمي يبرز على الأرضية الرمادية.
  care: نظّفه بالمكنسة الكهربائية بانتظام في اتجاه الوبر، وامسح البقع فور وقوعها دون فرك حتى تبقى حواف الحفر واضحة.
  seoTitle: سجاد حفر يدوي رمادي بإطار أوراق كريمي — حفر يدوي بالكويت
  seoDescription: سجاد حفر يدوي رمادي بإطار عريض من أوراق ملتفة كريمية، تفصيل سجاد بالمقاس والألوان للمجالس والممرات في الكويت. السعر حسب المواصفات.
  reviewed: true
  faq:
  - q: كم سعره؟
    a: السعر حسب المقاس وحجم النقشة وعدد ألوانها والمواصفات التي تختارها. أرسل المقاس عبر واتساب ونرسل لك السعر قبل البدء.
  - q: هل أستطيع تغيير النقشة أو الألوان؟
    a: نعم، ننفذ النقشة نفسها بألوانك أو بمقاس مختلف، أو نحفر نقشة ترسلها أنت، ونؤكد معك الرسم والألوان قبل البدء.
  - q: هل الزيارة والقياس مجانًا؟
    a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Grey Hand-Carved Rug with a Cream Scroll Leaf Border
  directAnswer: A hand-carved rug with a grey ground framed by a wide border of cream scrolling leaves between two straight lines, carved by hand in our workshop. Made to your size and colours; priced by specification on WhatsApp.
  usage: The long rectangular shape suits majlis rooms and wide hallways, and the cream border stands out on the grey ground.
  care: Vacuum regularly along the pile and blot spills straight away without rubbing so the carved edges stay crisp.
  seoTitle: Grey Hand-Carved Rug, Cream Leaf Border | Sajjadko Kuwait
  seoDescription: Grey hand-carved rug with a wide cream scroll leaf border, made to your size and colours for majlis rooms and hallways in Kuwait.
  reviewed: true
  faq:
  - q: How much is it?
    a: Priced by size, design size, number of colours and the specification you choose. Send the size on WhatsApp for a price before we start.
  - q: Can I change the design or colours?
    a: Yes. We make this design in your colours or size, or carve a design you send, and confirm the drawing and colours before starting.
  - q: Is the home visit and measuring free?
    a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
