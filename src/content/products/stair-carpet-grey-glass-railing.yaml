ar:
  name: سجاد درج رمادي لدرج داخلي بدرابزين زجاج
  directAnswer: 'سجاد درج رمادي كثيف ركّبناه في بيت بمنطقة سلوى على درج داخلي بدرابزين زجاج وإضاءة جدارية، مقصوص على مقاس كل درجة ويغطي الدرجة ومقدمتها بقطعة واحدة. السعر 7 د.ك للمتر الطولي، والقياس مجاني.'
  usage: سجاد السلم يقلل الانزلاق وصوت الخطوات ويحمي حواف الدرج، والرمادي يخفي آثار الاستعمال اليومي في السلالم كثيرة المرور.
  care: نظّفه بالمكنسة الكهربائية مرة أسبوعيًا على الأقل، خصوصًا مقدمة الدرجات لأنها الأكثر احتكاكًا، وامسح البقع فور وقوعها دون فرك.
  seoTitle: تركيب سجاد درج رمادي في سلوى — 7 د.ك للمتر | سجادكو
  seoDescription: سجاد درج رمادي لسلم داخلي في سلوى، مقصوص على مقاس كل درجة ويغطي مقدمتها، بسعر 7 د.ك للمتر الطولي مع قياس مجاني وتركيب في الكويت.
  reviewed: true
  faq:
    - q: كم سعر سجاد الدرج بالمتر؟
      a: 7 د.ك للمتر الطولي. نقيس الدرج مجانًا ونحسب عدد الأمتار حسب عرض الدرجات وعددها، ثم نرسل لك السعر الإجمالي عبر واتساب.
    - q: هل يُقص السجاد على مقاس كل درجة؟
      a: نعم، نقص لكل درجة قطعة تغطي سطحها ومقدمتها، ونثبتها حتى تبقى مشدودة ولا تنزلق.
    - q: هل الزيارة والقياس مجانًا؟
      a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Grey Stair Carpet for an Indoor Staircase with Glass Railing
  directAnswer: 'Dense grey stair carpet we fitted in a house in Salwa on an indoor staircase with a glass railing and wall lights, cut to each step and wrapping the tread and riser in one piece. 7 KWD per running metre, with free measuring.'
  usage: Stair carpet reduces slipping and footstep noise and protects the step edges, and grey hides everyday wear on busy stairs.
  care: Vacuum at least weekly, especially the step noses, and blot spills straight away without rubbing.
  seoTitle: Grey Stair Carpet Fitted in Salwa, Kuwait | Sajjadko
  seoDescription: Grey stair carpet fitted on indoor stairs in Salwa, cut to each step and wrapping the riser, at 7 KWD per running metre with free measuring and fitting in Kuwait.
  reviewed: true
  faq:
    - q: How much is stair carpet per metre?
      a: 7 KWD per running metre. We measure the stairs free of charge, work out the metres from the step width and count, and send the total on WhatsApp.
    - q: Is the home visit and measuring free?
      a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
