ar:
  name: زولية دائرية حفر يدوي بإطار مفرغ بني
  directAnswer: زولية دائرية حفر يدوي بوسط سادة لامع بلون فاتح، يحيط به إطار عريض بنقشة مفرغة بنية تتبع شكل الدائرة. محفورة يدويًا، وتُفصّل بالقطر والألوان التي تختارها، والسعر حسب المواصفات عبر واتساب.
  usage: الزولية الدائرية تناسب وسط الصالة وتحت الطاولات المستديرة والكنب الدائري.
  care: نظّفه بالمكنسة الكهربائية بانتظام في اتجاه الوبر، وامسح البقع فور وقوعها دون فرك حتى تبقى حواف الحفر واضحة.
  seoTitle: زولية دائرية حفر يدوي بإطار مفرغ بني — حفر يدوي بالكويت
  seoDescription: زولية دائرية حفر يدوي بوسط سادة وإطار عريض بنقشة مفرغة بنية، تفصيل سجاد بالقطر والألوان للصالات في الكويت.
  reviewed: true
  faq:
  - q: كم سعره؟
    a: السعر حسب المقاس وحجم النقشة وعدد ألوانها والمواصفات التي تختارها. أرسل المقاس عبر واتساب ونرسل لك السعر قبل البدء.
  - q: هل أستطيع تغيير النقشة أو الألوان؟
    a: نعم، ننفذ النقشة نفسها بألوانك أو بمقاس مختلف، أو نحفر نقشة ترسلها أنت، ونؤكد معك الرسم والألوان قبل البدء.
  - q: هل الزيارة والقياس مجانًا؟
    a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Round Hand-Carved Rug with a Brown Openwork Border
  directAnswer: A round hand-carved rug with a plain glossy light centre and a wide brown openwork border following the circle. Carved by hand and made to your diameter and colours; priced by specification on WhatsApp.
  usage: A round rug suits the centre of a living room and sits well under round tables and curved sofas.
  care: Vacuum regularly along the pile and blot spills straight away without rubbing so the carved edges stay crisp.
  seoTitle: Round Hand-Carved Rug, Brown Openwork Border | Sajjadko
  seoDescription: Round hand-carved rug with a plain centre and a wide brown openwork border, made to your diameter and colours in Kuwait.
  reviewed: true
  faq:
  - q: How much is it?
    a: Priced by size, design size, number of colours and the specification you choose. Send the size on WhatsApp for a price before we start.
  - q: Can I change the design or colours?
    a: Yes. We make this design in your colours or size, or carve a design you send, and confirm the drawing and colours before starting.
  - q: Is the home visit and measuring free?
    a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
