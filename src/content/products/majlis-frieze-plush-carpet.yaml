ar:
  name: موكيت مجالس بوبر كثيف ملتف بستة ألوان
  directAnswer: 'موكيت بوبر كثيف ملتف يعطي سطحًا محببًا ناعمًا تحت القدم، بستة ألوان: أصفر زيتي فاتح وبيج ورمادي فاتح وأزرق رمادي ورمادي وبني رمادي. يُقص على مقاس المجلس أو الديوانية ويُركّب من الجدار للجدار. السعر من 5 إلى 15 د.ك للمتر المربع حسب السماكة والكثافة.'
  usage: الوبر الملتف يخفي آثار الأقدام وكثرة الجلوس أكثر من الوبر المستقيم، فيناسب المجالس والديوانيات التي يكثر فيها الضيوف، ويصلح أيضًا للصالات وغرف النوم.
  care: نظّفه بالمكنسة الكهربائية مرة أو مرتين أسبوعيًا، وامسح البقع والسوائل فور وقوعها بقطعة قماش مبللة دون فرك.
  seoTitle: موكيت مجالس كثيف الوبر بالمتر في الكويت — سجادكو
  seoDescription: موكيت مجالس وديوانيات بوبر كثيف ملتف بستة ألوان، يُقص ويُركّب من الجدار للجدار. من 5 إلى 15 د.ك للمتر.
  reviewed: true
  faq:
    - q: كم سعر المتر؟
      a: من 5 إلى 15 د.ك للمتر المربع حسب السماكة والكثافة. أرسل مقاس المجلس ورقم اللون عبر واتساب ونرسل السعر.
    - q: هل يمكن حفر نقشة في وسطه؟
      a: نعم، نحفر النقشة يدويًا وندمجها في الموكيت بالألوان التي تختارها، والسعر حسب حجم النقشة.
    - q: هل الزيارة والقياس مجانًا؟
      a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Frieze Majlis Carpet in Six Colours
  directAnswer: 'A dense twisted frieze pile with a soft textured surface, in six colours: light olive yellow, beige, light grey, slate blue, grey and taupe. Cut to the majlis or diwaniya and fitted wall to wall. 5 to 15 KWD per m² depending on thickness and density.'
  usage: Twisted pile hides footprints and heavy seating better than straight pile, so it suits busy majlis and diwaniya.
  care: Vacuum once or twice a week and blot spills straight away with a damp cloth without rubbing.
  seoTitle: Frieze Majlis Carpet by the Metre in Kuwait | Sajjadko
