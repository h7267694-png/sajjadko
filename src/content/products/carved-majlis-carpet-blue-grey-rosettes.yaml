ar:
  name: موكيت مجلس أزرق رمادي بوردتين محفورتين
  directAnswer: موكيت أزرق رمادي من الجدار للجدار في مجلس عربي واسع، فيه وردتان هندسيتان كبيرتان بالعاجي والذهبي، وإطار بخطين ذهبي وبني حول الأطراف. الحفر يدوي. نركّبه من الجدار للجدار ونقصه على مقاس المكان. السعر حسب المقاس وحجم النقشة، ونؤكده عبر واتساب.
  usage: الأزرق الرمادي يتناسق مع المساند الزرقاء والخشب البني، والوردتان توزعان النقش على طول المجلس.
  care: نظّفه بالمكنسة الكهربائية بانتظام في اتجاه الوبر، وامسح البقع فور وقوعها دون فرك حتى تبقى حواف الحفر واضحة.
  seoTitle: موكيت مجلس أزرق رمادي بوردتين محفورتين في الكويت — سجادكو
  seoDescription: موكيت مجلس أزرق رمادي بوردتين محفورتين، حفر يدوي في ورشتنا بالنقشة والألوان التي تختارها، للصالات والمجالس والديوانيات في الكويت. السعر حسب المقاس.
  reviewed: true
  faq:
    - q: كم سعره؟
      a: السعر حسب مساحة المكان وحجم النقشة وعدد ألوانها. أرسل صورة النقشة والمقاس عبر واتساب ونرسل لك السعر قبل البدء.
    - q: هل أستطيع تغيير النقشة أو الألوان؟
      a: نعم، ننفذ النقشة نفسها بألوانك، أو نحفر نقشة ترسلها أنت، ونؤكد معك الرسم والألوان قبل البدء.
    - q: هل الزيارة والقياس مجانًا؟
      a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Blue-Grey Majlis Carpet with Two Carved Rosettes
  directAnswer: Blue-grey wall-to-wall carpet in a large floor-seating majlis with two large ivory and gold geometric rosettes and a gold and brown double border. Hand-carved. We fit it wall to wall, cut to your room. Priced by size and design; we confirm on WhatsApp.
  usage: Blue-grey suits blue cushions and brown wood; the two rosettes spread the design along the majlis.
  care: Vacuum regularly along the pile and blot spills straight away without rubbing so the carved edges stay crisp.
  seoTitle: Blue-Grey Majlis Carpet with Two Carved Rosettes in Kuwait | Sajjadko
  seoDescription: Blue-Grey Majlis Carpet with Two Carved Rosettes, hand-carved in our workshop in your design and colours for living rooms, majlis and diwaniya in Kuwait.
  reviewed: true
  faq:
    - q: How much is it?
      a: Priced by area, design size and number of colours. Send the design and size on WhatsApp for a price before we start.
    - q: Can I change the design or colours?
      a: Yes. We make this design in your colours or carve a design you send, and confirm the drawing and colours before starting.
    - q: Is the home visit and measuring free?
      a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
