ar:
  name: بلاط سجاد 40×40 رمادي داكن بخطوط صفراء
  directAnswer: بلاط سجاد بمقاس 40×40 سم بوبر حلقي متماسك، بلون رمادي داكن تتخلله خطوط صفراء رفيعة. يُركّب بتبديل اتجاه البلاط فتتكون من الخطوط أشكال هندسية على الأرضية. للمكاتب والفنادق وغرف الاجتماعات. يُباع بالمتر المربع من 5 إلى 6 د.ك، والمتر فيه 6.25 بلاطة، والبلاطة التالفة تُبدل وحدها.
  usage: اللون رمادي داكن يخفي آثار المشي وعجلات الكراسي، والخطوط صفراء تعطي المكتب لمسة لون دون أن تطغى على المكان. الوبر الحلقي يحافظ على شكله مع كثرة الحركة.
  care: نظّفه بالمكنسة الكهربائية بانتظام، وامسح البقع فور وقوعها بقطعة قماش مبللة. البلاطة التي يتعذر تنظيفها تُرفع وتُبدل بأخرى من الطلبية نفسها.
  seoTitle: بلاط سجاد 40×40 رمادي بخطوط صفراء للمكاتب — سجادكو
  seoDescription: بلاط سجاد مكاتب 40×40 سم بوبر حلقي رمادي داكن بخطوط صفراء، من 5 إلى 6 د.ك للمتر المربع في الكويت، مع القياس والتركيب.
  reviewed: true
  faq:
    - q: كم سعر هذا البلاط بالمتر؟
      a: من 5 إلى 6 د.ك للمتر المربع، ونؤكد السعر الدقيق عند اختيار الخامة. مكتب 50 م² يحتاج نحو 313 بلاطة، بكلفة بين 250 و300 د.ك قبل التركيب.
    - q: هل يمكن تبديل بلاطة واحدة؟
      a: نعم، البلاطة التالفة تُرفع وتوضع مكانها بلاطة جديدة دون المساس بالباقي. ننصح بالاحتفاظ ببضع بلاطات احتياطية من الطلبية نفسها.
    - q: هل تركّبونه خارج أوقات الدوام؟
      a: نعم، نتفق معك على موعد التركيب، ويمكن أن يكون خارج أوقات الدوام. أجرة التركيب منفصلة حسب المساحة والموقع.
en:
  name: 40×40 Dark Grey Carpet Tiles with Yellow Lines
  directAnswer: These are 40×40 cm loop-pile carpet tiles in dark grey with thin yellow lines. Laid in alternating directions, the lines form geometric shapes across the floor. For offices, hotels and meeting rooms. Sold by the m² at 5 to 6 KWD (0.465 to 0.557 KWD per sq ft); one m² takes 6.25 tiles, and a damaged tile can be replaced on its own.
  usage: The dark grey ground hides foot traffic and chair castor marks, and the yellow lines add a touch of colour without dominating the room. The loop pile keeps its shape under heavy use.
  care: Vacuum regularly and blot spills straight away with a damp cloth. A tile that cannot be cleaned is lifted and replaced with one from the same order.
  seoTitle: 40×40 Grey Carpet Tiles with Yellow Lines | Sajjadko Kuwait
  seoDescription: 40×40 cm loop-pile office carpet tiles in dark grey with yellow lines, 5 to 6 KWD per m² in Kuwait, measured and installed.
  reviewed: true
  faq:
    - q: How much are these tiles per m²?
      a: 5 to 6 KWD per m², confirmed once you choose the material. A 50 m² office needs about 313 tiles, roughly 250 to 300 KWD before installation.
    - q: Can one tile be replaced?
      a: Yes. A damaged tile is lifted and a new one goes in its place. Keep a few spare tiles from the same order.
