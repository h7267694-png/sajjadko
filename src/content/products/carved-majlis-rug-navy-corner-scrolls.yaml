ar:
  name: زولية مجلس محفورة بزوايا أغصان كحلية
  directAnswer: زولية تفصيل كريمية مخملية كبيرة، في زواياها أغصان كحلية ملتفة بلمسات بنية محفورة يدويًا، ووسطها سادة واسع. تُفصّل بالمقاس الذي تريده وتوضع على الرخام بين جلسات المجلس. السعر حسب المقاس وحجم النقشة، ونؤكده عبر واتساب.
  usage: الوسط السادة الواسع يناسب المجالس الكبيرة ذات الكنب الأبيض، والزوايا الكحلية تبرز دون أن تزحم المكان.
  care: نظّفه بالمكنسة الكهربائية بانتظام في اتجاه الوبر، وامسح البقع فور وقوعها دون فرك حتى تبقى حواف الحفر واضحة.
  seoTitle: زولية مجلس محفورة بزوايا أغصان كحلية في مبارك الكبير — سجادكو
  seoDescription: زولية مجلس كريمية بزوايا أغصان كحلية، سجاد حفر يدوي وتفصيل سجاد بالمقاس والنقش الذي تختاره، للمجالس والديوانيات والصالات في الكويت. السعر حسب المقاس.
  reviewed: true
  faq:
    - q: كم سعره؟
      a: السعر حسب المقاس وحجم النقشة وعدد ألوانها. أرسل صورة النقشة والمقاس عبر واتساب ونرسل لك السعر قبل البدء.
    - q: هل أستطيع تغيير النقشة أو الألوان؟
      a: نعم، ننفذ النقشة نفسها بألوانك، أو نحفر نقشة ترسلها أنت، ونؤكد معك الرسم والألوان قبل البدء.
    - q: هل الزيارة والقياس مجانًا؟
      a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Carved Majlis Rug with Navy Corner Scrolls
  directAnswer: A large custom cream plush rug with curling navy scrolls and brown accents hand-carved into its corners, around a wide plain centre. Made to your size for the floor between majlis seating. Priced by size and design; we confirm on WhatsApp.
  usage: The wide plain centre suits large majlis rooms with white sofas, and the navy corners stand out without crowding the space.
  care: Vacuum regularly along the pile and blot spills straight away without rubbing so the carved edges stay crisp.
  seoTitle: Carved Majlis Rug with Navy Corner Scrolls, Mubarak Al-Kabeer
  seoDescription: Hand-carved majlis rug with navy corner scrolls, made in our workshop to your size and colours for majlis, diwaniya and living rooms in Kuwait.
  reviewed: true
  faq:
    - q: How much is it?
      a: Priced by size, design size and number of colours. Send the design and size on WhatsApp for a price before we start.
    - q: Can I change the design or colours?
      a: Yes. We make this design in your colours or carve a design you send, and confirm the drawing and colours before starting.
    - q: Is the home visit and measuring free?
      a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
