ar:
  name: زولية كلاسيكية بنقش مزهرية وزهور على أرضية عاجية
  directAnswer: 'زولية جاهزة بتصميم كلاسيكي: مزهرية في الوسط تخرج منها أغصان وزهور بالأزرق والعنابي والذهبي والأخضر على أرضية عاجية، يحيط بها إطار زهري متصل، وأطرافها بأهداب. تناسب الصالات والمجالس وغرف النوم. السعر حسب المقاس، ونؤكده عبر واتساب.'
  usage: الأرضية العاجية مع الألوان المتعددة تناسب الأثاث الخشبي والكنب الفاتح، والنقش الكثيف يخفي آثار الاستعمال اليومي.
  care: نظّفها بالمكنسة الكهربائية بانتظام، وامسح البقع فور وقوعها بقطعة قماش مبللة دون فرك، وأدرها كل بضعة أشهر ليتوزع أثر المشي.
  seoTitle: زولية كلاسيكية بنقش زهور عاجية في الكويت — سجادكو
  seoDescription: زولية جاهزة كلاسيكية بنقش مزهرية وأغصان وزهور بالأزرق والعنابي والذهبي على أرضية عاجية للصالات والمجالس. السعر حسب المقاس.
  reviewed: true
  faq:
  - q: كم سعر هذه الزولية؟
    a: السعر حسب المقاس المتوفر أو المطلوب. أرسل المقاس الذي تحتاجه عبر واتساب، ونؤكد لك المتوفر والسعر.
  - q: ما المقاسات المتوفرة؟
    a: 'نؤكد المقاسات المتوفرة من هذا التصميم عبر واتساب. والمقاسات الشائعة للزوالي الجاهزة: 160×230 و200×300 و240×340 و300×400 سم.'
  - q: هل الزيارة والقياس مجانًا؟
    a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Classic Rug with a Vase and Floral Design on Ivory
  directAnswer: 'This is a ready-made rug with a classic design: a central vase with branches and flowers in blue, burgundy, gold and green on an ivory ground, a continuous floral border and fringed ends. It suits living rooms, majlis rooms and bedrooms. Priced by size, confirmed on WhatsApp.'
  usage: The ivory ground with several colours suits wood furniture and light sofas, and the dense pattern hides everyday wear.
  care: Vacuum regularly, blot spills straight away with a damp cloth and rotate the rug every few months.
  seoTitle: Classic Ivory Floral Rug in Kuwait | Sajjadko Kuwait
  seoDescription: Ready-made classic rug with a vase, branches and flowers in blue, burgundy and gold on ivory for living rooms and majlis. Priced by size.
