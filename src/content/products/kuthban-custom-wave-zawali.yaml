ar:
  name: زولية تفصيل بحواف متموجة
  directAnswer: زولية تفصيل بشكل حر غير مستطيل، وسطها عاجي تحيط به طبقات متموجة بالبيج والبني الرملي والرمادي. تُقص حوافها وتُحفر طبقاتها يدويًا بالمقاس والشكل الذي تريده. سعر التفصيل حسب المقاس وتعقيد الشكل، ونؤكده عبر واتساب.
  usage: صممناها لمجلس كبير بكنب أبيض مقوّس وطاولات خشبية داكنة وثريا كريستال. تناسب المجالس والصالات التي يُطلب فيها شكل غير مستطيل، ويمكن تفصيلها بألوان أخرى أو بعدد طبقات أقل.
  care: نظّفها بالمكنسة الكهربائية بانتظام، مع العناية بالحواف المحفورة بفوهة ناعمة، وامسح البقع فور وقوعها بقطعة قماش مبللة دون فرك.
  seoTitle: زولية تفصيل بحواف متموجة في الكويت — سجادكو الكويت
  seoDescription: زولية تفصيل بشكل حر وحواف متموجة محفورة بالبيج والبني والرمادي للمجالس. تفصيل زوالي في الكويت، والسعر حسب المقاس عبر واتساب.
  reviewed: true
  faq:
    - q: كم سعر تفصيل زولية بشكل حر وحواف متموجة؟
      a: السعر حسب المقاس وعدد الطبقات وتعقيد الشكل. أرسل مقاس المجلس أو منطقة الجلسة عبر واتساب، ونؤكد لك السعر قبل البدء.
    - q: هل يمكن تفصيل زولية بشكل غير مستطيل؟
      a: نعم، نفصّل الزوالي بأشكال حرة ومتموجة أو دائرية أو بيضاوية حسب تصميم المجلس، ونحفر الطبقات والحواف يدويًا.
    - q: هل يمكن تغيير الألوان؟
      a: نعم، تُختار ألوان الوسط والطبقات من العينات لتناسب الكنب والستائر، مثل الرمادي والذهبي أو درجات البيج.
    - q: هل هذه زولية جاهزة؟
      a: لا، هذه زولية تفصيل تُصنع بالمقاس والشكل والألوان التي تطلبها. ونوفر أيضًا زوالي جاهزة بالمقاسات الشائعة، وزوالي تُقص بالمتر.
    - q: هل الزيارة والقياس مجانًا؟
      a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Custom Rug with Wavy Edges
  directAnswer: This is a free-form custom rug rather than a rectangle, with an ivory centre framed by wavy layers of beige, sand brown and grey. Its edges are cut and its layers hand-carved to the size and shape you want. Custom pricing depends on size and shape complexity; we confirm it on WhatsApp.
  usage: We made it for a large majlis with curved white sofas, dark wood side tables and a crystal chandelier. It suits rooms where a non-rectangular shape is required, and can be made in other colours or with fewer layers.
  care: Vacuum regularly, using a soft nozzle on the carved edges, and blot spills straight away with a damp cloth.
  seoTitle: Custom Rug with Wavy Edges in Kuwait | Sajjadko Kuwait
  seoDescription: Free-form custom rug with hand-carved wavy beige, brown and grey edges for the majlis. Custom rugs in Kuwait, priced by size on WhatsApp.
  reviewed: true
  faq:
    - q: How much does a free-form custom rug with wavy edges cost?
      a: The price depends on size, the number of layers and how complex the shape is. Send your majlis or seating area size on WhatsApp and we confirm the price before we start.
    - q: Can you make rugs in non-rectangular shapes?
      a: Yes. We make free-form, wavy, round or oval rugs to suit the room, with the layers and edges carved by hand.
    - q: Is the home visit and measuring free?
      a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
