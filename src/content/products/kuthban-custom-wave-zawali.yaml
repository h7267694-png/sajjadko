ar:
  name: زولية كثبان المفصلة بحواف متموجة
  directAnswer: كثبان زولية مفصلة بشكل حر لا مستطيل، وسطها عاجي ناعم تحيط به طبقات متموجة بالبيج والبني الرملي والرمادي كأنها كثبان الرمل. تُقص حوافها وتُحفر طبقاتها يدويًا بالمقاس والشكل الذي تريده، فتصبح قطعة فنية في وسط المجلس. سعر التفصيل حسب المقاس وتعقيد الشكل، ونؤكده عبر واتساب.
  usage: صممناها لمجلس كبير بكنب أبيض مقوّس وطاولات خشبية داكنة وثريا كريستال، فجاءت حوافها المتموجة لتكسر استقامة الجدران والكنب. تناسب المجالس والصالات التي تريد فيها زولية مختلفة عن المستطيل المعتاد، ويمكن تفصيلها بألوان أخرى أو بعدد طبقات أقل.
  care: نظّفها بالمكنسة الكهربائية بانتظام، مع العناية بالحواف المحفورة بفوهة ناعمة، وامسح البقع فور وقوعها بقطعة قماش مبللة دون فرك.
  seoTitle: تفصيل زولية بشكل حر وحواف متموجة في الكويت — سجادكو
  seoDescription: زولية كثبان المفصلة بشكل حر وحواف متموجة محفورة بالبيج والبني والرمادي للمجالس. تفصيل زوالي في الكويت، والسعر حسب المقاس عبر واتساب.
  reviewed: true
  faq:
    - q: كم سعر تفصيل زولية بشكل حر مثل كثبان؟
      a: السعر حسب المقاس وعدد الطبقات وتعقيد الشكل. أرسل مقاس المجلس أو منطقة الجلسة عبر واتساب، ونؤكد لك السعر قبل البدء.
    - q: هل يمكن تفصيل زولية بشكل غير مستطيل؟
      a: نعم، نفصّل الزوالي بأشكال حرة ومتموجة أو دائرية أو بيضاوية حسب تصميم المجلس، ونحفر الطبقات والحواف يدويًا.
    - q: هل يمكن تغيير الألوان؟
      a: نعم، تُختار ألوان الوسط والطبقات من العينات لتناسب الكنب والستائر، مثل الرمادي والذهبي أو درجات البيج.
    - q: هل هذه زولية جاهزة؟
      a: لا، كثبان زولية مفصلة تُصنع بالمقاس والشكل والألوان التي تطلبها. ونوفر أيضًا زوالي جاهزة بالمقاسات الشائعة، وزوالي تُقص بالمتر.
en:
  name: Kuthban Free-Form Custom Rug with Wavy Edges
  directAnswer: Kuthban is a free-form custom rug rather than a rectangle, with a soft ivory centre framed by wavy layers of beige, sand brown and grey, like sand dunes. Its edges are cut and its layers hand-carved to the size and shape you want, making it a centrepiece for the majlis. Custom pricing depends on size and shape complexity; we confirm it on WhatsApp.
  usage: We designed it for a large majlis with curved white sofas, dark wood side tables and a crystal chandelier, so the wavy edges soften the straight lines of the walls and seating. It suits rooms where you want something other than the usual rectangle, and can be made in other colours or with fewer layers.
  care: Vacuum regularly, using a soft nozzle on the carved edges, and blot spills straight away with a damp cloth.
  seoTitle: Free-Form Custom Rug with Wavy Edges in Kuwait | Sajjadko
  seoDescription: Kuthban free-form custom rug with hand-carved wavy beige, brown and grey edges for the majlis. Custom rugs in Kuwait, priced by size on WhatsApp.
  reviewed: true
  faq:
    - q: How much does a free-form custom rug like Kuthban cost?
      a: The price depends on size, the number of layers and how complex the shape is. Send your majlis or seating area size on WhatsApp and we confirm the price before we start.
    - q: Can you make rugs in non-rectangular shapes?
      a: Yes. We make free-form, wavy, round or oval rugs to suit the room, with the layers and edges carved by hand.
