ar:
  name: موكيت أرضيات سادة ناعم بالمتر بالرمادي والبيج والبني
  directAnswer: 'موكيت أرضيات سادة بوبر ناعم كثيف بخيوط ملتفة، متوفر في المحل رولات بخمسة ألوان: العاجي، والرمادي الفحمي، والبني الرمادي، والبيج الجملي، والرمادي الفضي. يُباع بالمتر الطولي ويُقص على مقاس الغرفة، من 5 إلى 15 د.ك للمتر الطولي من رول عرضه 4 م حسب السماكة والضغط والكثافة.'
  usage: هذا الموكيت يناسب غرف النوم والصالات والمجالس من الجدار إلى الجدار. الوبر الناعم الملتف يعطي ملمسًا دافئًا تحت القدم، والألوان المحايدة تتناسق مع الأثاث الحديث والخشب والجدران الفاتحة. الرمادي الفحمي والبني الرمادي يخفيان الغبار وآثار الاستعمال أكثر من العاجي.
  care: نظّفه بالمكنسة الكهربائية مرة أو مرتين أسبوعيًا، وامسح البقع فور وقوعها بقطعة قماش مبللة دون فرك. اختلاف درجة اللون قليلًا حسب اتجاه الضوء والوبر أمر طبيعي في الموكيت الناعم.
  seoTitle: موكيت أرضيات سادة ناعم بالمتر في الكويت — سجادكو
  seoDescription: موكيت أرضيات سادة بوبر ناعم كثيف بخمسة ألوان رمادية وبيج وبنية لغرف النوم والصالات والمجالس، يُقص على المقاس من 5 إلى 15 د.ك للمتر الطولي في الكويت.
  reviewed: true
  faq:
    - q: كم سعر موكيت الأرضيات السادة بالمتر؟
      a: من 5 إلى 15 د.ك للمتر الطولي من رول عرضه 4 م حسب السماكة والضغط والكثافة. غرفة 4×5 م تحتاج 5 أمتار طولية، فتكلف بين 25 و75 د.ك قبل التركيب.
    - q: ما الألوان المتوفرة من هذا الموكيت؟
      a: 'خمسة ألوان في المحل: العاجي، والرمادي الفحمي، والبني الرمادي، والبيج الجملي، والرمادي الفضي. أرسل اللون عبر واتساب لنؤكد الكمية المتوفرة.'
    - q: هل يناسب هذا الموكيت غرف النوم؟
      a: نعم، الوبر الناعم الكثيف مريح تحت القدم ويناسب غرف النوم والصالات، والألوان المحايدة تتناسق مع أغلب الأثاث والستائر.
    - q: هل الزيارة والقياس مجانًا؟
      a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Soft Plain Carpet by the Metre in Grey, Beige and Brown
  directAnswer: 'This is a plain wall-to-wall carpet with a soft, dense twisted-yarn pile, stocked in rolls in five colours: ivory, charcoal grey, taupe, camel beige and silver grey. Sold by the running metre and cut to your room at 5 to 15 KWD per running metre of a 4 m wide roll, depending on thickness, pile pressure and density.'
  usage: This carpet suits bedrooms, living rooms and majlis rooms fitted wall to wall. The soft twisted pile feels warm underfoot, and the neutral colours work with modern furniture, wood and light walls. Charcoal and taupe hide dust and wear better than ivory.
  care: Vacuum once or twice a week and blot spills straight away with a damp cloth without rubbing. Slight shading that changes with the light and pile direction is normal in soft carpet.
  seoTitle: Soft Plain Carpet by the Metre in Kuwait | Sajjadko Kuwait
  seoDescription: Soft plain carpet by the metre in five grey, beige and brown colours for bedrooms and living rooms, cut to size at 5 to 15 KWD per running metre in Kuwait.
  reviewed: true
  faq:
    - q: How much is plain carpet per metre?
      a: 5 to 15 KWD per running metre of a 4 m wide roll depending on thickness, pile pressure and density. A 4 × 5 m room needs 5 running metres, about 25 to 75 KWD before fitting.
    - q: Which colours are in stock?
      a: 'Five colours: ivory, charcoal grey, taupe, camel beige and silver grey. Send the colour on WhatsApp and we will confirm the quantity in stock.'
    - q: Is the home visit and measuring free?
      a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
