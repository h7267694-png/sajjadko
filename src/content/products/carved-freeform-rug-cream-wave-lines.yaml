ar:
  name: زولية تفصيل بشكل حر وخطوط محفورة بلون واحد
  directAnswer: زولية تفصيل عاجية بشكل حر غير مستطيل، تقسمها خطوط متموجة محفورة بلون الأرضية نفسه، في ورشتنا قبل التسليم. حولها قوالب الحفر الخشبية التي نرسم بها النقش، وعلى الجدار نماذج من أعمال الحفر. تُفصّل بالمقاس والشكل الذي تريده. السعر حسب المقاس وحجم النقشة، ونؤكده عبر واتساب.
  usage: الشكل الحر يناسب الصالات الحديثة وزوايا الجلوس غير المنتظمة، والحفر بلون واحد يعطي ملمسًا دون ألوان.
  care: نظّفه بالمكنسة الكهربائية بانتظام في اتجاه الوبر، وامسح البقع فور وقوعها دون فرك حتى تبقى حواف الحفر واضحة.
  seoTitle: زولية تفصيل بشكل حر وخطوط محفورة بلون واحد في الكويت — سجادكو
  seoDescription: زولية تفصيل بشكل حر وخطوط محفورة بلون واحد، حفر يدوي في ورشتنا بالنقشة والألوان التي تختارها، للصالات والمجالس والديوانيات في الكويت. السعر حسب المقاس.
  reviewed: true
  faq:
    - q: كم سعره؟
      a: السعر حسب المقاس وحجم النقشة وعدد ألوانها. أرسل صورة النقشة والمقاس عبر واتساب ونرسل لك السعر قبل البدء.
    - q: هل أستطيع تغيير النقشة أو الألوان؟
      a: نعم، ننفذ النقشة نفسها بألوانك، أو نحفر نقشة ترسلها أنت، ونؤكد معك الرسم والألوان قبل البدء.
    - q: هل الزيارة والقياس مجانًا؟
      a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Free-Form Custom Rug with Tone-on-Tone Carved Lines
  directAnswer: An ivory free-form custom rug divided by wavy lines carved tone-on-tone, in our workshop before delivery, surrounded by the wooden stencils we draw designs with and carved samples on the wall. Made to the size and shape you want. Priced by size and design; we confirm on WhatsApp.
  usage: The free form suits modern living rooms and irregular seating; tone-on-tone carving adds texture without colour.
  care: Vacuum regularly along the pile and blot spills straight away without rubbing so the carved edges stay crisp.
  seoTitle: Free-Form Custom Rug with Tone-on-Tone Carved Lines | Sajjadko Kuwait
  seoDescription: Free-Form Custom Rug with Tone-on-Tone Carved Lines, hand-carved in our workshop in your design and colours for living rooms, majlis and diwaniya in Kuwait.
  reviewed: true
  faq:
    - q: How much is it?
      a: Priced by size, design size and number of colours. Send the design and size on WhatsApp for a price before we start.
    - q: Can I change the design or colours?
      a: Yes. We make this design in your colours or carve a design you send, and confirm the drawing and colours before starting.
    - q: Is the home visit and measuring free?
      a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
