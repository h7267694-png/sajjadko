ar:
  name: سجاد مكاتب مزيج بألوان سادة، تشكيلة رولات جديدة
  directAnswer: وصلت تشكيلة جديدة من سجاد المكاتب بخيوط مزيجة تعطي السطح لونًا متدرجًا يخفي الغبار وآثار المشي، بألوان فحمي ورمادي وبيج وجملي وعسلي وأزرق. وبره منخفض متماسك يتحمل كثرة المشي وعجلات الكراسي، ويُقص بالمتر للمكاتب والدرج والممرات. السعر من 1.250 إلى 3 د.ك للمتر المربع حسب السماكة.
  usage: يُقص من الرول على مقاس المكتب أو الممر، أو على مقاس كل درجة. الألوان الرمادية والفحمية تناسب المكاتب وممرات الشركات، والبيج والجملي يناسبان الدرج وممرات البيوت.
  care: نظّفه بالمكنسة الكهربائية بانتظام، وامسح البقع فور وقوعها بقطعة قماش مبللة دون فرك.
  seoTitle: سجاد مكاتب بالمتر، تشكيلة جديدة للمكاتب والدرج والممرات بالكويت
  seoDescription: تشكيلة جديدة من سجاد المكاتب بخيوط مزيجة بالرمادي والفحمي والبيج والجملي والعسلي والأزرق، تُقص بالمتر للمكاتب والدرج والممرات في الكويت. من 1.250 د.ك.
  reviewed: true
  faq:
  - q: كم سعر المتر؟
    a: من 1.250 إلى 3 د.ك للمتر المربع حسب السماكة. اضرب مساحة المكان في سعر المتر لتعرف الكلفة التقريبية، وأجرة التركيب منفصلة حسب المساحة والموقع.
  - q: هل يصلح للدرج؟
    a: نعم، يُقص على مقاس كل درجة ويغطي سطحها وقائمتها، ووبره المنخفض المتماسك يتحمل المشي اليومي على الدرج.
  - q: هل يتحمل كراسي المكاتب؟
    a: نعم، الوبر المنخفض المتماسك يتحمل كثرة المشي وعجلات الكراسي، والخيوط المزيجة تخفي آثار الاستعمال.
  - q: هل الزيارة والقياس مجانًا؟
    a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Blended Office Carpet by the Metre, New Roll Collection
  directAnswer: A new collection of office carpet in a blended yarn that gives a mottled colour hiding dust and footprints, in charcoal, grey, beige, camel, honey and blue. The low, dense pile takes heavy foot traffic and chair castors, and it is cut by the metre for offices, stairs and hallways. From 1.250 to 3 KWD per m² by thickness.
  usage: Cut from the roll to fit an office or hallway, or to each stair. Greys and charcoal suit offices and corridors; beige and camel suit stairs and home hallways.
  care: Vacuum regularly and blot spills straight away with a damp cloth without rubbing.
  seoTitle: Office Carpet by the Metre, New Collection | Sajjadko Kuwait
  seoDescription: New blended office carpet in grey, charcoal, beige, camel, honey and blue, cut by the metre for offices, stairs and hallways in Kuwait. From 1.250 KWD per m².
  reviewed: true
  faq:
  - q: How much is it per metre?
    a: From 1.250 to 3 KWD per m² by thickness. Multiply the area by the price per m² for an estimate; installation is agreed separately by area and location.
  - q: Does it work on stairs?
    a: Yes. It is cut to each stair to cover the tread and riser, and the low, dense pile takes daily foot traffic.
  - q: Will it take office chairs?
    a: Yes. The low, dense pile takes heavy traffic and chair castors, and the blended yarn hides wear.
  - q: Is the home visit and measuring free?
    a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
