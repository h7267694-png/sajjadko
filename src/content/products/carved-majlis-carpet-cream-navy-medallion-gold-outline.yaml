ar:
  name: سجاد حفر يدوي كريمي بصرة كحلية بإطار ذهبي
  directAnswer: سجاد حفر يدوي بأرضية كريمية، تتوسطه صرة كبيرة بخطوط كحلية ملتفة ولمسات ذهبية، يحيط بها إطار ذهبي متموج. محفور يدويًا، ويُفصّل بالمقاس والألوان، والسعر حسب المواصفات عبر واتساب.
  usage: الكحلي والذهبي على الكريمي يناسبان المجالس والديوانيات ذات الطابع الكلاسيكي.
  care: نظّفه بالمكنسة الكهربائية بانتظام في اتجاه الوبر، وامسح البقع فور وقوعها دون فرك حتى تبقى حواف الحفر واضحة.
  seoTitle: سجاد مجلس حفر يدوي كريمي بصرة كحلية — حفر يدوي بالكويت
  seoDescription: سجاد حفر يدوي كريمي تتوسطه صرة كبيرة بخطوط كحلية ملتفة وإطار ذهبي، تفصيل سجاد للمجالس والديوانيات في الكويت.
  reviewed: true
  faq:
  - q: كم سعره؟
    a: السعر حسب المقاس وحجم النقشة وعدد ألوانها والمواصفات التي تختارها. أرسل المقاس عبر واتساب ونرسل لك السعر قبل البدء.
  - q: هل أستطيع تغيير النقشة أو الألوان؟
    a: نعم، ننفذ النقشة نفسها بألوانك أو بمقاس مختلف، أو نحفر نقشة ترسلها أنت، ونؤكد معك الرسم والألوان قبل البدء.
  - q: هل الزيارة والقياس مجانًا؟
    a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Cream Hand-Carved Majlis Carpet with a Navy Medallion
  directAnswer: A hand-carved carpet with a cream ground and a large centre medallion of navy scrolls with gold touches, surrounded by a wavy gold outline. Carved by hand and made to your size and colours; priced by specification on WhatsApp.
  usage: Navy and gold on cream suit majlis rooms and diwaniyas with a classic look.
  care: Vacuum regularly along the pile and blot spills straight away without rubbing so the carved edges stay crisp.
  seoTitle: Cream Hand-Carved Majlis Carpet, Navy Medallion | Sajjadko
  seoDescription: Cream hand-carved carpet with a large navy scroll medallion and gold outline, made to size for majlis rooms and diwaniyas in Kuwait.
  reviewed: true
  faq:
  - q: How much is it?
    a: Priced by size, design size, number of colours and the specification you choose. Send the size on WhatsApp for a price before we start.
  - q: Can I change the design or colours?
    a: Yes. We make this design in your colours or size, or carve a design you send, and confirm the drawing and colours before starting.
  - q: Is the home visit and measuring free?
    a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
