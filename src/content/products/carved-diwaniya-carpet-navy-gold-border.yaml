ar:
  name: موكيت ديوانية محفور بإطار كحلي وذهبي
  directAnswer: موكيت كريمي مركّب من الجدار للجدار في ديوانية طويلة، بإطار من خطين كحليين بينهما ضفيرة ذهبية متصلة، وزخرفتين دائريتين كحلي وذهبي في الوسط، ونقوش ركنية عند الأطراف. الحفر يدوي على مقاس القاعة. نركّبه من الجدار للجدار ونقصه على مقاس المكان. السعر حسب المقاس وحجم النقشة، ونؤكده عبر واتساب.
  usage: الإطار يتبع امتداد القاعة فيحدد مكان الكراسي، والكحلي والذهبي يتناسقان مع الأثاث المذهب.
  care: نظّفه بالمكنسة الكهربائية بانتظام في اتجاه الوبر، وامسح البقع فور وقوعها دون فرك حتى تبقى حواف الحفر واضحة.
  seoTitle: موكيت ديوانية محفور بإطار كحلي وذهبي في الكويت — سجادكو
  seoDescription: موكيت ديوانية محفور بإطار كحلي وذهبي، حفر يدوي في ورشتنا بالنقشة والألوان التي تختارها، للصالات والمجالس والديوانيات في الكويت. السعر حسب المقاس.
  reviewed: true
  faq:
    - q: كم سعره؟
      a: السعر حسب مساحة المكان وحجم النقشة وعدد ألوانها. أرسل صورة النقشة والمقاس عبر واتساب ونرسل لك السعر قبل البدء.
    - q: هل أستطيع تغيير النقشة أو الألوان؟
      a: نعم، ننفذ النقشة نفسها بألوانك، أو نحفر نقشة ترسلها أنت، ونؤكد معك الرسم والألوان قبل البدء.
    - q: هل الزيارة والقياس مجانًا؟
      a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Carved Diwaniya Carpet with a Navy and Gold Border
  directAnswer: Cream carpet fitted wall to wall in a long diwaniya, with a border of two navy lines enclosing a continuous gold braid, two navy and gold medallions in the centre and corner scrolls. Hand-carved to the hall size. We fit it wall to wall, cut to your room. Priced by size and design; we confirm on WhatsApp.
  usage: The border follows the hall and frames the seating; navy and gold suit gilded furniture.
  care: Vacuum regularly along the pile and blot spills straight away without rubbing so the carved edges stay crisp.
  seoTitle: Carved Diwaniya Carpet with a Navy and Gold Border | Sajjadko Kuwait
  seoDescription: Carved Diwaniya Carpet with a Navy and Gold Border, hand-carved in our workshop in your design and colours for living rooms, majlis and diwaniya in Kuwait.
  reviewed: true
  faq:
    - q: How much is it?
      a: Priced by area, design size and number of colours. Send the design and size on WhatsApp for a price before we start.
    - q: Can I change the design or colours?
      a: Yes. We make this design in your colours or carve a design you send, and confirm the drawing and colours before starting.
    - q: Is the home visit and measuring free?
      a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
