ar:
  name: سجاد مشجر بنقش خطوط متداخلة بسبعة ألوان
  directAnswer: سجاد مشجر بنقش خطوط قصيرة متداخلة تشكّل مربعات متدرجة، بسبعة ألوان من العاجي والكريمي إلى الرمادي الداكن والبني الرمادي، بأرضية ناعمة ونقش بارز محفور. يناسب الصالات والمجالس وغرف النوم. يُباع بالمتر المربع ويُقص على مقاس المكان أو زولية بالمقاس الذي تريده، والسعر من 5 إلى 15 د.ك للمتر المربع حسب السماكة والضغط والكثافة.
  usage: النقش الخطي المتداخل هادئ ويعطي الأرضية ملمسًا واضحًا دون ألوان كثيرة، فيناسب الصالات والمجالس الحديثة. الألوان الباهتة المتدرجة تخفي آثار الاستعمال اليومي.
  care: نظّفه بالمكنسة الكهربائية بانتظام باتجاه الوبر، وامسح البقع فور وقوعها بقطعة قماش مبللة دون فرك.
  seoTitle: سجاد مشجر بنقش خطوط متداخلة بالمتر في الكويت — سجادكو
  seoDescription: سجاد مشجر بنقش خطوط متداخلة بسبعة ألوان للصالات والمجالس وغرف النوم، بالمتر أو زولية بالمقاس، من 5 إلى 15 د.ك للمتر المربع.
  reviewed: true
  faq:
    - q: كم سعر هذا السجاد المشجر بالمتر؟
      a: من 5 إلى 15 د.ك للمتر المربع حسب السماكة والضغط والكثافة. غرفة 4×5 م (20 م²) تكلف بين 100 و300 د.ك قبل التركيب. ونؤكد السعر النهائي عبر واتساب.
    - q: هل يُقص على مقاس غرفتي أو كزولية؟
      a: نعم، يُقص بالمتر على مقاس الغرفة من الجدار إلى الجدار، أو قطعة بمقاس منطقة الجلسة تُستخدم زولية. نراجع المقاس معك قبل القص.
    - q: أي لون أنسب للصالة كثيرة الاستعمال؟
      a: الرمادي الداكن والبني الرمادي يخفيان آثار المشي أكثر من العاجي والأبيض.
en:
  name: Patterned Carpet with a Linear Texture in Seven Colours
  directAnswer: This is a patterned carpet with short interlocking lines forming stepped squares, in seven colours from ivory and cream to dark grey and taupe, with a soft ground and a raised carved design. It suits living rooms, majlis rooms and bedrooms. Sold by the m² and cut to your room, or made as a rug to the size you want, at 5 to 15 KWD per m² (0.465 to 1.394 KWD per sq ft) depending on thickness, pile pressure and density.
  usage: The interlocking line texture is quiet and gives the floor a clear feel without many colours, suiting modern living rooms and majlis rooms. The faded, graded tones hide everyday wear.
  care: Vacuum regularly in the direction of the pile, and blot spills straight away with a damp cloth without rubbing.
  seoTitle: Patterned Carpet with a Linear Texture in Kuwait | Sajjadko
  seoDescription: Patterned carpet with a linear texture in seven colours for living rooms, majlis and bedrooms, by the m² or as a rug, 5 to 15 KWD per m².
  reviewed: true
  faq:
    - q: How much is this patterned carpet per m²?
      a: 5 to 15 KWD per m² depending on thickness, pile pressure and density. A 4 × 5 m (20 m²) room costs about 100 to 300 KWD before installation.
    - q: Can it be cut to my room or made as a rug?
      a: Yes. It is cut by the metre to fit the room wall to wall, or cut to the size of your seating area as a rug. We confirm measurements with you before cutting.
    - q: Which colour suits a busy living room?
      a: Dark grey and taupe hide foot traffic better than ivory and white.
