ar:
  name: موكيت تركي سميك بملمس حريري — مسطرة ويندهام 12 لونًا
  directAnswer: موكيت تركي سميك بوبر كثيف وملمس حريري ناعم، من مسطرة ويندهام صنع تركيا، باثني عشر لونًا مميزًا بين الأبيض والبيج والرمادي والبني العسلي والأخضر الزيتوني. يُقص من رول عرضه 4 م على مقاس الغرفة من الجدار إلى الجدار، بسعر 17 د.ك للمتر الطولي، أي 4.250 د.ك للمتر المربع.
  usage: السماكة العالية تعطي جلسة دافئة ومريحة وتخفف صوت الخطوات، والملمس الحريري يناسب غرف النوم والصالات والمجالس والديوانيات.
  care: نظّفه بالمكنسة الكهربائية بانتظام، وامسح البقع فور وقوعها بقطعة قماش مبللة دون فرك.
  seoTitle: موكيت تركي سميك بملمس حريري — 17 د.ك للمتر | سجادكو
  seoDescription: موكيت تركي سميك بملمس حريري من مسطرة ويندهام بـ12 لونًا، يُقص على مقاس غرفتك بسعر 17 د.ك للمتر الطولي (4.250 د.ك للمتر المربع)، مع زيارة وقياس مجاني في الكويت.
  reviewed: true
  faq:
    - q: كم سعر موكيت ويندهام بالمتر؟
      a: 17 د.ك للمتر الطولي من رول عرضه 4 م، أي 4.250 د.ك للمتر المربع. غرفة 4×5 م تحتاج 5 أمتار طولية، أي 85 د.ك قبل التركيب. نرسل لك السعر الإجمالي عبر واتساب بعد القياس.
    - q: ما الألوان المتوفرة؟
      a: اثنا عشر لونًا بأرقامها في المسطرة، منها الأبيض 8812 والكريمي 8807 والرمادي الفضي 8219 والرمادي الغامق 119 والبني العسلي 126 والأخضر الزيتوني 8810. أرسل رقم اللون والمقاس عبر واتساب لنؤكد الكمية.
    - q: ما الفرق بينه وبين الموكيت الخفيف؟
      a: ويندهام موكيت سميك بوبر كثيف وملمس حريري، أنعم وأدفأ تحت القدم ويخفف الصوت أكثر من الموكيت الخفيف، ولذلك سعره أعلى.
    - q: هل الزيارة والقياس مجانًا؟
      a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Thick Silk-Touch Turkish Carpet, Wyndham Range in 12 Colours
  directAnswer: Thick Turkish wall-to-wall carpet with dense pile and a soft silky touch, from the Wyndham range made in Türkiye, in twelve distinctive colours from white, beige and grey to honey brown and olive green. Cut from a 4 m wide roll to fit your room wall to wall, at 17 KWD per running metre, which is 4.250 KWD per m².
  usage: The high pile feels warm and comfortable and softens footsteps, and the silky touch suits bedrooms, living rooms, majlis and diwaniya rooms.
  care: Vacuum regularly and blot spills straight away with a damp cloth.
  seoTitle: Thick Silk-Touch Turkish Carpet, Kuwait | Sajjadko
  seoDescription: Thick silk-touch Turkish carpet from the Wyndham range in 12 colours, cut to your room at 17 KWD per running metre (4.250 KWD per m²), free home visit in Kuwait.
  reviewed: true
  faq:
    - q: How much is Wyndham carpet per metre?
      a: 17 KWD per running metre of a 4 m wide roll, which is 4.250 KWD per m². A 4 × 5 m room needs 5 running metres, about 85 KWD before fitting.
    - q: Which colours are available?
      a: Twelve colours by number on the sample board, including white 8812, cream 8807, silver grey 8219, dark grey 119, honey brown 126 and olive green 8810.
    - q: Is the home visit and measuring free?
      a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
