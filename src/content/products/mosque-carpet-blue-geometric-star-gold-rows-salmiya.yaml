ar:
  name: سجاد مسجد أزرق بنقشة نجوم هندسية وفواصل صفوف ذهبية
  directAnswer: سجاد مساجد بصفوف بأرضية زرقاء تملؤها نقشة نجوم وأشكال هندسية إسلامية بخطوط كحلية رفيعة، وبين كل صف وآخر فاصل عريض بالذهبي والبني بزخرفة نجوم متكررة. ركّبناه في مسجد بمنطقة السالمية، والسعر 6 أو 7 أو 8 د.ك للمتر المربع حسب السماكة، مع القياس ومحاذاة الصفوف مع القبلة والتركيب.
  usage: في مسجد السالمية قصصنا الصفوف ورتبناها محاذية لاتجاه القبلة بطول قاعة الصلاة، فيحدد الفاصل الذهبي مكان كل صف. الأزرق مع الجدران الفاتحة يعطي القاعة هدوءًا، والنقشة الهندسية الكثيفة تخفي آثار الاستعمال اليومي.
  care: نظّفه بالمكنسة الكهربائية بانتظام باتجاه الصفوف، وامسح البقع فور وقوعها بقطعة قماش مبللة دون فرك.
  seoTitle: سجاد مساجد أزرق بنقشة هندسية إسلامية في السالمية — سجادكو
  seoDescription: فرش مسجد في السالمية بسجاد صفوف أزرق بنقشة نجوم هندسية إسلامية وفواصل صفوف ذهبية محاذية للقبلة. 6 إلى 8 د.ك للمتر المربع مع القص والتركيب.
  reviewed: true
  faq:
  - q: كم سعر هذا السجاد للمسجد؟
    a: 6 د.ك للخفيف و7 للوسط و8 للسميك للمتر المربع. قاعة 180 م² تكلف بين 1,080 و1,440 د.ك قبل التركيب.
  - q: هل تحاذون الصفوف مع القبلة؟
    a: نعم، نحدد اتجاه القبلة عند القياس، ونقص الصفوف ونركّبها محاذية لها كما في مسجد السالمية.
  - q: كم صفًا تحتاج القاعة؟
    a: عرض الصف 1.33 م تقريبًا، فعدد الصفوف = عمق القاعة باتجاه القبلة ÷ 1.33. نحسبها لك بدقة بعد القياس.
  - q: هل الزيارة والقياس مجانًا؟
    a: نعم، مندوبنا يزور الموقع مجانًا للقياس وعرض العينات، ثم نرسل السعر عبر واتساب قبل أي التزام.
en:
  name: Blue Geometric Star Mosque Carpet with Gold Row Borders
  directAnswer: Mosque carpet in prayer rows with a blue ground covered in an Islamic geometric star pattern in fine navy lines, and a wide gold and brown border with repeating stars between rows. We installed it in a mosque in Salmiya. 6, 7 or 8 KWD per m² by thickness, with measuring, qibla alignment and installation.
  usage: In the Salmiya mosque we cut the rows and laid them aligned with the qibla along the prayer hall, with the gold border marking each row. Blue with light walls keeps the hall calm, and the dense geometric pattern hides daily wear.
  care: Vacuum regularly along the rows and blot spills straight away with a damp cloth.
  seoTitle: Blue Geometric Mosque Carpet, Salmiya | Sajjadko Kuwait
  seoDescription: Blue mosque carpet rows with an Islamic geometric star pattern and gold row borders, installed in Salmiya. 6 to 8 KWD per m² with qibla alignment.
  reviewed: true
  faq:
  - q: How much is this mosque carpet?
    a: 6, 7 or 8 KWD per m² by thickness. A 180 m² hall costs about 1,080 to 1,440 KWD before installation.
  - q: Do you align the rows with the qibla?
    a: Yes. We set the qibla direction when measuring, then cut and fit the rows aligned with it, as in the Salmiya mosque.
  - q: Is the home visit and measuring free?
    a: Yes. Our representative visits the site free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
