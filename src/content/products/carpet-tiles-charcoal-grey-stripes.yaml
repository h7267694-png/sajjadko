ar:
  name: بلاط سجاد 40×40 فحمي مخطط بإطار رمادي
  directAnswer: بلاط سجاد 40×40 سم بخطوط رفيعة بالفحمي، يُركّب باتجاهات متبادلة، مع إطار من البلاط الرمادي الفاتح المخطط يحدد منطقة داخل الغرفة. يُباع بالمتر المربع من 5 إلى 6 د.ك.
  usage: الفحمي يخفي آثار المشي وعجلات الكراسي، والإطار الفاتح يحدد مكان طاولة الاجتماعات أو المكتب الرئيسي.
  care: نظّفه بالمكنسة الكهربائية بانتظام، وامسح البقع فور وقوعها بقطعة قماش مبللة. البلاطة التي يتعذر تنظيفها تُرفع وتُبدل بأخرى من الطلبية نفسها.
  seoTitle: بلاط سجاد 40×40 فحمي مخطط للمكاتب — سجادكو
  seoDescription: بلاط سجاد مكاتب 40×40 فحمي مخطط بإطار رمادي فاتح، من 5 إلى 6 د.ك للمتر المربع في الكويت.
  reviewed: true
  faq:
    - q: كم سعر بلاط السجاد بالمتر؟
      a: من 5 إلى 6 د.ك للمتر المربع، والمتر فيه 6.25 بلاطة. مكتب 50 م² يحتاج نحو 313 بلاطة بكلفة بين 250 و300 د.ك قبل التركيب.
    - q: هل يمكن تبديل بلاطة واحدة؟
      a: نعم، البلاطة التالفة تُرفع وتوضع مكانها بلاطة جديدة دون المساس بالباقي، لذلك ننصح بالاحتفاظ ببضع بلاطات احتياطية.
    - q: هل الزيارة والقياس مجانًا؟
      a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Striped Charcoal 40×40 Carpet Tiles with a Grey Frame
  directAnswer: 40×40 cm carpet tiles with fine charcoal stripes laid in alternating directions, with a frame of striped light grey tiles marking an area in the room. 5 to 6 KWD per m².
  usage: Charcoal hides footprints and chair wheels; the light frame marks the meeting table or main desk.
  care: Vacuum regularly and blot spills straight away with a damp cloth. A tile that will not come clean is lifted and replaced with one from the same batch.
  seoTitle: Striped Charcoal 40×40 Carpet Tiles in Kuwait | Sajjadko
  seoDescription: Striped charcoal 40×40 office carpet tiles with a light grey frame, 5 to 6 KWD per m² in Kuwait.
  reviewed: true
  faq:
    - q: How much are carpet tiles per m²?
      a: 5 to 6 KWD per m², with 6.25 tiles per m². A 50 m² office needs about 313 tiles, 250 to 300 KWD before fitting.
    - q: Is the home visit and measuring free?
      a: Yes. We visit free of charge to measure and show samples, then send the price on WhatsApp.
