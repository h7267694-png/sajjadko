ar:
  name: فرش زوالي للمناسبات والجلسات الخارجية
  directAnswer: نفرش ساحات المناسبات والحدائق والخيام بزوالي حمراء كلاسيكية متلاصقة تغطي المكان كله، وتوضع حولها الكراسي والكنب. يناسب الأعراس والملكة والاستقبالات والغبقات والجلسات الخارجية. التأجير شامل التوصيل والفرش والرفع بعد المناسبة، ونؤكد السعر حسب المساحة وعدد الزوالي عبر واتساب.
  usage: الزوالي المتلاصقة تحوّل العشب أو الساحة إلى مجلس مفروش، وتُرتب الكراسي على أطرافها. وفي المناسبات الليلية تعطي الساحة مظهر المجلس التقليدي.
  care: في التأجير نفك الفرش ونأخذه بعد المناسبة. وفي الشراء نظّفه بالمكنسة الكهربائية وخزّنه ملفوفًا في مكان جاف.
  seoTitle: تأجير زوالي وفرش مناسبات خارجية في الكويت — سجادكو
  seoDescription: تأجير فرش زوالي حمراء للأعراس والاستقبالات والغبقات والجلسات الخارجية في الكويت، شامل الفرش والرفع.
  reviewed: true
  faq:
    - q: كم سعر تأجير فرش المناسبات؟
      a: السعر حسب مساحة المكان وعدد الزوالي ومدة المناسبة. أرسل التاريخ والمكان والمساحة التقريبية عبر واتساب ونرسل السعر.
    - q: هل تفرشون على العشب والحدائق؟
      a: نعم، نفرش على العشب والساحات والخيام، ونرفع الفرش بعد المناسبة.
    - q: هل تزورون المكان قبل المناسبة؟
      a: نعم، نزور المكان مجانًا للقياس عند الحاجة، أو نقدّر المساحة من الصور والمقاسات التي ترسلها عبر واتساب.
en:
  name: Event Rugs for Outdoor Weddings and Gatherings
  directAnswer: We cover event courtyards, gardens and tents with red classic rugs laid edge to edge, with chairs and sofas around them. Suits weddings, receptions, Ramadan gatherings and outdoor seating. Rental includes delivery, laying and removal; price by area and number of rugs, confirmed on WhatsApp.
  usage: Rugs laid edge to edge turn grass or a courtyard into a furnished majlis, with chairs along the edges.
  care: For rentals we lift and take the carpet away after the event. If you buy, vacuum it and store it rolled in a dry place.
  seoTitle: Event Rug Rental for Outdoor Gatherings in Kuwait | Sajjadko
  seoDescription: Red event rug rental for weddings, receptions and outdoor gatherings in Kuwait, with laying and removal.
  reviewed: true
  faq:
    - q: How much is event rug rental?
      a: Priced by area, number of rugs and event length. Send the date, venue and area on WhatsApp.
    - q: Do you visit the venue first?
      a: Yes, we visit free of charge to measure when needed, or estimate the area from photos and sizes you send on WhatsApp.
