ar:
  name: سجاد حفر يدوي كريمي بصرة بنية مفرغة
  directAnswer: سجاد حفر يدوي بأرضية كريمية لامعة، تتوسطه صرة كبيرة مثمّنة بخطوط بنية ملتفة ومفرغة محفورة يدويًا. تصميمه هادئ بلونين، ويُفصّل بالمقاس والألوان التي تختارها، والسعر حسب المواصفات عبر واتساب.
  usage: الصرة الكبيرة تملأ وسط الصالة أو المجلس، واللونان الكريمي والبني يناسبان الأثاث الفاتح.
  care: نظّفه بالمكنسة الكهربائية بانتظام في اتجاه الوبر، وامسح البقع فور وقوعها دون فرك حتى تبقى حواف الحفر واضحة.
  seoTitle: سجاد حفر يدوي كريمي بصرة بنية مفرغة — حفر يدوي بالكويت
  seoDescription: سجاد حفر يدوي كريمي لامع بصرة مثمّنة كبيرة بخطوط بنية مفرغة، تفصيل سجاد بالمقاس والألوان للصالات والمجالس في الكويت.
  reviewed: true
  faq:
  - q: كم سعره؟
    a: السعر حسب المقاس وحجم النقشة وعدد ألوانها والمواصفات التي تختارها. أرسل المقاس عبر واتساب ونرسل لك السعر قبل البدء.
  - q: هل أستطيع تغيير النقشة أو الألوان؟
    a: نعم، ننفذ النقشة نفسها بألوانك أو بمقاس مختلف، أو نحفر نقشة ترسلها أنت، ونؤكد معك الرسم والألوان قبل البدء.
  - q: هل الزيارة والقياس مجانًا؟
    a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Cream Hand-Carved Rug with a Brown Openwork Medallion
  directAnswer: A hand-carved rug with a glossy cream ground and a large octagonal centre medallion of brown openwork scrolls, carved by hand. A calm two-colour design made to your size and colours; priced by specification on WhatsApp.
  usage: The large medallion fills the centre of a living room or majlis, and cream with brown suits light furniture.
  care: Vacuum regularly along the pile and blot spills straight away without rubbing so the carved edges stay crisp.
  seoTitle: Cream Hand-Carved Rug, Brown Openwork Medallion | Sajjadko
  seoDescription: Glossy cream hand-carved rug with a large octagonal brown openwork medallion, made to your size and colours in Kuwait.
  reviewed: true
  faq:
  - q: How much is it?
    a: Priced by size, design size, number of colours and the specification you choose. Send the size on WhatsApp for a price before we start.
  - q: Can I change the design or colours?
    a: Yes. We make this design in your colours or size, or carve a design you send, and confirm the drawing and colours before starting.
  - q: Is the home visit and measuring free?
    a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
