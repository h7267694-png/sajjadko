  name: سجاد مشجر بالمتر بنقش دمشقي بيج وأبيض
  directAnswer: سجاد مشجر بالمتر بأرضية بيج ونقش دمشقي متكرر من الأغصان والزهور بالأبيض مع تفاصيل بنية، بحفر بارز. يُقص من الرول على مقاس الغرفة من الجدار إلى الجدار أو كزولية، بسعر 16 د.ك للمتر الطولي من رول عرضه 4 م.
  usage: النقش المتداخل يخفي الغبار وآثار الاستعمال، ويناسب الصالات والمجالس والديوانيات وغرف النوم والممرات.
