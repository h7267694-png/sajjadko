  seoTitle: سجاد مشجر بالمتر دمشقي بيج — 16 د.ك للمتر | سجادكو
  seoDescription: سجاد مشجر بالمتر بنقش دمشقي بيج وأبيض للصالات والمجالس وغرف النوم، يُقص على مقاس غرفتك بسعر 16 د.ك للمتر الطولي، مع زيارة وقياس مجاني في الكويت.
  reviewed: true
  faq:
    - q: كم سعر هذا السجاد بالمتر؟
      a: 16 د.ك للمتر الطولي من رول عرضه 4 م. صالة 4×5 م تحتاج 5 أمتار طولية، أي 80 د.ك قبل التركيب. نرسل لك السعر الإجمالي عبر واتساب بعد القياس.
    - q: هل يُقص على مقاس غرفتي أو كزولية؟
      a: نعم، يُقص بالمتر من الرول على مقاس الغرفة من الجدار إلى الجدار، أو قطعة بمقاس منطقة الجلسة تُستخدم زولية. نراجع المقاس معك قبل القص.
    - q: هل الزيارة والقياس مجانًا؟
      a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Patterned Carpet by the Metre, Damask Design in Beige and White
  directAnswer: Patterned carpet by the metre with a beige ground with a repeating damask pattern of scrolls and flowers in white with brown details, raised by carving. Cut from the roll to fit your room wall to wall or as a rug, at 16 KWD per running metre of a 4 m wide roll.
  usage: The interlocking pattern hides dust and wear and suits living rooms, majlis and diwaniya rooms, bedrooms and hallways.
  care: Vacuum regularly and blot spills straight away with a damp cloth.
  seoTitle: Beige Damask Carpet by the Metre, Kuwait | Sajjadko
  seoDescription: Beige and white damask carpet by the metre, cut to your room at 16 KWD per running metre, free home visit in Kuwait.
  reviewed: true
  faq:
    - q: How much is this carpet per metre?
      a: 16 KWD per running metre of a 4 m wide roll. A 4 × 5 m room needs 5 running metres, about 80 KWD before fitting. We send the total on WhatsApp after measuring.
    - q: Can it be cut to my room or as a rug?
      a: Yes. It is cut from the roll by the metre to fit the room wall to wall, or to the size of your seating area as a rug. We confirm measurements before cutting.
    - q: Is the home visit and measuring free?
      a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
