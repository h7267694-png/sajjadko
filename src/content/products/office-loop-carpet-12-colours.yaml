ar:
  name: موكيت مكاتب بوبر حلقي باثني عشر لونًا
  directAnswer: موكيت مكاتب خفيف بوبر حلقي متماسك، باثني عشر لونًا مرقمًا من العاجي والبيج والجملي إلى الأزرق والأحمر والعنابي والبنفسجي والرمادي والفحمي والكحلي. يتحمل كثرة المشي وعجلات الكراسي. يُباع بالمتر المربع من 1.250 إلى 3 د.ك، ويُقص على مقاس المكتب ويُركّب.
  usage: الوبر الحلقي يحافظ على شكله في المكاتب المفتوحة والممرات وقاعات التدريب. الرمادي والفحمي والكحلي تخفي الأثر اليومي، والأحمر والأزرق والبنفسجي تناسب الاستقبال ومساحات الهوية.
  care: نظّفه بالمكنسة الكهربائية بانتظام، وامسح البقع فور وقوعها بقطعة قماش مبللة دون فرك.
  seoTitle: موكيت مكاتب بوبر حلقي باثني عشر لونًا في الكويت — سجادكو
  seoDescription: موكيت مكاتب خفيف بوبر حلقي باثني عشر لونًا مرقمًا للمكاتب والممرات وقاعات التدريب، من 1.250 إلى 3 د.ك للمتر المربع في الكويت.
  reviewed: true
  faq:
    - q: كم سعر هذا الموكيت بالمتر؟
      a: من 1.250 إلى 3 د.ك للمتر المربع. مكتب 100 م² يكلف بين 125 و300 د.ك قبل التركيب.
    - q: كيف أختار اللون؟
      a: أرسل رقم اللون من اللوحة عبر واتساب لنؤكد توفره. الرمادي (50) والفحمي (53) والكحلي الداكن (54) تخفي الأثر في المكاتب كثيرة الحركة.
    - q: هل تركّبونه خارج أوقات الدوام؟
      a: نعم، نتفق معك على الموعد، ويمكن أن يكون خارج أوقات الدوام. أجرة التركيب منفصلة حسب المساحة والموقع.
en:
  name: Loop-Pile Office Carpet in Twelve Colours
  directAnswer: This is a lightweight office carpet with a tight loop pile, in twelve numbered colours from ivory, beige and camel to blue, red, burgundy, purple, grey, charcoal and navy. It stands up to foot traffic and chair castors. Sold by the m² at 1.250 to 3 KWD, cut to your office and installed.
  usage: The loop pile keeps its shape in open-plan offices, corridors and training rooms. Grey, charcoal and navy hide everyday wear; red, blue and purple suit reception and brand areas.
  care: Vacuum regularly and blot spills straight away with a damp cloth without rubbing.
  seoTitle: Loop-Pile Office Carpet in Twelve Colours, Kuwait | Sajjadko
  seoDescription: Lightweight loop-pile office carpet in twelve numbered colours for offices, corridors and training rooms, 1.250 to 3 KWD per m² in Kuwait.
  reviewed: true
  faq:
    - q: How much is this carpet per m²?
      a: 1.250 to 3 KWD per m². A 100 m² office costs about 125 to 300 KWD before installation.
    - q: How do I choose a colour?
      a: Send the colour number from the board on WhatsApp and we confirm stock. Grey (50), charcoal (53) and dark navy (54) hide wear in busy offices.
