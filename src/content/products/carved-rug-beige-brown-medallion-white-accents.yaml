ar:
  name: سجاد حفر يدوي بيج بصرة بنية ولمسات بيضاء
  directAnswer: سجاد حفر يدوي بأرضية بيج، تتوسطه صرة مثمّنة بخطوط بنية ملتفة ولمسات بيضاء صغيرة محفورة يدويًا. يُفصّل بالمقاس والألوان، والسعر حسب المواصفات عبر واتساب.
  usage: الصرة البنية على البيج تناسب المجالس والصالات ذات الأثاث الكريمي أو البني.
  care: نظّفه بالمكنسة الكهربائية بانتظام في اتجاه الوبر، وامسح البقع فور وقوعها دون فرك حتى تبقى حواف الحفر واضحة.
  seoTitle: سجاد حفر يدوي بيج بصرة بنية ولمسات بيضاء — حفر يدوي بالكويت
  seoDescription: سجاد حفر يدوي بيج بصرة مثمّنة بخطوط بنية ملتفة ولمسات بيضاء، تفصيل سجاد للمجالس والصالات في الكويت. السعر حسب المواصفات.
  reviewed: true
  faq:
  - q: كم سعره؟
    a: السعر حسب المقاس وحجم النقشة وعدد ألوانها والمواصفات التي تختارها. أرسل المقاس عبر واتساب ونرسل لك السعر قبل البدء.
  - q: هل أستطيع تغيير النقشة أو الألوان؟
    a: نعم، ننفذ النقشة نفسها بألوانك أو بمقاس مختلف، أو نحفر نقشة ترسلها أنت، ونؤكد معك الرسم والألوان قبل البدء.
  - q: هل الزيارة والقياس مجانًا؟
    a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Beige Hand-Carved Rug with a Brown Medallion and White Accents
  directAnswer: A hand-carved rug with a beige ground and an octagonal centre medallion of brown scrolls with small white accents, carved by hand. Made to your size and colours; priced by specification on WhatsApp.
  usage: The brown medallion on beige suits majlis rooms and living rooms with cream or brown furniture.
  care: Vacuum regularly along the pile and blot spills straight away without rubbing so the carved edges stay crisp.
  seoTitle: Beige Hand-Carved Rug, Brown Medallion | Sajjadko Kuwait
  seoDescription: Beige hand-carved rug with an octagonal brown scroll medallion and white accents, made to size for majlis rooms in Kuwait.
  reviewed: true
  faq:
  - q: How much is it?
    a: Priced by size, design size, number of colours and the specification you choose. Send the size on WhatsApp for a price before we start.
  - q: Can I change the design or colours?
    a: Yes. We make this design in your colours or size, or carve a design you send, and confirm the drawing and colours before starting.
  - q: Is the home visit and measuring free?
    a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
