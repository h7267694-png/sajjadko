ar:
  name: سجاد حفر يدوي كريمي بغصن أوراق بني متدرج
  directAnswer: سجاد حفر يدوي بأرضية كريمية، عليه غصن أوراق كبير بدرجات البني من الفاتح إلى الداكن، محفور يدويًا بمستويات متعددة فيظهر بارزًا. يُفصّل بالمقاس والألوان، والسعر حسب المواصفات عبر واتساب.
  usage: تصميم الغصن الكبير يناسب الصالات وغرف الجلوس ذات الطابع المودرن الهادئ.
  care: نظّفه بالمكنسة الكهربائية بانتظام في اتجاه الوبر، وامسح البقع فور وقوعها دون فرك حتى تبقى حواف الحفر واضحة.
  seoTitle: سجاد حفر يدوي كريمي بغصن أوراق بني — حفر يدوي بالكويت
  seoDescription: سجاد حفر يدوي كريمي بغصن أوراق كبير بدرجات البني محفور بمستويات بارزة، تفصيل سجاد للصالات في الكويت. السعر حسب المواصفات.
  reviewed: true
  faq:
  - q: كم سعره؟
    a: السعر حسب المقاس وحجم النقشة وعدد ألوانها والمواصفات التي تختارها. أرسل المقاس عبر واتساب ونرسل لك السعر قبل البدء.
  - q: هل أستطيع تغيير النقشة أو الألوان؟
    a: نعم، ننفذ النقشة نفسها بألوانك أو بمقاس مختلف، أو نحفر نقشة ترسلها أنت، ونؤكد معك الرسم والألوان قبل البدء.
  - q: هل الزيارة والقياس مجانًا؟
    a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Cream Hand-Carved Rug with a Brown Leaf Branch
  directAnswer: A hand-carved rug with a cream ground and a large leaf branch in shades of brown from light to dark, carved by hand on several levels so it stands out. Made to your size and colours; priced by specification on WhatsApp.
  usage: The large branch design suits living rooms with a calm modern look.
  care: Vacuum regularly along the pile and blot spills straight away without rubbing so the carved edges stay crisp.
  seoTitle: Cream Hand-Carved Rug, Brown Leaf Branch | Sajjadko Kuwait
  seoDescription: Cream hand-carved rug with a large leaf branch in shades of brown carved on raised levels, made to size for living rooms in Kuwait.
  reviewed: true
  faq:
  - q: How much is it?
    a: Priced by size, design size, number of colours and the specification you choose. Send the size on WhatsApp for a price before we start.
  - q: Can I change the design or colours?
    a: Yes. We make this design in your colours or size, or carve a design you send, and confirm the drawing and colours before starting.
  - q: Is the home visit and measuring free?
    a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
