ar:
  name: سجاد مشجر بالمتر محفور بنقش ورد بخمسة ألوان
  directAnswer: سجاد مشجر بالمتر بنقش ورد وأغصان محفور بارز بالأبيض والذهبي والكحلي ولمسات برتقالية، بخمسة ألوان للأرضية، الرمادي الفاتح والبني والكحلي والرمادي الغامق والأوف وايت. يُقص من رول عرضه 4 م على مقاس الغرفة من الجدار إلى الجدار أو كزولية، بسعر 17 د.ك للمتر الطولي، أي 4.250 د.ك للمتر المربع.
  usage: الحفر البارز ونقش الورد يعطيان الغرفة لمسة كلاسيكية دافئة، والنقش المتداخل يخفي الغبار وآثار الاستعمال. يناسب الصالات والمجالس والديوانيات وغرف النوم والممرات.
  care: نظّفه بالمكنسة الكهربائية بانتظام، وامسح البقع فور وقوعها بقطعة قماش مبللة دون فرك.
  seoTitle: سجاد مشجر بالمتر محفور بنقش ورد — 17 د.ك للمتر | سجادكو
  seoDescription: سجاد مشجر بالمتر محفور بنقش ورد بخمسة ألوان، يُقص على مقاس غرفتك أو كزولية بسعر 17 د.ك للمتر الطولي (4.250 د.ك للمتر المربع)، مع زيارة وقياس مجاني في الكويت.
  reviewed: true
  faq:
    - q: كم سعر هذا السجاد بالمتر؟
      a: 17 د.ك للمتر الطولي من رول عرضه 4 م، أي 4.250 د.ك للمتر المربع. صالة 4×5 م تحتاج 5 أمتار طولية، أي 85 د.ك قبل التركيب. نرسل لك السعر الإجمالي عبر واتساب بعد القياس.
    - q: ما الألوان المتوفرة؟
      a: خمسة ألوان للأرضية بنفس نقش الورد، الرمادي الفاتح والبني والكحلي والرمادي الغامق والأوف وايت. أرسل اللون والمقاس عبر واتساب لنؤكد الكمية.
    - q: هل يُقص على مقاس غرفتي أو كزولية؟
      a: نعم، يُقص بالمتر من الرول على مقاس الغرفة من الجدار إلى الجدار، أو قطعة بمقاس منطقة الجلسة تُستخدم زولية. نراجع المقاس معك قبل القص.
    - q: هل الزيارة والقياس مجانًا؟
      a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Carved Floral Patterned Carpet by the Metre in Five Colours
  directAnswer: Patterned carpet by the metre with carved flowers and branches in white, gold and navy with orange touches, in five ground colours, light grey, brown, navy, dark grey and off-white. Cut from a 4 m wide roll to fit your room wall to wall or as a rug, at 17 KWD per running metre, which is 4.250 KWD per m².
  usage: The raised carving and floral design give a warm classic look, and the busy pattern hides dust and wear. Suits living rooms, majlis and diwaniya rooms, bedrooms and hallways.
  care: Vacuum regularly and blot spills straight away with a damp cloth.
  seoTitle: Carved Floral Carpet by the Metre, Kuwait | Sajjadko
  seoDescription: Carved floral carpet by the metre in five colours, cut to your room or as a rug at 17 KWD per running metre (4.250 KWD per m²), free home visit in Kuwait.
  reviewed: true
  faq:
    - q: How much is this carpet per metre?
      a: 17 KWD per running metre of a 4 m wide roll, which is 4.250 KWD per m². A 4 × 5 m room needs 5 running metres, about 85 KWD before fitting.
    - q: Which colours are available?
      a: Five ground colours in the same floral design, light grey, brown, navy, dark grey and off-white.
    - q: Is the home visit and measuring free?
      a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
