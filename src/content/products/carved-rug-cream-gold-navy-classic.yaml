ar:
  name: زولية صالة كلاسيكية محفورة بالذهبي والكحلي
  directAnswer: زولية تفصيل كلاسيكية بوسط كريمي دائري، تحيط به زخارف ملتفة بالذهبي والكحلي والرمادي الفاتح، وإطار متدرج بالكحلي والذهبي. الحفر يدوي بعدة طبقات فتظهر الزخارف بارزة. تُفصّل بالمقاس والشكل الذي تريده. السعر حسب المقاس وحجم النقشة، ونؤكده عبر واتساب.
  usage: تناسب الصالات الكلاسيكية بالأثاث المذهب والمخدات الكحلية.
  care: نظّفه بالمكنسة الكهربائية بانتظام في اتجاه الوبر، وامسح البقع فور وقوعها دون فرك حتى تبقى حواف الحفر واضحة.
  seoTitle: زولية صالة كلاسيكية محفورة بالذهبي والكحلي في الكويت — سجادكو
  seoDescription: زولية صالة كلاسيكية محفورة بالذهبي والكحلي، حفر يدوي في ورشتنا بالنقشة والألوان التي تختارها، للصالات والمجالس والديوانيات في الكويت. السعر حسب المقاس.
  reviewed: true
  faq:
    - q: كم سعره؟
      a: السعر حسب المقاس وحجم النقشة وعدد ألوانها. أرسل صورة النقشة والمقاس عبر واتساب ونرسل لك السعر قبل البدء.
    - q: هل أستطيع تغيير النقشة أو الألوان؟
      a: نعم، ننفذ النقشة نفسها بألوانك، أو نحفر نقشة ترسلها أنت، ونؤكد معك الرسم والألوان قبل البدء.
    - q: هل الزيارة والقياس مجانًا؟
      a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Classic Carved Living Room Rug in Gold and Navy
  directAnswer: A classic custom rug with a round cream centre framed by scrolls in gold, navy and light grey, inside a stepped navy and gold border. Hand-carved in several layers so the scrolls stand out. Made to the size and shape you want. Priced by size and design; we confirm on WhatsApp.
  usage: Suits classic living rooms with gilded furniture and navy cushions.
  care: Vacuum regularly along the pile and blot spills straight away without rubbing so the carved edges stay crisp.
  seoTitle: Classic Carved Living Room Rug in Gold and Navy in Kuwait | Sajjadko
  seoDescription: Classic Carved Living Room Rug in Gold and Navy, hand-carved in our workshop in your design and colours for living rooms, majlis and diwaniya in Kuwait.
  reviewed: true
  faq:
    - q: How much is it?
      a: Priced by size, design size and number of colours. Send the design and size on WhatsApp for a price before we start.
    - q: Can I change the design or colours?
      a: Yes. We make this design in your colours or carve a design you send, and confirm the drawing and colours before starting.
    - q: Is the home visit and measuring free?
      a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
