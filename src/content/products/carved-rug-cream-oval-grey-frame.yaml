ar:
  name: زولية محفورة بإطار رمادي بيضاوي وحافة عنابية
  directAnswer: زولية تفصيل كريمية يتوسطها إطار بيضاوي رمادي، تتفرع منه أغصان رمادية وأوراق ذهبية وعنابية، ويحيط بها إطار بالذهبي والرمادي وحافة عنابية. الحفر يدوي بارتفاعات مختلفة للوبر. تُفصّل بالمقاس والشكل الذي تريده. السعر حسب المقاس وحجم النقشة، ونؤكده عبر واتساب.
  usage: العنابي يتناسق مع الكنب الأبيض والمخدات العنابية، والوسط الكريمي يبقي الصالة مضيئة.
  care: نظّفه بالمكنسة الكهربائية بانتظام في اتجاه الوبر، وامسح البقع فور وقوعها دون فرك حتى تبقى حواف الحفر واضحة.
  seoTitle: زولية محفورة بإطار رمادي بيضاوي وحافة عنابية في الكويت — سجادكو
  seoDescription: زولية محفورة بإطار رمادي بيضاوي وحافة عنابية، حفر يدوي في ورشتنا بالنقشة والألوان التي تختارها، للصالات والمجالس والديوانيات في الكويت. السعر حسب المقاس.
  reviewed: true
  faq:
    - q: كم سعره؟
      a: السعر حسب المقاس وحجم النقشة وعدد ألوانها. أرسل صورة النقشة والمقاس عبر واتساب ونرسل لك السعر قبل البدء.
    - q: هل أستطيع تغيير النقشة أو الألوان؟
      a: نعم، ننفذ النقشة نفسها بألوانك، أو نحفر نقشة ترسلها أنت، ونؤكد معك الرسم والألوان قبل البدء.
    - q: هل الزيارة والقياس مجانًا؟
      a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Carved Rug with an Oval Grey Frame and Burgundy Edge
  directAnswer: A custom cream rug centred on an oval grey frame branching into grey stems with gold and burgundy leaves, inside a gold and grey border with a burgundy edge. Hand-carved at varying pile heights. Made to the size and shape you want. Priced by size and design; we confirm on WhatsApp.
  usage: Burgundy picks up white sofas with burgundy cushions; the cream centre keeps the room bright.
  care: Vacuum regularly along the pile and blot spills straight away without rubbing so the carved edges stay crisp.
  seoTitle: Carved Rug with an Oval Grey Frame and Burgundy Edge | Sajjadko Kuwait
  seoDescription: Carved Rug with an Oval Grey Frame and Burgundy Edge, hand-carved in our workshop in your design and colours for living rooms, majlis and diwaniya in Kuwait.
  reviewed: true
  faq:
    - q: How much is it?
      a: Priced by size, design size and number of colours. Send the design and size on WhatsApp for a price before we start.
    - q: Can I change the design or colours?
      a: Yes. We make this design in your colours or carve a design you send, and confirm the drawing and colours before starting.
    - q: Is the home visit and measuring free?
      a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
