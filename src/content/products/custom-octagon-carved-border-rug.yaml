ar:
  name: زولية تفصيل مثمنة بإطار محفور بالبيج والأسود
  directAnswer: زولية تفصيل بشكل مثمن ووسط عاجي سادة، يحيط بها إطاران متداخلان بالبيج والأسود محفوران يدويًا، وتمتد أطرافها خارج الشكل لتعطي حدًا هندسيًا. مقصوصة على مقاس الصالة والكنب. من أعمالنا، ونفّذ الشكل والمقاس والألوان التي تختارها. السعر حسب المقاس.
  usage: الشكل المثمن يملأ المسافة بين الكنب في الصالات الطويلة، والإطار الأسود يحدد الزولية على البلاط الفاتح.
  care: نظّفه بالمكنسة الكهربائية بانتظام في اتجاه الوبر، وامسح البقع فور وقوعها دون فرك حتى تبقى حواف الحفر واضحة.
  seoTitle: زولية تفصيل مثمنة بإطار محفور في الكويت — سجادكو
  seoDescription: زولية تفصيل مثمنة عاجية بإطار محفور بالبيج والأسود، تُقص على مقاس الصالة. السعر حسب المقاس عبر واتساب.
  reviewed: true
  faq:
  - q: هل أستطيع اختيار نقشة أخرى أو لونًا آخر؟
    a: نعم. ترسل صورة النقشة أو فكرتها مع مقاس المجلس عبر واتساب، ونؤكد معك الألوان والمقاس والسعر قبل البدء.
  - q: كم سعره؟
    a: السعر حسب مساحة المجلس وحجم النقشة وعدد ألوانها. نزورك مجانًا للقياس وعرض العينات، ثم نرسل السعر.
en:
  name: Custom Octagonal Rug with a Carved Border
  directAnswer: A custom octagonal rug with a plain ivory centre and two interlocking beige and black borders, hand-carved, cut to fit the living room and sofas. One of our jobs, made in your shape, size and colours. Priced by size.
  usage: The octagon fills the space between sofas in long living rooms; the black border frames it on light tiles.
  care: Vacuum regularly along the pile and blot spills straight away without rubbing so the carved edges stay crisp.
  seoTitle: Custom Octagonal Carved Rug in Kuwait | Sajjadko
  seoDescription: Custom octagonal ivory rug with a carved beige and black border, cut to your room.
  reviewed: true
  faq:
  - q: Can I choose another design or colour?
    a: Yes. Send the design and your majlis size on WhatsApp and we confirm colours, size and price before starting.
