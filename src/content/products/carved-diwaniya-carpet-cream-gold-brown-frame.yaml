ar:
  name: سجاد حفر يدوي كريمي بإطار ذهبي وبني وصرة مزخرفة
  directAnswer: سجاد حفر يدوي بأرضية كريمية لامعة، بإطارين ذهبي وبني بزوايا مقصوصة منحنية، وفي الوسط صرة بزخارف بنية وذهبية ملتفة. محفور يدويًا بمقاس كبير، ويُفصّل بالمقاس والألوان، والسعر حسب المواصفات عبر واتساب.
  usage: المقاس الكبير والإطار المزدوج يناسبان الديوانيات والمجالس الواسعة.
  care: نظّفه بالمكنسة الكهربائية بانتظام في اتجاه الوبر، وامسح البقع فور وقوعها دون فرك حتى تبقى حواف الحفر واضحة.
  seoTitle: سجاد ديوانية حفر يدوي كريمي بإطار ذهبي — حفر يدوي بالكويت
  seoDescription: سجاد حفر يدوي كريمي لامع بإطارين ذهبي وبني وصرة مزخرفة، تفصيل سجاد للديوانيات والمجالس الكبيرة في الكويت.
  reviewed: true
  faq:
  - q: كم سعره؟
    a: السعر حسب المقاس وحجم النقشة وعدد ألوانها والمواصفات التي تختارها. أرسل المقاس عبر واتساب ونرسل لك السعر قبل البدء.
  - q: هل أستطيع تغيير النقشة أو الألوان؟
    a: نعم، ننفذ النقشة نفسها بألوانك أو بمقاس مختلف، أو نحفر نقشة ترسلها أنت، ونؤكد معك الرسم والألوان قبل البدء.
  - q: هل الزيارة والقياس مجانًا؟
    a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Cream Hand-Carved Diwaniya Carpet with a Gold and Brown Frame
  directAnswer: A hand-carved carpet with a glossy cream ground, gold and brown frames with curved cut corners and a centre medallion of brown and gold scrolls. Carved by hand in a large size and made to your room and colours; priced by specification on WhatsApp.
  usage: The large size and double frame suit diwaniyas and spacious majlis rooms.
  care: Vacuum regularly along the pile and blot spills straight away without rubbing so the carved edges stay crisp.
  seoTitle: Cream Hand-Carved Diwaniya Carpet, Gold Frame | Sajjadko
  seoDescription: Glossy cream hand-carved carpet with gold and brown frames and a scroll medallion, made to size for diwaniyas in Kuwait.
  reviewed: true
  faq:
  - q: How much is it?
    a: Priced by size, design size, number of colours and the specification you choose. Send the size on WhatsApp for a price before we start.
  - q: Can I change the design or colours?
    a: Yes. We make this design in your colours or size, or carve a design you send, and confirm the drawing and colours before starting.
  - q: Is the home visit and measuring free?
    a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
