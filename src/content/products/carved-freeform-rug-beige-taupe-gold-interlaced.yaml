ar:
  name: زولية صالة بشكل حر بخطوط متشابكة محفورة بيج وذهبي
  directAnswer: زولية تفصيل كبيرة بشكل حر بأطراف منحنية، تلتف عليها خطوط عريضة متشابكة محفورة بالبيج الداكن والرمادي البني مع خطوط رفيعة ذهبية فوق أرضية عاجية. حفر يدوي في ورشتنا بالمقاس والشكل الذي تريده. السعر حسب المقاس وحجم النقشة، ونؤكده عبر واتساب.
  usage: الألوان الترابية والخطوط المتشابكة تناسب الصالات الواسعة والمداخل مع الكنب المنحني والأرضيات الرخامية.
  care: نظّفه بالمكنسة الكهربائية بانتظام في اتجاه الوبر، وامسح البقع فور وقوعها دون فرك حتى تبقى حواف الحفر واضحة.
  seoTitle: زولية صالة بشكل حر بخطوط متشابكة محفورة في الكويت — سجادكو
  seoDescription: زولية صالة بشكل حر بخطوط متشابكة محفورة بيج وذهبي، سجاد حفر يدوي بالمقاس والشكل والألوان التي تختارها للصالات في الكويت. السعر حسب المقاس.
  reviewed: true
  faq:
    - q: كم سعره؟
      a: السعر حسب المقاس وحجم النقشة وعدد ألوانها. أرسل صورة النقشة والمقاس عبر واتساب ونرسل لك السعر قبل البدء.
    - q: هل أستطيع تغيير النقشة أو الألوان؟
      a: نعم، ننفذ النقشة نفسها بألوانك، أو نحفر نقشة ترسلها أنت، ونؤكد معك الرسم والألوان قبل البدء.
    - q: هل الزيارة والقياس مجانًا؟
      a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Free-form Living Room Rug with Carved Interlaced Beige and Gold Lines
  directAnswer: Large custom free-form rug with curved edges and broad carved interlaced bands in dark beige and taupe with fine gold lines over an ivory ground. Hand-carved in our workshop to your size and shape. Priced by size and design; we confirm on WhatsApp.
  usage: Earthy tones and interlaced lines suit large living rooms and entrance halls with curved sofas and marble floors.
  care: Vacuum regularly along the pile and blot spills straight away without rubbing so the carved edges stay crisp.
  seoTitle: Free-form Carved Living Room Rug, Beige and Gold, Kuwait
  seoDescription: Custom free-form living room rug with hand-carved interlaced beige and gold lines, made in our workshop to your size, shape and colours in Kuwait.
  reviewed: true
  faq:
    - q: How much is it?
      a: Priced by size, design size and number of colours. Send the design and size on WhatsApp for a price before we start.
    - q: Can I change the design or colours?
      a: Yes. We make this design in your colours or carve a design you send, and confirm the drawing and colours before starting.
    - q: Is the home visit and measuring free?
      a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
