ar:
  name: سجاد مسجد أزرق بنقش هندسي وفواصل صفوف ذهبية
  directAnswer: 'سجاد مساجد ومصليات أزرق بنقش هندسي إسلامي بخطوط كحلية، تفصل بين صفوفه أشرطة ذهبية مزخرفة بالورد تحدد الصفوف بوضوح. السعر 7 د.ك للمتر المربع للوسط و9 د.ك للسميك، ويُقص حسب مساحة المسجد أو المصلى مع محاذاة الصفوف للقبلة والتركيب في الكويت.'
  usage: الأزرق مع الفواصل الذهبية يناسب المساجد والجوامع الحديثة ومصليات الشركات والمدارس، والفواصل الطولية تجعل الصفوف مستقيمة وواضحة للمصلين.
  care: نظّفه بالمكنسة الكهربائية بانتظام، وامسح البقع فور وقوعها بقطعة قماش مبللة دون فرك.
  seoTitle: سجاد مسجد أزرق بفواصل صفوف — 7 و9 د.ك للمتر
  seoDescription: سجاد مسجد أزرق بنقش هندسي وفواصل صفوف ذهبية، فرش مسجد ومصلى بالمتر المربع 7 د.ك للوسط و9 للسميك، مع القياس ومحاذاة القبلة والتركيب في الكويت.
  reviewed: true
  faq:
    - q: كم سعر هذا السجاد للمسجد بالمتر؟
      a: 7 د.ك للمتر المربع للوسط و9 د.ك للسميك. فرش قاعة مساحتها 180 م² يكلف 1,260 د.ك بالوسط أو 1,620 د.ك بالسميك قبل التركيب.
    - q: هل يناسب المصليات الصغيرة؟
      a: نعم، نقصه حسب مقاس المصلى في الشركات والمدارس والبيوت، مع محاذاة الصفوف للقبلة.
    - q: هل تُحاذى الصفوف مع القبلة؟
      a: نعم، نقيس القاعة في الموقع ونحدد القبلة، ونقص السجاد بحيث تكون الفواصل الذهبية مستقيمة ومحاذية للقبلة، ونراجع القياس مع صاحب الطلب قبل القص.
en:
  name: Blue Mosque Carpet with Geometric Pattern and Gold Row Dividers
  directAnswer: 'Blue mosque and prayer room carpet with a navy Islamic geometric pattern, with gold floral strips dividing the prayer rows. 7 KWD per m² for medium and 9 KWD per m² for thick, cut to the size of the mosque or prayer room, aligned with the qibla and installed in Kuwait.'
  usage: Blue with gold dividers suits modern mosques and prayer rooms in companies and schools, and the lengthwise dividers keep the rows straight and clear.
  care: Vacuum regularly and blot spills straight away with a damp cloth.
  seoTitle: Blue Mosque Carpet with Gold Row Dividers, Kuwait | Sajjadko
  seoDescription: Blue mosque carpet with an Islamic geometric pattern and gold row dividers, 7 KWD per m² medium and 9 thick, with measuring, qibla alignment and fitting in Kuwait.
  reviewed: true
  faq:
    - q: How much is this mosque carpet per m²?
      a: 7 KWD per m² for medium and 9 KWD for thick. A 180 m² hall costs 1,260 KWD in medium or 1,620 KWD in thick before installation.
    - q: Are the rows aligned with the qibla?
      a: Yes. We measure the hall on site, find the qibla and cut the carpet so the gold dividers run straight and aligned with it.
