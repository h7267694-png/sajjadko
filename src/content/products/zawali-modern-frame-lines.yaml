ar:
  name: زولية حديثة بإطارات خطوط متدرجة بثلاثة ألوان
  directAnswer: 'زولية جاهزة بتصميم حديث: أرضية باهتة متدرجة تحيط بها إطارات من خطوط متوازية تتدرج في الطول، بثلاثة ألوان: العاجي مع الرمادي الفاتح، والعاجي مع البني الفاتح، والرمادي مع الأسود والأبيض. تناسب الصالات وغرف النوم والمجالس الحديثة. السعر حسب المقاس، ونؤكده عبر واتساب.'
  usage: التصميم الخطي الهادئ يناسب الأثاث الحديث والجدران الفاتحة. الرمادي مع الأسود يناسب المساحات ذات اللمسات الداكنة، والعاجي مع البني يناسب الخشب والبيج.
  care: نظّفها بالمكنسة الكهربائية بانتظام، وامسح البقع فور وقوعها بقطعة قماش مبللة دون فرك، وأدرها كل بضعة أشهر ليتوزع أثر المشي.
  seoTitle: زولية حديثة بإطارات خطوط متدرجة في الكويت — سجادكو
  seoDescription: زولية جاهزة حديثة بإطارات خطوط متدرجة بالعاجي والرمادي والبني والأسود للصالات وغرف النوم. السعر حسب المقاس عبر واتساب.
  reviewed: true
  faq:
    - q: كم سعر هذه الزولية؟
      a: السعر حسب المقاس المتوفر أو المطلوب. أرسل المقاس الذي تحتاجه عبر واتساب، ونؤكد لك المتوفر والسعر.
    - q: ما المقاسات المتوفرة؟
      a: 'نؤكد المقاسات المتوفرة من هذا التصميم عبر واتساب. والمقاسات الشائعة للزوالي الجاهزة: 160×230 و200×300 و240×340 و300×400 سم.'
en:
  name: Modern Rug with Stepped Line Frames in Three Colours
  directAnswer: 'This is a ready-made rug with a modern design: a faded, graded ground framed by parallel lines of stepped length, in ivory with light grey, ivory with light brown, or grey with black and white. It suits living rooms, bedrooms and modern majlis rooms. Priced by size, confirmed on WhatsApp.'
  usage: The calm linear design suits modern furniture and light walls. Grey with black suits rooms with dark accents; ivory with brown suits wood and beige.
  care: Vacuum regularly, blot spills straight away with a damp cloth and rotate the rug every few months.
  seoTitle: Modern Rug with Stepped Line Frames, Kuwait | Sajjadko
  seoDescription: Ready-made modern rug with stepped line frames in ivory, grey, brown and black for living rooms and bedrooms. Priced by size on WhatsApp.
