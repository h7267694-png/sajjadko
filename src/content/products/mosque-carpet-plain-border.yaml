ar:
  name: سجاد مسجد سادة بإطار زخرفي سفلي
  directAnswer: سجاد مساجد بصفوف بأرضية سادة وإطار زخرفي هندسي في أسفل كل صف يحدد موضع السجود، بعدة ألوان منها العنابي والأحمر والأزرق الفاتح والأزرق المخضر والكحلي والرمادي. رول بعرض 1.33 م أو 4 م، والسعر 6 أو 7 أو 8 د.ك للمتر المربع حسب السماكة، مع القياس ومحاذاة الصفوف مع القبلة والتركيب.
  usage: الأرضية السادة تعطي المسجد مظهرًا هادئًا وتناسب المصليات في الشركات والمدارس، والإطار السفلي يبقي الصفوف واضحة.
  care: نظّفه بالمكنسة الكهربائية بانتظام، وامسح البقع فور وقوعها بقطعة قماش مبللة دون فرك.
  seoTitle: سجاد مسجد سادة بإطار سفلي في الكويت — سجادكو
  seoDescription: سجاد مساجد ومصليات بصفوف سادة بإطار زخرفي سفلي بالعنابي والأزرق والكحلي والرمادي، من 6 إلى 8 د.ك للمتر المربع مع محاذاة القبلة.
  reviewed: true
  faq:
    - q: كم سعر سجاد المسجد بالمتر؟
      a: 6 د.ك للخفيف و7 للوسط و8 للسميك للمتر المربع، والسعر نفسه لرول 1.33 م ورول 4 م. قاعة 180 م² تكلف بين 1,080 و1,440 د.ك قبل التركيب.
    - q: هل تُحاذى الصفوف مع القبلة؟
      a: نعم، نقيس القاعة في الموقع ونحدد القبلة، ونقص الرول بحيث يكون كل صف بعرض 1.33 م ومحاذيًا للقبلة، ونراجع القياس مع صاحب الطلب قبل القص.
    - q: هل يناسب مصليات الشركات والمدارس؟
      a: نعم، الأرضية السادة هادئة وتناسب غرف الصلاة في المباني، ونفصّل السجاد على مقاس المصلى.
en:
  name: Plain Mosque Carpet with a Decorative Border
  directAnswer: This is mosque carpet in prayer rows with a plain field and a geometric border at the bottom of each row marking the place of prostration, in colours including burgundy, red, light blue, teal, navy and grey. Rolls are 1.33 m or 4 m wide, at 6, 7 or 8 KWD per m² by thickness, with measuring, qibla alignment and installation.
  usage: The plain field gives the mosque a calm look and suits prayer rooms in companies and schools, while the lower border keeps rows clear.
  care: Vacuum regularly and blot spills straight away with a damp cloth.
  seoTitle: Plain Mosque Carpet with Border in Kuwait | Sajjadko Kuwait
  seoDescription: Plain mosque and prayer room carpet in rows with a decorative border in burgundy, blue, navy and grey, 6 to 8 KWD per m² with qibla alignment.
  reviewed: true
  faq:
    - q: How much is mosque carpet per m²?
      a: 6 KWD light, 7 medium and 8 thick per m², the same for 1.33 m and 4 m rolls. A 180 m² hall costs about 1,080 to 1,440 KWD before installation.
    - q: Are the rows aligned with the qibla?
      a: Yes. We measure the hall on site, find the qibla and cut the roll so each 1.33 m row is aligned with it, confirming measurements before cutting.
