ar:
  name: موكيت بيج مخملي للصالة والممر وغرفة النوم
  directAnswer: 'موكيت بيج مخملي ركّبناه من الجدار للجدار في بيت بمنطقة الأندلس: صالة بجدار منحني، وممر، وغرفة نوم مع غرفة ملابس. قصصناه على انحناء الجدار وحواف الخزائن بدقة، وركّبنا نهاية ذهبية معدنية عند البلاط. السعر من 5 إلى 15 د.ك للمتر المربع حسب السماكة والكثافة، والقياس مجاني.'
  usage: فرش الصالة والممر والغرف بلون واحد يجعل البيت متصلًا وأوسع بصريًا. البيج الفاتح يتناسق مع الخشب الرمادي والستائر البنية، والوبر الكثيف مريح في غرف الملابس والنوم.
  care: نظّفه بالمكنسة الكهربائية مرة أو مرتين أسبوعيًا، وامسح البقع فور وقوعها بقطعة قماش مبللة دون فرك.
  seoTitle: موكيت صالة وممر وغرفة نوم في الأندلس — سجادكو
  seoDescription: تركيب موكيت بيج مخملي من الجدار للجدار لصالة وممر وغرفة نوم في الأندلس، مقصوص على الجدار المنحني والخزائن. من 5 إلى 15 د.ك للمتر.
  reviewed: true
  faq:
  - q: هل تقصون الموكيت على الجدران المنحنية والخزائن؟
    a: 'نعم، نقص الموكيت على شكل المكان مهما كان: الجدران المنحنية، وحواف الخزائن المثبتة، والأعمدة، حتى يلتصق بالحواف دون فراغات.'
  - q: كم يكلف فرش صالة وممر وغرفة؟
    a: نجمع مساحات الأماكن بالمتر المربع، والسعر من 5 إلى 15 د.ك للمتر حسب السماكة والكثافة. نقيس مجانًا ونرسل السعر قبل البدء.
  - q: هل الزيارة والقياس مجانًا؟
    a: نعم، مندوبنا يزورك مجانًا للقياس وعرض العينات، ثم نرسل لك السعر عبر واتساب قبل أي التزام.
en:
  name: Beige Plush Carpet for Living Room, Hallway and Bedroom
  directAnswer: 'Beige plush carpet we fitted wall to wall in a house in Andalous: a living room with a curved wall, a hallway, and a bedroom with a dressing area. It was cut precisely to the curve and the wardrobe edges, with a gold metal trim at the tiles. 5 to 15 KWD per m² depending on thickness and density, with free measuring.'
  usage: One colour across living room, hallway and bedrooms makes the house feel continuous and larger. Light beige suits grey wood and brown curtains.
  care: Vacuum once or twice a week and blot spills straight away with a damp cloth without rubbing.
  seoTitle: Living Room, Hallway and Bedroom Carpet in Andalous | Sajjadko
  seoDescription: Beige plush wall-to-wall carpet fitted in a living room, hallway and bedroom in Andalous, Kuwait. 5 to 15 KWD per m².
  reviewed: true
  faq:
  - q: How much does it cost?
    a: We add up the areas in square metres; carpet is 5 to 15 KWD per m². Measuring is free and we send the price before starting.
  - q: Can you fit carpet around curved walls and wardrobes?
    a: Yes. We cut the carpet to any shape, including curved walls and fitted wardrobes, so it meets the edges without gaps.
  - q: Is the home visit and measuring free?
    a: Yes. Our representative visits you free of charge to measure and show samples, then we send the price on WhatsApp before you commit.
