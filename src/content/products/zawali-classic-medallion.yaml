ar:
  name: زولية كلاسيكية بصرة ونقوش زهور دقيقة
  directAnswer: 'زولية جاهزة بتصميم كلاسيكي: صرة في الوسط ونقوش زهور وأغصان دقيقة وإطار متعدد الطبقات، بلونين: الكريمي مع البني الفاتح والأزرق، والرمادي الفاتح مع البيج. تناسب المجالس والصالات. السعر حسب المقاس، ونؤكده عبر واتساب.'
  usage: النقش الكلاسيكي الدقيق يناسب المجالس العربية والكنب الفاتح، والرمادي الفاتح يناسب المجالس الحديثة ذات الجدران البيضاء.
  care: نظّفها بالمكنسة الكهربائية بانتظام، وامسح البقع فور وقوعها بقطعة قماش مبللة دون فرك، وأدرها كل بضعة أشهر ليتوزع أثر المشي.
  seoTitle: زولية كلاسيكية بصرة ونقوش دقيقة في الكويت — سجادكو
  seoDescription: زولية جاهزة كلاسيكية بصرة ونقوش زهور دقيقة بالكريمي والبني والأزرق أو الرمادي والبيج للمجالس والصالات. السعر حسب المقاس.
  reviewed: true
  faq:
    - q: كم سعر هذه الزولية؟
      a: السعر حسب المقاس المتوفر أو المطلوب. أرسل المقاس الذي تحتاجه عبر واتساب، ونؤكد لك المتوفر والسعر.
    - q: ما المقاسات المتوفرة؟
      a: 'نؤكد المقاسات المتوفرة من هذا التصميم عبر واتساب. والمقاسات الشائعة للزوالي الجاهزة: 160×230 و200×300 و240×340 و300×400 سم.'
en:
  name: Classic Rug with a Medallion and Fine Floral Pattern
  directAnswer: 'This is a ready-made rug with a classic design: a central medallion, fine floral and branch patterns and a layered border, in cream with light brown and blue, or light grey with beige. It suits majlis rooms and living rooms. Priced by size, confirmed on WhatsApp.'
  usage: The fine classic pattern suits Arabic majlis rooms and light sofas; light grey suits modern majlis rooms with white walls.
  care: Vacuum regularly, blot spills straight away with a damp cloth and rotate the rug every few months.
