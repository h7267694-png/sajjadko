name: Build, verify, deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 1) فحص المحتوى (SKU فريد، ثبات الروابط) ثم البناء ثم حواجز الجودة
      - run: npm run check:astro
      - run: npm run check:content
      - run: npm run build
      - run: npm run check:quality
      # 2) ميزانية الأداء الآلية (LCP و CLS على الجوال). يفشل النشر عند التجاوز
      - run: npx --yes @lhci/cli@0.15.1 autorun
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
